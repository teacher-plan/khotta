<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;700;800;900&display=swap">
<style>
:root{--bg:#F5ECD7;--ink:#1E1B18;--coral:#EC5B4F;--coral2:#F7B8AE;--green:#2E9E5B;--paper:#FFFDF8;--mut:#6b6359}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--bg)}
body{font-family:'Cairo',sans-serif;color:var(--ink);position:relative}
#bg{position:absolute;inset:0;
  background-image:radial-gradient(circle,#d9cbb0 1.3px,transparent 1.6px),radial-gradient(circle,#e8dcc4 1px,transparent 1.2px);
  background-size:36px 36px,36px 36px;background-position:0 0,18px 18px}
.blob{position:absolute;border-radius:50%;background:var(--coral2);opacity:.55}
.ring{position:absolute;border-radius:50%;border:3px solid var(--coral2);opacity:.8}
.doodle{position:absolute}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
/* top strip */
#top{position:absolute;top:26px;left:0;right:0;display:flex;justify-content:center;z-index:5}
.tag{font-weight:800;font-size:15px;background:var(--paper);border:2.5px solid var(--ink);border-radius:30px;padding:3px 14px;box-shadow:3px 3px 0 var(--ink)}
/* building blocks */
.title{font-family:'Lalezar',serif;font-size:58px;line-height:1.15;text-align:center}
.pill{display:inline-block;font-weight:900;color:#fff;background:var(--coral);border:3px solid var(--ink);border-radius:40px;padding:4px 22px;box-shadow:4px 4px 0 var(--ink);font-size:24px}
.pill.w{background:var(--paper);color:var(--ink)}
.card{background:var(--paper);border:3.5px solid var(--ink);border-radius:18px;box-shadow:7px 7px 0 var(--ink);overflow:hidden}
.card .hd{background:var(--coral);color:#fff;font-family:'Lalezar',serif;font-size:36px;text-align:center;padding:10px 12px 4px;border-bottom:3.5px solid var(--ink)}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 14px;margin:12px 16px;font-weight:900;font-size:26px;min-height:58px;box-shadow:3px 3px 0 var(--ink)}
.chk{width:38px;height:38px;flex:none;margin-inline-start:auto}
.qimg{display:block;width:100%;border-bottom:3px solid var(--ink)}
.qhd{display:flex;align-items:center;justify-content:space-between;background:var(--coral);color:#fff;border-bottom:3.5px solid var(--ink);padding:8px 14px 4px}
.qhd b{font-family:'Lalezar',serif;font-size:32px;font-weight:400}
.mark{background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:20px;font-weight:900;font-size:16px;padding:1px 10px}
.math{font-weight:900;font-size:40px;text-align:center;direction:rtl;unicode-bidi:isolate}
.ok{color:var(--green)} .no{color:var(--coral)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 4px}
.frac span:first-child{border-bottom:3.5px solid var(--ink);padding:0 6px}
.hl{background:#FFD84D;border-radius:6px;padding:0 3px;box-shadow:0 0 0 2px var(--ink) inset}
.hl.no{background:transparent;box-shadow:none}
.note{font-weight:800;font-size:21px;text-align:center;color:var(--mut)}
.ans{display:inline-block;background:#E4F5EA;border:3px solid var(--green);border-radius:14px;padding:2px 16px;color:var(--green)}
/* عمودٌ مرتّب لكل مشهد: العناصر تتتابع بمسافة ثابتة فلا تتراكب أبداً (المنطقة الآمنة 84–800) */
.stack{position:absolute;left:30px;right:30px;top:84px;bottom:160px;display:flex;flex-direction:column;align-items:stretch;gap:16px}
.stack>*{flex:none}
.center{text-align:center}
/* لوحة المنازل */
.pv{display:flex;direction:ltr;justify-content:center;align-items:flex-end;gap:8px}
.pvc{display:flex;flex-direction:column;align-items:center;gap:6px;width:54px}
.pvlab{font-size:12px;font-weight:800;color:var(--mut);height:30px;display:flex;align-items:flex-end;justify-content:center;text-align:center;line-height:1.15;width:100%}
.pvbox{width:54px;height:62px;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:38px;transition:none}
.pvbox.tgt{border-color:var(--coral);box-shadow:inset 0 0 0 3px var(--coral)}
.pvbox.dec{background:#FFD84D}
.pvsep{font-weight:900;font-size:40px;line-height:62px;height:62px;width:12px;text-align:center}
.steprow{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:900;font-size:28px;box-shadow:3px 3px 0 var(--ink)}
.steprow .mark{flex:none}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chips .mark{font-size:14px}
.nw,.mark,.qhd b,.pill{white-space:nowrap}
/* شبكة التظليل وهرم الأعداد والأشكال المظلّلة */
.grid{display:grid;gap:0;justify-content:center;margin:0 auto;border:3px solid var(--ink)}
.gc{width:44px;height:44px;border:1.5px solid var(--ink);background:#fff}
.gc.dec{background:var(--coral)}
.pyr{display:flex;flex-direction:column;align-items:center;gap:0}
.pyr .r{display:flex;direction:rtl}
.pyr .b{width:84px;height:58px;border:3px solid var(--ink);margin:-1.5px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px}
.bars{display:flex;direction:rtl;justify-content:center;gap:18px}
.bar{display:grid;grid-template-columns:repeat(2,26px);border:3px solid #5B3A3A}
.bar i{display:block;width:26px;height:26px;border:1.5px solid #5B3A3A;background:#fff}
.bar i.on{background:#8E9AB8}
bdi{unicode-bidi:isolate}
.L{direction:ltr;unicode-bidi:isolate;display:inline-block}
</style></head>
<body>
<div id="bg"></div>
<!-- decorative layer: doodles drawn by us -->
<div class="blob" style="width:70px;height:70px;left:-50px;top:430px"></div>
<div class="blob" style="width:44px;height:44px;right:-32px;top:640px"></div>
<div class="ring" style="width:22px;height:22px;left:4px;top:660px"></div>
<div class="ring" style="width:20px;height:20px;right:5px;top:250px"></div>
<svg class="doodle" data-wob="1" style="left:-14px;top:-12px;width:96px" viewBox="0 0 150 110"><g stroke="#1E1B18" stroke-width="4" stroke-linejoin="round"><path d="M10 30 L70 18 L75 92 L15 100 Z" fill="#fff"/><path d="M70 18 L135 30 L130 104 L75 92 Z" fill="#fff"/></g><g stroke="#EC5B4F" stroke-width="4" stroke-linecap="round"><path d="M24 40 L60 33M25 52 L61 45M26 64 L62 57M27 76 L63 69M86 34 L120 41M86 46 L120 53M87 58 L120 65M87 70 L119 77"/></g></svg>
<svg class="doodle" data-wob="2" style="right:-8px;top:8px;width:104px" viewBox="0 0 150 80"><g stroke="#1E1B18" stroke-width="4" stroke-linejoin="round"><path d="M8 20 L110 46 L104 66 L2 40 Z" fill="#EC5B4F"/><path d="M110 46 L140 62 L104 66 Z" fill="#F5DDB9"/><path d="M132 58 L140 62 L130 63Z" fill="#1E1B18"/><path d="M8 20 L2 40" /></g></svg>
<svg class="doodle" data-wob="3" style="left:-12px;bottom:40px;width:130px" viewBox="0 0 150 80"><g stroke="#1E1B18" stroke-width="4" stroke-linejoin="round" transform="rotate(-12 75 40)"><path d="M8 20 L110 46 L104 66 L2 40 Z" fill="#EC5B4F"/><path d="M110 46 L140 62 L104 66 Z" fill="#F5DDB9"/><path d="M132 58 L140 62 L130 63Z" fill="#1E1B18"/></g></svg>
<svg class="doodle" data-wob="4" style="right:-20px;bottom:30px;width:140px" viewBox="0 0 150 110"><g stroke="#1E1B18" stroke-width="4" stroke-linejoin="round"><path d="M10 30 L70 18 L75 92 L15 100 Z" fill="#fff"/><path d="M70 18 L135 30 L130 104 L75 92 Z" fill="#fff"/></g><g stroke="#EC5B4F" stroke-width="4" stroke-linecap="round"><path d="M24 40 L60 33M25 52 L61 45M26 64 L62 57M86 34 L120 41M86 46 L120 53M87 58 L120 65"/></g></svg>
<div id="top"><span class="tag">__TAG__</span></div>
__SCENES__
<script>
const DURS=__DURS__;window.DURS=DURS;
const C=(x)=>Math.max(0,Math.min(1,x));
const back=(p)=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const out=(p)=>1-Math.pow(1-p,3);
const scenes=[...document.querySelectorAll('.scene')];
const totalBefore=i=>DURS.slice(0,i).reduce((a,b)=>a+b,0);
window.seek=(i,t)=>{
  scenes.forEach((s,k)=>s.classList.toggle('on',k===i));
  const g=totalBefore(i)+t;
  document.querySelectorAll('[data-wob]').forEach(d=>{const n=+d.dataset.wob;d.style.transform=`translateY(${Math.sin(g/900+n)*5}px) rotate(${Math.sin(g/1300+n*2)*3}deg)`});
  scenes[i].querySelectorAll('[data-t]').forEach(el=>{
    const t0=+el.dataset.t*1000, fx=el.dataset.fx||'pop', p=C((t-t0)/(fx==='draw'?450:380));
    if(fx==='pop'){el.style.opacity=p>0?1:0;el.style.transform=`scale(${p>0?back(p):0})`}
    else if(fx==='up'){el.style.opacity=out(p);el.style.transform=`translateY(${(1-out(p))*40}px)`}
    else if(fx==='fade'){el.style.opacity=out(p)}
    else if(fx==='wipe'){el.style.clipPath=`inset(0 0 0 ${(1-out(p))*100}%)`}
    else if(fx==='hl'){el.classList.toggle('no',p<=0)}
    else if(fx==='tgt'||fx==='dec'){el.classList.toggle(fx,p>0)}
    else if(fx==='draw'){el.querySelectorAll('path').forEach(pa=>{const L=pa.getTotalLength();pa.style.strokeDasharray=L;pa.style.strokeDashoffset=L*(1-out(p))})}
  });
};
function arcs(){document.querySelectorAll('svg[data-arcs]').forEach(sv=>{
  const box=sv.parentElement,sc=box.closest('.scene'),was=sc.classList.contains('on');sc.classList.add('on');
  const b=box.getBoundingClientRect(),c=k=>{const r=box.querySelector('[data-k="'+k+'"]').getBoundingClientRect();return r.left+r.width/2-b.left};
  const y=+sv.getAttribute('height'),a=c('a');
  sv.setAttribute('viewBox','0 0 '+b.width+' '+y);sv.setAttribute('width',b.width);
  const ps=sv.querySelectorAll('path');['t1','t2'].forEach((k,i)=>{const x=c(k),h=i?y*1.6:y*0.9;ps[i].setAttribute('d',`M${a} ${y-2} Q${(a+x)/2} ${y-2-h} ${x} ${y-2}`)});
  if(!was)sc.classList.remove('on');});}
window.relayout=arcs;
document.fonts.ready.then(()=>{arcs();seek(0,0)});
seek(0,0);
</script>
</body></html>
