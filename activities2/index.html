<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>أنشطة الحلقة الثانية</title>
<link rel="stylesheet" href="_kit.css"/>
<style>
body{overflow:auto}
.wrap{max-width:1150px;margin:0 auto;padding:24px 16px 40px}
h1{text-align:center;font-size:clamp(28px,4vw,46px);margin:6px 0}
.sub{text-align:center;opacity:.75;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.grid a{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px;box-shadow:var(--sh);border-top:8px solid var(--c)}
.grid a:hover{transform:translateY(-2px)}
.grid .e{font-size:40px;line-height:1}
.grid b{font-size:20px}
.grid small{opacity:.75;font-size:15px;line-height:1.5}
.grid i{font-style:normal;font-weight:800;font-size:13.5px;color:var(--c)}
</style>
</head>
<body>
<div class="wrap">
<h1>أنشطة الحلقة الثانية</h1>
<p class="sub">عشرة أنشطة تفتح آفاقاً جديدة — تفكير، وتقنية، واقتصاد، وحوار، وابتكار</p>
<div class="grid" id="g"></div>
</div>
<script>
const A=[
 ['01-fort-escape.html','🏰','الهروب من القلعة','غرفة هروب: شيفرة ومربّع سحري واستنتاج منطقي','التفكير المنطقي','#8A5A1E'],
 ['02-news-detective.html','🕵️','محقّق الأخبار','اكشف علامات التحذير قبل أن تصدّق أو تنشر','الثقافة الإعلامية','#1F5FD1'],
 ['03-code-the-robot.html','🤖','برمج الروبوت','خوارزميات وتكرار وتصحيح أخطاء بلا حاسوب','التفكير الحاسوبي','#0E7C66'],
 ['04-startup-market.html','🚀','سوق المشاريع الناشئة','مشكلة حقيقية ومورد محدود وجولة استثمار','ريادة الأعمال','#6B3FD1'],
 ['05-smart-budget.html','💰','ميزانيتي الذكية','ثلاثة أشهر من القرارات المالية وحلمٌ واحد','الثقافة المالية','#1E8A55'],
 ['06-debate-arena.html','⚖️','ساحة المناظرة','مناظرة منظّمة يفوز فيها من يغيّر الآراء','الحوار والإقناع','#2B3A67'],
 ['07-mars-mission.html','🪐','مهمة إلى المريخ','٢٠ كغ فقط — والعلم يحدّد ما ينفع','اتخاذ القرار','#C2502B'],
 ['08-cyber-guardian.html','🛡️','الحارس الرقمي','كلمات المرور ورسائل التصيّد','الأمن الرقمي','#127C8A'],
 ['09-estimation-challenge.html','🧮','تحدّي التقدير الذكي','أسئلة فيرمي: كيف تقترب من المجهول','الحسّ العددي','#6B3FD1'],
 ['10-innovation-lab.html','🧠','مختبر الابتكار','التفكير التصميمي بخمس مراحل ومعرض','الابتكار','#6B3FD1'],
];
const q=location.search;
document.getElementById('g').innerHTML=A.map(([f,e,t,d,k,c])=>`<a href="${f}${q}" style="--c:${c}"><span class="e">${e}</span><b>${t}</b><small>${d}</small><i>${k}</i></a>`).join('');
</script>
</body>
</html>
