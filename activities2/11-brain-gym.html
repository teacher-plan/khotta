<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>صالة العقل</title>
<link rel="stylesheet" href="_kit.css"/>
<style>
.qcard{width:100%;max-width:1050px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh2);padding:clamp(20px,3vw,40px);text-align:center;animation:up .4s both}
.qtype{display:inline-block;font-weight:700;color:var(--a);background:color-mix(in srgb,var(--a) 10%,white);border-radius:99px;padding:4px 14px;margin-bottom:10px}
.qtext{font-size:clamp(22px,3.2vw,40px);font-weight:600;line-height:1.55;text-wrap:balance}
.qbig{font-size:clamp(34px,5.4vw,66px);font-weight:700;letter-spacing:.06em;margin-top:10px;line-height:1.3}
.mx{display:inline-grid;grid-template-columns:repeat(3,clamp(64px,8vw,100px));gap:8px;margin-top:12px;direction:rtl}
.mx div{aspect-ratio:1;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;font-size:clamp(30px,4.2vw,52px);font-weight:700;background:var(--sand)}
.mx div.q{background:linear-gradient(135deg,#FFE7A3,var(--gold))}
.opts .btn{font-size:clamp(19px,2.4vw,30px)}
.streak{font-weight:700;color:var(--warn)}
</style>
</head>
<body>
<script src="_kit.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   الحلقة الثانية — صالة العقل
   تمارين عقلية متنوّعة الأنواع في كل جولة: متتاليات، وقياس تمثيلي،
   واستنتاج منطقي، ومصفوفات أنماط، ومسائل «الفخّ» التي تعاقب الإجابة
   السريعة (المضرب والكرة، والآلات الخمس)، وتفكير جانبي. ثلاثة مستويات.
   الهدف ليس الإجابة بل «كيف فكّرت؟» — الشرح يظهر بعد كل سؤال.
   كل إجابةٍ محسوبةٌ ومبرهنةٌ في حقل why.
   ═══════════════════════════════════════════════════════════════════ */
const MX = (cells) => `<div class="mx">${cells.map(c => `<div class="${c === '؟' ? 'q' : ''}">${c}</div>`).join('')}</div>`;
const SETS = {
  n: [
    { t: 'متتالية', q: 'ما العدد التالي؟', big: '٣ ، ٦ ، ١٢ ، ٢٤ ، ؟', o: ['٣٦', '٤٨', '٣٠', '٤٢'], a: 1, why: 'كل عددٍ ضعف الذي قبله: ٢٤ × ٢ = ٤٨.' },
    { t: 'قياس تمثيلي', q: 'يد : قفّاز = قدم : ؟', o: ['ساق', 'حذاء', 'مشي', 'أرض'], a: 1, why: 'القفّاز يُلبس على اليد ليحميها، والحذاء يُلبس على القدم ليحميها.' },
    { t: 'استنتاج منطقي', q: 'كل أعضاء فريق الروبوت يحبّون البرمجة. سالم يحبّ البرمجة. هل سالم في فريق الروبوت؟', o: ['نعم بالتأكيد', 'لا بالتأكيد', 'لا يمكن الجزم'], a: 2, why: 'الجملة تقول إن الفريق يحبّ البرمجة، لا أن كل من يحبّ البرمجة في الفريق. قد يحبّها سالم وهو خارج الفريق.' },
    { t: 'مصفوفة أنماط', q: 'ما الشكل الناقص؟', mx: ['🔺', '🔵', '⬛', '🔵', '⬛', '🔺', '⬛', '🔺', '؟'], o: ['🔺', '🔵', '⬛'], a: 1, why: 'كل صفٍّ وكل عمودٍ فيه الأشكال الثلاثة مرّة واحدة — الناقص في الصف الأخير 🔵.' },
    { t: 'مسألة عمرية', q: 'عمر الأب ٤٠ سنة وعمر ابنه ١٠. بعد كم سنة يصبح عمر الأب ضعف عمر ابنه؟', o: ['١٠', '١٥', '٢٠', '٣٠'], a: 2, why: 'بعد ٢٠ سنة: الأب ٦٠ والابن ٣٠، و٦٠ = ٢ × ٣٠. (المعادلة: ٤٠ + س = ٢ × (١٠ + س) ← س = ٢٠)' },
    { t: 'أيام', q: 'إذا كان «بعد غد» هو الأربعاء، فما اليوم الذي كان «قبل أمس»؟', o: ['الجمعة', 'السبت', 'الأحد', 'الاثنين'], a: 1, why: 'بعد غدٍ الأربعاء ← اليوم الاثنين ← أمس الأحد ← قبل أمس السبت.' },
    { t: 'متتالية', q: 'ما العدد التالي؟', big: '٢ ، ٣ ، ٥ ، ٧ ، ١١ ، ؟', o: ['١٢', '١٣', '١٥', '١٧'], a: 1, why: 'الأعداد الأوّلية (لا تقبل القسمة إلا على ١ ونفسها): بعد ١١ يأتي ١٣.' },
    { t: 'تفكير جانبي', q: 'ما الشيء الذي يكبر كلما أخذتَ منه؟', o: ['الماء', 'الحفرة', 'الوقت', 'المال'], a: 1, why: 'كلما أخذتَ تراباً من الحفرة كبرت! التفكير الجانبي يعني الخروج من المعنى الأول للكلمات.' },
  ],
  a: [
    { t: 'متتالية', q: 'ما العدد التالي؟', big: '٢ ، ٦ ، ١٢ ، ٢٠ ، ٣٠ ، ؟', o: ['٣٦', '٤٠', '٤٢', '٤٥'], a: 2, why: 'الفروق ٤، ٦، ٨، ١٠ ثم ١٢: ٣٠ + ١٢ = ٤٢. (وهي أيضاً ١×٢، ٢×٣، ٣×٤… ٦×٧)' },
    { t: 'فخّ التسرّع', q: '٥ آلات تصنع ٥ أدوات في ٥ دقائق. كم دقيقة تحتاج ١٠٠ آلة لصنع ١٠٠ أداة؟', o: ['١٠٠', '٥', '٢٠', '١'], a: 1, why: 'كل آلةٍ تصنع أداةً واحدة في ٥ دقائق. ١٠٠ آلة تعمل معاً فتصنع ١٠٠ أداة في الـ٥ دقائق نفسها.' },
    { t: 'فخّ التسرّع', q: 'مضربٌ وكرة ثمنهما معاً ريالٌ و١٠٠ بيسة. المضرب أغلى من الكرة بريالٍ واحد. كم ثمن الكرة؟', o: ['١٠٠ بيسة', '٥٠ بيسة', '١٠ بيسات', '٥ بيسات'], a: 1, why: 'لو كانت الكرة ١٠٠ بيسة لكان المضرب ١١٠٠ والمجموع ١٢٠٠ — خطأ! الكرة ٥٠ والمضرب ١٠٥٠، والمجموع ١١٠٠ بيسة.' },
    { t: 'نموّ مضاعف', q: 'زنابق في بحيرة تتضاعف مساحتها كل يوم، وتغطّي البحيرة كلّها في اليوم ٤٨. في أيّ يومٍ غطّت نصفها؟', o: ['٢٤', '٣٦', '٤٧', '٤٦'], a: 2, why: 'لأنها تتضاعف يومياً: نصف البحيرة في اليوم ٤٧ يصير البحيرة كاملة في اليوم ٤٨.' },
    { t: 'ترتيب', q: 'أحمد أطول من سالم، وخالد أقصر من سالم، ومحمد أطول من أحمد. من الأقصر؟', o: ['أحمد', 'سالم', 'خالد', 'محمد'], a: 2, why: 'الترتيب من الأطول: محمد ← أحمد ← سالم ← خالد.' },
    { t: 'مصفوفة أعداد', q: 'ما العدد الناقص؟', mx: ['٢', '٤', '٦', '٣', '٥', '٨', '٤', '٦', '؟'], o: ['٨', '٩', '١٠', '١٢'], a: 2, why: 'في كل صف: العدد الثالث = مجموع الأوّلين. ٤ + ٦ = ١٠.' },
    { t: 'عدّ ذكي', q: 'كم مربّعاً في رقعةٍ من ٢ × ٢ مربّعات صغيرة؟', o: ['٤', '٥', '٦', '٨'], a: 1, why: '٤ مربّعات صغيرة + المربّع الكبير الذي يضمّها = ٥.' },
    { t: 'شيفرة', q: 'إذا كانت «كتاب» = ٤ و«مدرسة» = ٥، فكم تساوي «حاسوب»؟', o: ['٤', '٥', '٦', '٣'], a: 1, why: 'الرقم = عدد حروف الكلمة: ك ت ا ب (٤)، م د ر س ة (٥)، ح ا س و ب (٥).' },
  ],
  x: [
    { t: 'استنتاج', q: 'ثلاثة صناديق ملصقاتها: «تفاح»، «برتقال»، «مختلط» — وكل الملصقات خاطئة. تسحب ثمرةً واحدة من صندوقٍ واحد لتعرف محتوى الثلاثة. من أيّ صندوقٍ تسحب؟', o: ['«تفاح»', '«برتقال»', '«مختلط»', 'لا يمكن'], a: 2, why: 'صندوق «مختلط» ليس مختلطاً (ملصقه خاطئ) فهو تفاحٌ فقط أو برتقالٌ فقط. إن سحبت تفاحة فهو صندوق التفاح، وصندوق «برتقال» لا يكون برتقالاً فهو المختلط، والباقي برتقال.' },
    { t: 'ساعة', q: 'كم مرّةً يتطابق عقربا الساعات والدقائق خلال ١٢ ساعة؟', o: ['١٢', '١١', '٢٤', '١٠'], a: 1, why: 'عقرب الدقائق يسبق عقرب الساعات ١١ مرّة فقط في ١٢ ساعة (يتطابقان كل ١ ساعة و٥٫٤٥ دقيقة تقريباً)، لأن التطابق حول الساعة ١١ هو نفسه تطابق الساعة ١٢.' },
    { t: 'انظر وقُل', q: 'ما التالي؟ (اقرأ كل سطرٍ بصوتٍ عالٍ واصفاً السابق)', big: '١ ، ١١ ، ٢١ ، ١٢١١ ، ١١١٢٢١ ، ؟', o: ['٣١٢٢١١', '١٢٢١١١', '٢١٢٢١١', '٣١١٢٢١'], a: 0, why: '«١١١٢٢١» تُقرأ: ثلاثة آحاد، اثنان اثنان، واحد واحد ← ٣١ ٢٢ ١١ = ٣١٢٢١١.' },
    { t: 'مصافحات', q: '٧ أشخاص في غرفة، يصافح كلٌّ منهم كلَّ الآخرين مرّةً واحدة. كم مصافحة؟', o: ['٤٢', '٤٩', '٢١', '١٤'], a: 2, why: 'كل شخصٍ يصافح ٦ ← ٧ × ٦ = ٤٢، لكن كل مصافحةٍ حُسبت مرّتين ← ٤٢ ÷ ٢ = ٢١.' },
    { t: 'ميزان', q: '٨ كرات متشابهة، واحدةٌ منها أثقل قليلاً. ما أقلّ عددٍ من الوزنات بميزان كفّتين يكفي دائماً لإيجادها؟', o: ['١', '٢', '٣', '٤'], a: 1, why: 'الوزنة ١: ٣ مقابل ٣ (و٢ جانباً). إن تعادلتا فالثقيلة في الاثنتين، وإلا ففي الثلاث الأثقل. الوزنة ٢: كرة مقابل كرة من المجموعة المشتبهة — تكشفها في كل الحالات.' },
    { t: 'فخّ التسرّع', q: '٣ عمّال يحفرون ٣ حفر في ٣ ساعات. كم ساعةً يحتاج عاملٌ واحد لحفر حفرةٍ واحدة؟', o: ['١', '٣', '٩', '١٣'], a: 1, why: 'كل عاملٍ يحفر حفرته في الساعات الثلاث نفسها. العامل الواحد يحتاج ٣ ساعات لحفرةٍ واحدة.' },
    { t: 'جبر ذهني', q: 'عددٌ من رقمين مجموع رقميه ٩، وإذا عكستَ رقميه زاد العدد ٢٧. ما العدد؟', o: ['٢٧', '٣٦', '٤٥', '١٨'], a: 1, why: '٣٦: مجموع رقميه ٣ + ٦ = ٩، ومقلوبه ٦٣، و٦٣ − ٣٦ = ٢٧.' },
    { t: 'الدخيل', q: 'أيّ عددٍ لا ينتمي للمجموعة؟', big: '٢٧ ، ٦٤ ، ١٢٥ ، ١٤٤ ، ٢١٦', o: ['٢٧', '٦٤', '١٤٤', '٢١٦'], a: 2, why: 'كلها مكعّبات: ٣³ ، ٤³ ، ٥³ ، ٦³ — إلا ١٤٤ فهو مربّع (١٢ × ١٢) لا مكعّب.' },
  ],
};
const SECS = { n: 45, a: 60, x: 90 };
const SCENE = `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="#DB2777" stroke-width="4" opacity=".16"><circle cx="220" cy="220" r="120"/><circle cx="300" cy="260" r="60"/><path d="M1250 700c60-120 180-120 240 0"/><path d="M1300 160h160v160h-160z"/></g>
</svg>`;

let K, teams, bag, lvl = 'n', round = 0, cur, timer, locked, ROUNDS = 8, streak = 0;
K = Kit.build({
  title: 'صالة العقل', accent: '#DB2777', accent2: '#9D174D', scene: SCENE,
  onRestart: () => home(),
  teacher: {
    goal: 'تنشيط التفكير المنطقي والاستدلالي: اكتشاف الأنماط، والقياس التمثيلي، والاستنتاج الصحيح، ومقاومة «الإجابة السريعة الخاطئة»، والتفكير الجانبي.',
    tools: 'الشاشة، وورقة وقلم لكل فريق.',
    groups: 'فرقٌ من ٣–٤ طلاب. كل فريقٍ يكتب إجابته على ورقة ويرفعها عند انتهاء الوقت.',
    steps: ['نختار المستوى المناسب للصف.', 'نقرأ السؤال ونشغّل المؤقّت. لا إجابة بصوتٍ عالٍ.', 'عند انتهاء الوقت: كل الفرق ترفع أوراقها معاً.', 'نضغط الإجابة التي اختارتها أغلب الفرق، ثم نكشف الشرح.', 'نسأل فريقاً أجاب صحيحاً: كيف فكّرتم؟ ونمنح النقاط.'],
    time: '١٥–٢٥ دقيقة لثمانية أسئلة.',
    script: 'مرحباً بكم في صالة العقل! كما نمرّن عضلاتنا في الصالة الرياضية، سنمرّن عقولنا اليوم. انتبهوا: بعض الأسئلة فيها فخّ لمن يتسرّع… فكّروا مرّتين!',
    tips: 'في أسئلة «فخّ التسرّع» اسألوا أولاً: من أجاب في أول ٥ ثوانٍ؟ ثم اكشفوا — التعلّم الحقيقي في لحظة «آه! فهمتُ الآن».',
    points: 'نقطتان لكل فريقٍ أجاب صحيحاً، ونقطة إضافية لأوضح شرحٍ لطريقة التفكير.',
    levels: 'متوسّط للصفوف ٥–٧، ومتقدّم ٧–٩، وخبير ٩–١٠ والمتفوّقين. يمكن مزج المستويات: ابدؤوا متوسّطاً ثم ارفعوا.',
    close: ['أيّ سؤالٍ خدعكم؟ ولماذا خدعكم؟', 'ما الاستراتيجية التي ساعدتكم أكثر: الرسم، أم التجريب، أم العكس؟', 'متى نحتاج في الحياة أن «نفكّر مرّتين» قبل أن نجيب؟'],
  },
});

function home() {
  if (timer) timer.pause(); round = 0; streak = 0;
  K.start({ emblem: '🧠', sub: 'متتاليات، ومصفوفات، واستنتاجات، وأسئلةٌ فيها فخّ لمن يتسرّع. درّبوا عقولكم كما تدرّبون عضلاتكم.',
    meta: [['الصفوف', '٥ – ١٠'], ['الزمن', '١٥ – ٢٥ دقيقة'], ['المهارة', 'التفكير المنطقي'], ['القيمة', 'التأنّي والدقّة']],
    levels: [['n', 'متوسّط', 'الصفوف ٥ – ٧'], ['a', 'متقدّم', 'الصفوف ٧ – ٩'], ['x', 'خبير', 'للمتفوّقين']],
    teams: [3, [2, 3, 4, 5, 6]], onGo: (n, lv) => { teams = null; home.n = n; lvl = lv; bag = K.Bag(SETS[lv]); play(); } });
}

function play() {
  round++; locked = false; cur = bag.next();
  K.stage.innerHTML = '';
  const w = K.el('div', 'col'); w.style.width = '100%'; w.style.maxWidth = '1100px';
  w.innerHTML = `${K.progress(ROUNDS, round - 1)}<div class="qcard"><span class="qtype">${Kit.esc(cur.t)}</span>
    <div class="qtext">${Kit.esc(cur.q)}</div>${cur.big ? `<div class="qbig">${Kit.esc(cur.big)}</div>` : ''}${cur.mx ? MX(cur.mx) : ''}</div>`;
  const tr = K.el('div', 'row'); w.appendChild(tr);
  timer = K.ringTimer(tr, SECS[lvl], () => K.say('انتهى الوقت — ارفعوا الأوراق!', 'info'));
  const op = K.el('div', 'opts');
  cur.o.forEach((t, i) => { const b = K.el('button', 'btn', Kit.esc(t)); b.onclick = () => pick(i, b, op, w); op.appendChild(b); });
  w.appendChild(op);
  const tb = K.el('div', 'teams'); w.appendChild(tb);
  if (!teams) teams = K.Teams(tb, home.n || 3); else teams.mount(tb);
  w.appendChild(K.valuesRow(teams, [[2, 'إجابة صحيحة'], [1, 'أوضح شرح'], [1, 'لم يقع في الفخّ']]));
  K.stage.appendChild(w); timer.start();
}

function pick(i, b, op, w) {
  if (locked) return; locked = true; timer.pause();
  const ok = i === cur.a;
  [...op.children].forEach((x, j) => { x.disabled = true; if (j === cur.a) x.classList.add('right'); });
  if (!ok) b.classList.add('wrong');
  streak = ok ? streak + 1 : 0;
  ok ? (K.SFX.win(), K.praise(), streak >= 3 && K.confetti(60)) : (K.SFX.soft(), K.encourage());
  w.insertBefore(K.el('div', 'explain', `<b>${ok ? 'صحيح! ' : 'الإجابة: ' + Kit.esc(cur.o[cur.a]) + '. '}</b>${Kit.esc(cur.why)}${streak >= 3 ? `<br><span class="streak">🔥 ${Kit.AR(streak)} إجابات صحيحة متتالية للصف!</span>` : ''}`), w.querySelector('.teams'));
  const nx = K.el('button', 'btn p big', round < ROUNDS ? 'السؤال التالي ←' : 'ختام النشاط ←');
  nx.onclick = () => { K.SFX.tap(); round < ROUNDS ? play() : K.reflect({ value: 'التأنّي والدقّة', questions: ['أيّ سؤالٍ خدعكم؟ ولماذا خدعكم؟', 'ما الاستراتيجية التي ساعدتكم أكثر: الرسم، أم التجريب، أم العكس؟', 'متى نحتاج في الحياة أن «نفكّر مرّتين» قبل أن نجيب؟'] }, home); };
  w.insertBefore(nx, w.querySelector('.teams'));
}
home();
</script>
</body>
</html>
