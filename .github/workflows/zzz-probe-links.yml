name: zzz probe links
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for u in "https://afidni.com/%d9%83%d8%aa%d8%a7%d8%a8-%d8%a7%d9%84%d8%aa%d8%b1%d8%a8%d9%8a%d8%a9-%d8%a7%d9%84%d8%a5%d8%b3%d9%84%d8%a7%d9%85%d9%8a%d8%a9-%d8%b5%d9%81-%d8%aa%d8%a7%d8%b3%d8%b9-%d9%81%d8%b5%d9%84-%d8%a3%d9%88%d9%84/"; do
            echo "=== $u"
            curl -sL -A "$UA" "$u" -o p.html -w "code=%{http_code} size=%{size_download}\n"
            grep -oE '(https?:)?//[^"'"'"' <>]*(drive\.google\.com|docs\.google\.com|\.pdf)[^"'"'"' <>]*' p.html | grep -i "drive\|docs\|\.pdf" | sort -u | head -30
            grep -oE "<title>[^<]*" p.html; grep -oE "(طبعة|الطبعة)[^<]{0,60}" p.html | head -5
            grep -oE '(https?://[^"'"'"' <>]*(oman-school|afidni|afedne)[^"'"'"' <>]*(islam|إسلام|%d8%a5%d8%b3%d9%84%d8%a7%d9%85|%D8%A5%D8%B3%D9%84%D8%A7%D9%85|%d8%a7%d8%b3%d9%84%d8%a7%d9%85)[^"'"'"' <>]*)' p.html | sort -u | head -20
          done
