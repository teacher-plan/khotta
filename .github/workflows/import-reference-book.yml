# استيراد كتابٍ مرجعيّ لأداة التحضير (مثل كتاب النشاط) — صور صفحاتٍ في المخزن العام فقط.
#
# لا يكتب أي صفٍّ في قاعدة البيانات (لا book_sources ولا teacher_guides)، فلا يظهر
# للمعلّمات كتاباً جديداً في المنصّة ولا يمسّ كتاب الطالب. يُنزَّل الـPDF من Google
# Drive (مشاركته «أي شخص لديه الرابط») عبر gdown، يُحوَّل لصور صفحاتٍ JPEG بنفس
# تنسيق الكتب (pdftoppm -r 110)، وتُرفع إلى:
#   library-files/references/<slug>/p<N>.jpg   (رقم الصورة = ترتيب الصفحة في الملف)
#
# التشغيل: تعديل tools/presentations/sources/import-reference.json ودفعه إلى فرع
# claude/** (أو يدوياً من Actions). مثال الملف:
#   {"drive_id": "<معرّف الملف>", "slug": "g7-math-sem1-activity"}
name: Import reference book (pages only)

on:
  push:
    branches: ['claude/**']
    paths: ['tools/presentations/sources/import-reference.json']
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت الأدوات
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install --quiet gdown

      - name: تنزيل وتحويل ورفع
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
          BUCKET: library-files
        run: |
          set -uo pipefail
          CFG=tools/presentations/sources/import-reference.json
          DRIVE_ID=$(jq -r '.drive_id' "$CFG"); SLUG=$(jq -r '.slug' "$CFG")
          if [ -z "$DRIVE_ID" ] || [ "$DRIVE_ID" = "null" ] || ! printf '%s' "$SLUG" | grep -Eq '^[a-z0-9-]+$'; then
            echo "::error::drive_id أو slug غير صالح في $CFG"; exit 1
          fi

          KEYS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys")
          SERVICE_KEY=$(echo "$KEYS_JSON" | jq -r '.[] | select(.name=="service_role") | .api_key')
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then echo "::error::تعذّر جلب مفتاح service_role"; exit 1; fi

          echo "── تنزيل الملف من Drive ──"
          gdown --quiet "https://drive.google.com/uc?id=${DRIVE_ID}" -O /tmp/ref.pdf || gdown --quiet --fuzzy "https://drive.google.com/file/d/${DRIVE_ID}/view" -O /tmp/ref.pdf
          if [ ! -s /tmp/ref.pdf ] || ! head -c 5 /tmp/ref.pdf | grep -q '%PDF'; then
            echo "::error::لم يُنزَّل PDF صالح — تأكّد أن مشاركة الملف «أي شخص لديه الرابط»"; exit 1
          fi
          ls -la /tmp/ref.pdf

          echo "── تحويل الصفحات ──"
          mkdir -p /tmp/pages
          pdftoppm -jpeg -r 110 /tmp/ref.pdf /tmp/pages/p
          cnt=0
          for f in $(ls /tmp/pages/p-*.jpg | sort -V); do cnt=$((cnt+1)); mv "$f" "/tmp/pages/p${cnt}.jpg"; done
          echo "عدد الصفحات: $cnt"

          echo "── الرفع إلى $BUCKET/references/$SLUG ──"
          ok=0; bad=0
          for p in $(seq 1 $cnt); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "https://$REF.supabase.co/storage/v1/object/$BUCKET/references/${SLUG}/p${p}.jpg" \
              -H "Authorization: Bearer $SERVICE_KEY" -H "Content-Type: image/jpeg" -H "x-upsert: true" \
              --data-binary "@/tmp/pages/p${p}.jpg")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then ok=$((ok+1)); else bad=$((bad+1)); echo "فشل p${p}: $code"; fi
          done
          echo "✅ رُفع $ok من $cnt (فشل $bad)"
          echo "الرابط: https://$REF.supabase.co/storage/v1/object/public/$BUCKET/references/${SLUG}/p1.jpg"
          [ "$bad" = "0" ] || exit 1
