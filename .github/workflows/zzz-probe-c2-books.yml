name: zzz probe c2 books
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: فحص كتب الحلقة الثانية
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -uo pipefail
          raw() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary "$(jq -Rs '{query: .}' <<< "$1")"
          }

          echo "════ ١) تغطية أرقام صفحات الدروس (ص٥ فما فوق) ════"
          raw "select grade, subject, book_no, count(*) as lessons, count(page) as with_page, count(*)-count(page) as missing_page from curriculum where grade >= 5 group by grade, subject, book_no order by grade, subject, book_no;" \
            | jq -r 'if length==0 then "لا دروس مسجّلة إطلاقاً" else .[] | "ص\(.grade) | \(.subject) | كتاب\(.book_no) | دروس:\(.lessons) | لها صفحة:\(.with_page) | بلا صفحة:\(.missing_page)" end'

          echo
          echo "════ ٢) حالة رفع الكتب المطلوبة في المنهج ════"
          raw "select c.grade, c.subject, c.book_no, count(*) as lessons, case when max(bs.base_path) is null then 'غير مرفوع' when max(bs.page_count) is null then 'ناقص' else 'مرفوع' end as status from curriculum c left join book_sources bs on bs.grade=c.grade::text and bs.subject=c.subject and bs.semester=c.semester and bs.book_no=c.book_no where c.grade >= 5 group by c.grade, c.subject, c.book_no order by status, c.grade, c.subject;" \
            | jq -r 'if length==0 then "لا شيء" else .[] | "\(.status) | ص\(.grade) | \(.subject) | كتاب\(.book_no) | \(.lessons) درس" end'

          echo
          echo "════ ٣) كل صفوف book_sources لـص٥ فما فوق + هل الصور موجودة فعلاً ════"
          raw "select bs.grade, bs.subject, bs.book_no, bs.page_count, (select count(*) from storage.objects o where o.bucket_id='library-files' and o.name like bs.base_path || '/%') as files_in_storage, (select count(*) from curriculum c where c.grade::text=bs.grade and c.subject=bs.subject and c.semester=bs.semester and c.book_no=bs.book_no) as lessons_using from book_sources bs where bs.grade not in ('1','2','3','4') order by bs.grade, bs.subject, bs.book_no;" \
            | jq -r 'if length==0 then "لا كتب مرفوعة" else .[] | "ص\(.grade) | \(.subject) | كتاب\(.book_no) | صفحات:\(.page_count) | صور بالتخزين:\(.files_in_storage) | دروس تستعمله:\(.lessons_using)" end'

          echo
          echo "════ ٤) المواد الموجودة في منهج كل صف (ص٥ فما فوق) ════"
          raw "select grade, string_agg(distinct subject, ' · ') as subjects, count(*) as lessons from curriculum where grade >= 5 group by grade order by grade;" \
            | jq -r 'if length==0 then "لا شيء" else .[] | "ص\(.grade) | \(.lessons) درس | \(.subjects)" end'

          echo
          echo "════ ٥) الإجمالي ════"
          raw "select count(*) as total_lessons, count(page) as with_page, count(*)-count(page) as missing_page, count(distinct (grade, subject, book_no)) as books, count(distinct grade) as grades from curriculum where grade >= 5;" \
            | jq -r '.[] | "إجمالي الدروس:\(.total_lessons) | لها صفحة:\(.with_page) | بلا صفحة:\(.missing_page) | كتب المنهج:\(.books) | صفوف:\(.grades)"'

          echo
          echo "════ ٦) الفصول الدراسية ════"
          raw "select semester, count(*) as lessons from curriculum where grade >= 5 group by semester order by 1;" \
            | jq -r 'if length==0 then "لا شيء" else .[] | "\(.semester): \(.lessons) درس" end'
