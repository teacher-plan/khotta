# مستكشف نور للمطوّر (قراءة فقط): يفتح صفحات نور بحساب المعلّم المربوط في خطّة
# عبر الفعل lab_raw في c1-noor، ويطبع بنية النماذج والروابط فقط (لا كوكيز ولا أسماء).
name: Noor probe (read-only)

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'مسارات نور مفصولة بفواصل (تبدأ بـ /teacher/)'
        required: true
      as:
        description: 'بريد حساب المختبر'
        required: true
        default: 'xx@y.com'
      grep:
        description: 'نمط للروابط المطبوعة (regex)'
        required: false
        default: 'discussion|post|forum|room|topic'
      ajax:
        description: 'طلب AJAX (يعيد JSON)'
        required: false
        default: 'false'
      dump:
        description: 'نمطٌ يُطبع حوله HTML خام (اختياري)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
          PATHS: ${{ inputs.paths }}
          AS: ${{ inputs.as }}
          GREP: ${{ inputs.grep }}
          DUMP: ${{ inputs.dump }}
          AJAX: ${{ inputs.ajax }}
        run: |
          set -uo pipefail
          KEY=$(curl -s "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" -H "Authorization: Bearer $TOKEN" \
            | jq -r '[.[] | select(.name=="service_role")][0].api_key')
          echo "::add-mask::$KEY"
          IFS=',' read -ra arr <<< "$PATHS"
          for p in "${arr[@]}"; do
            p=$(echo "$p" | xargs)
            echo "════════ $p"
            body=$(jq -n --arg p "$p" --arg a "$AJAX" '{action:"lab_raw",path:$p,ajax:($a=="true")}')
            curl -s -X POST "https://$REF.supabase.co/functions/v1/c1-noor" \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "x-lab-as: $AS" \
              -H "Content-Type: application/json" --data-binary "$body" > /tmp/r.json
            python3 - "$GREP" <<'PY'
          import json, re, sys, html
          g = sys.argv[1]
          j = json.load(open('/tmp/r.json'))
          if 'text' not in j:
              print('ERROR', json.dumps(j, ensure_ascii=False)[:400]); sys.exit()
          t = j['text']
          if t.lstrip()[:1] in '[{':
              try:
                  jj = json.loads(t)
                  def strip(o):
                      if isinstance(o, dict): return {k: strip(v) for k, v in o.items() if k not in ('full_name', 'name', 'student_full_name')}
                      if isinstance(o, list): return [strip(x) for x in o[:12]]
                      return o if not isinstance(o, str) else o[:160]
                  print('JSON', json.dumps(strip(jj), ensure_ascii=False)[:6000]); sys.exit()
              except Exception as e: print('JSONERR', e)
          print('status', j.get('status'), 'url', j.get('url'), 'size', j.get('size'))
          for m in re.finditer(r'<form\b[^>]*>', t, re.I):
              print('FORM', re.sub(r'\s+', ' ', m.group(0))[:300])
          seen = set()
          for m in re.finditer(r'<(input|select|textarea)\b[^>]*>', t, re.I):
              tag = m.group(0)
              nm = re.search(r'name="([^"]*)"', tag)
              if not nm or nm.group(1) in seen or re.search(r'selected_students|\[checkbox\]|\[\d{6,}\]', nm.group(1)): continue
              seen.add(nm.group(1))
              ty = re.search(r'type="([^"]*)"', tag)
              val = re.search(r'value="([^"]{0,40})', tag)
              extra = ''
              if m.group(1).lower() == 'select':
                  end = t.find('</select>', m.end())
                  opts = re.findall(r'<option[^>]*value="([^"]*)"[^>]*>([^<]{0,40})', t[m.end():end])
                  extra = ' OPTS ' + json.dumps(opts[:12], ensure_ascii=False)
              v = '' if (ty and ty.group(1) in ('password',)) or 'token' in nm.group(1).lower() else (val.group(1) if val else '')
              print('FIELD', m.group(1), nm.group(1), ty.group(1) if ty else '', repr(v), extra)
          links = sorted(set(html.unescape(x) for x in re.findall(r'(?:href|action|url)\s*[=:]\s*["\']([^"\']+)', t) if re.search(g, x, re.I)))
          for l in links[:60]: print('LINK', l)
          txt = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', t, flags=re.S | re.I)
          txt = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', txt)))
          if j.get('size', 0) < 30000: print('TEXT', txt[:600])
          n = 0
          for m in re.finditer(g, txt, re.I):
              print('SNIP', txt[max(0, m.start() - 80): m.end() + 80]); n += 1
              if n >= 8: break
          for m in re.finditer(r'<a\b[^>]*href="([^"]+)"[^>]*>([^<]{0,60})', t):
              if re.search(g, m.group(2), re.I): print('ALINK', m.group(1), '|', m.group(2).strip())
          import os
          dp = os.environ.get('DUMP', '')
          if dp:
              k = 0
              for m in re.finditer(dp, t):
                  seg = re.sub(r'selected_students\]\[\d+\]', 'selected_students][N]', t[max(0, m.start() - 300): m.start() + 3500])
                  print('DUMP<<<', seg, '>>>'); k += 1
                  if k >= 4: break
          for m in re.finditer(r'\$\.(?:ajax|post)\(\s*\{?[^)]{0,200}', t):
              s = m.group(0)
              if re.search(g, s, re.I): print('AJAX', re.sub(r'\s+', ' ', s)[:220])
          PY
          done
