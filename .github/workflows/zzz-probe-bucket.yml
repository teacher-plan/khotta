name: zzz probe bucket
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }
          run "BUCKETS" "select id, public, file_size_limit, allowed_mime_types from storage.buckets;"
          SK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo '<!doctype html><p>hi</p>' > t.html
          echo "════ UPLOAD_TEST (service role) ════"
          curl -s -X POST "https://$REF.supabase.co/storage/v1/object/user-files/zz-probe/test.html" -H "Authorization: Bearer $SK" -H "Content-Type: text/html" --data-binary @t.html; echo
          echo "════ SERVE_TEST ════"
          curl -s -D - -o /dev/null "https://$REF.supabase.co/storage/v1/object/public/user-files/zz-probe/test.html" | grep -i -E "^HTTP|content-type|content-security"
          curl -s -X DELETE "https://$REF.supabase.co/storage/v1/object/user-files" -H "Authorization: Bearer $SK" -H "Content-Type: application/json" -d '{"prefixes":["zz-probe/test.html"]}'; echo
