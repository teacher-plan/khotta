name: zzz probe bucket
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }
          run "POLICIES" "select policyname, cmd, qual, with_check from pg_policies where schemaname='storage' and tablename='objects';"
          run "USER_FILES_POL" "select policyname, cmd, with_check from pg_policies where tablename='user_files';"
          run "HTML_UPLOADS" "select name, metadata->>'mimetype' mt, created_at from storage.objects where bucket_id='user-files' and (name ilike '%.htm%' or metadata->>'mimetype' ilike '%html%') order by created_at desc limit 5;"
          run "RECENT_USERFILES" "select name, metadata->>'mimetype' mt, created_at from storage.objects where bucket_id='user-files' order by created_at desc limit 5;"
