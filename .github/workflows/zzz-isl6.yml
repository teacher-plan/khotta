# مؤقّت: رفع ١١ عرضاً تفاعلياً للتربية الإسلامية (الصف السادس، الوحدتان الثالثة والرابعة)
# وإرفاقها في بطاقات الدروس لدى أ. عبدالرحمن الصقري وأ. عبدالرحمن العامري. يُحذف مع ملفاته بعد التشغيل.
name: zzz isl6 decks
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -euo pipefail
          export SK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SK"
          cat > /tmp/c.mjs <<'JS'
          import fs from 'fs';
          const U=`https://${process.env.REF}.supabase.co`, K=process.env.SK;
          const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
          const j=async(r)=>{const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t);return t?JSON.parse(t):null;};
          const KEY='6|التربية الإسلامية';
          // [معرّف الدرس، اسم الملف]
          const DECKS=[['L10eismy','min-fadail-alamal'],['L1s85xxb','allah-alhalim'],['L1fryknj','salat-aljumua'],['Ldmhf4i','bina-almasjid'],
            ['Le8oeas','altazim-alhaq'],['L10gbw9j','alidgham'],['Lln24n8','almuzzammil-20'],['L17v84gy','hajr-almuslim'],
            ['L1ly350g','alquran-mujiza'],['L149ti1a','alistidrak'],['Lm4pi0','ibn-omar']];
          const TEACHERS={'0625d7fb-e327-4e0d-9249-c76fb51d8b52':'الصقري','05ec2485-92e3-4198-9beb-e64d1dbb3550':'العامري'};
          // ١) رفع العروض
          const up={};
          for(const [lid,slug] of DECKS){
            const buf=fs.readFileSync(`supabase/_uploads/isl6/${slug}.html`);
            const dest=`presentations/islamic/g6/${slug}.html.txt`;
            await j(await fetch(`${U}/storage/v1/object/library-files/${dest}`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'text/plain; charset=utf-8','x-upsert':'true'},body:buf}));
            const pub=`${U}/storage/v1/object/public/library-files/${dest}?v=1`;
            const st=(await fetch(pub)).status;
            if(st!==200)throw new Error('public '+st+' '+dest);
            up[lid]={pub,size:buf.length};
            console.log('uploaded',slug,buf.length);
          }
          // ٢) الإرفاق في بطاقة كل درس لدى المعلّمَين
          for(const [id,who] of Object.entries(TEACHERS)){
            const [p]=await j(await fetch(`${U}/rest/v1/cycle1_profiles?id=eq.${id}&select=data`,{headers:H}));
            if(!p)throw new Error('no profile '+who);
            const d=p.data; const units=(d.plan_units||{})[KEY]||[];
            const names={}; units.forEach(u=>(u.lessons||[]).forEach(l=>{names[l.id]=l.name;}));
            d.plan_state=d.plan_state||{};
            for(const [lid] of DECKS){
              if(!names[lid])throw new Error(who+': lesson not in plan '+lid);
              const fileEntry={name:`${names[lid]} — العرض التفاعلي.html`,type:'text/html',size:up[lid].size,viewLink:up[lid].pub,previewLink:up[lid].pub,html:true};
              const st=d.plan_state[lid]||{done:false,classes:{}};
              st.files=[...(st.files||[]).filter(f=>f.name!==fileEntry.name),fileEntry];
              d.plan_state[lid]=st;
            }
            d.updated_at=new Date().toISOString();
            await j(await fetch(`${U}/rest/v1/cycle1_profiles?id=eq.${id}`,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({data:d,updated_at:d.updated_at})}));
            // تحقّق بعد الحفظ
            const [v]=await j(await fetch(`${U}/rest/v1/cycle1_profiles?id=eq.${id}&select=data`,{headers:H}));
            const ok=DECKS.filter(([lid])=>((v.data.plan_state||{})[lid]?.files||[]).some(f=>/العرض التفاعلي/.test(f.name))).length;
            console.log('DONE',who,'lessons with deck:',ok,'/',DECKS.length);
            if(ok!==DECKS.length)throw new Error('verify failed '+who);
          }
          JS
          node /tmp/c.mjs
