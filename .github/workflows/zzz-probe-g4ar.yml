name: zzz probe g4 arabic
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$(jq -Rs '{query: .}' <<< "$1")" | jq -c '.[]?' ; echo; }
          echo "== subjects g4 =="
          q "select subject, semester, count(*) from public.curriculum where grade='4' group by 1,2 order by 2,1;"
          echo "== curriculum g4 arabic s1 =="
          q "select id, book_no, unit, lesson, sort, page from public.curriculum where grade='4' and subject like '%لغت%' and semester='الفصل الأول' order by sort;"
          echo "== book_sources =="
          q "select subject, book_no, base_path, page_count, offset_pages from public.book_sources where grade='4' and semester='الفصل الأول' and subject like '%لغت%';"
          echo "== guide =="
          q "select id, subject, base_path, page_count, offset_pages, status, toc from public.teacher_guides where grade=4 and semester='الفصل الأول' and subject like '%لغت%';"
          echo "== columns curriculum =="
          q "select column_name, data_type from information_schema.columns where table_schema='public' and table_name='curriculum';"
          echo "== who has g4 arabic plan_state rows =="
          q "select count(distinct user_id) from public.plan_state where lesson_id in (select id::text from public.curriculum where grade='4' and subject like '%لغت%');"
