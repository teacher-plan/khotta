name: zzz probe active subjects
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "عيّنة cycle1_profiles.data (مفتاح واحد)" "select email, jsonb_pretty(data) from cycle1_profiles limit 1;"

          run "قيم cycle في allowed_emails" "select distinct cycle from allowed_emails;"

          run "عدد allowed_emails النشطة حسب cycle" "select cycle, count(*) from allowed_emails where expires_at is null or expires_at>now() group by cycle;"
