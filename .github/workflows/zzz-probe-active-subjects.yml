name: zzz probe active subjects
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "الحسابات النشطة مع display_name وقائمة الصفوف/المواد" "
          select
            ae.\"user name\" as user_name,
            ae.email,
            ae.cycle,
            p.data->>'display_name' as display_name,
            (
              select jsonb_agg(distinct sub)
              from jsonb_array_elements(coalesce(p.data->'grades','[]'::jsonb)) g,
                   jsonb_array_elements(coalesce(g->'classes','[]'::jsonb)) c,
                   jsonb_array_elements_text(coalesce(c->'subjects','[]'::jsonb)) sub
            ) as subjects,
            (
              select jsonb_agg(distinct (g->>'num')::int)
              from jsonb_array_elements(coalesce(p.data->'grades','[]'::jsonb)) g
            ) as grade_nums
          from allowed_emails ae
          left join cycle1_profiles p on p.email = ae.email
          where (ae.expires_at is null or ae.expires_at > now())
          order by ae.cycle, ae.email;
          "
