name: zzz probe active subjects
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "أعمدة profiles" "select column_name, data_type from information_schema.columns where table_name='profiles' order by ordinal_position;"

          run "أعمدة cycle1_profiles" "select column_name, data_type from information_schema.columns where table_name='cycle1_profiles' order by ordinal_position;"

          run "أعمدة allowed_emails" "select column_name, data_type from information_schema.columns where table_name='allowed_emails' order by ordinal_position;"
