# مؤقّت: قراءة استهلاك التخزين وحجم قاعدة البيانات (قراءة فقط). يُحذف بعد التشغيل.
name: zzz storage usage
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: usage
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          q(){ curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$(jq -Rs '{query: .}' <<< "$1")"; echo; }
          echo "— حسب الحاوية"; q "select bucket_id, count(*) n, round(sum((metadata->>'size')::bigint)/1048576.0,1) mb from storage.objects group by 1 order by 3 desc;"
          echo "— المجموع"; q "select round(sum((metadata->>'size')::bigint)/1048576.0,1) mb from storage.objects;"
          echo "— أكبر المجلدات في library-files"; q "select split_part(name,'/',1)||'/'||split_part(name,'/',2) folder, count(*) n, round(sum((metadata->>'size')::bigint)/1048576.0,1) mb from storage.objects where bucket_id='library-files' group by 1 order by 3 desc limit 25;"
          echo "— قاعدة البيانات"; q "select pg_size_pretty(pg_database_size(current_database())) db;"
          echo "— مصادر الكتب"; q "select grade,subject,semester,book_no,base_path,page_count from book_sources order by grade,subject,semester,book_no;"
          echo "— أدلة المعلم"; q "select id,grade,subject,semester,page_count,base_path from teacher_guides order by grade,subject;"
