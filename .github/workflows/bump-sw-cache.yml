# ترقية إصدار كاش Service Worker تلقائياً عند كل تعديل على الواجهة —
# يضمن وصول النسخة الجديدة لكل الأجهزة دون ترقية يدوية للرقم
name: Bump SW Cache Version
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cycle1.html'
      - 'school.html'
      - 'manager.html'
      # بنك أنشطة الاحتياط مُخزَّن مسبقاً في عامل الخدمة — بلا ترقية الإصدار
      # تبقى النسخة القديمة في كاش المعلمات ولا يصلها أي تعديل عليه
      - 'reserve.js'
jobs:
  bump:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[sw-auto]')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite cache version with commit hash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          sed -i "s/const CACHE_NAME = '[^']*'/const CACHE_NAME = 'khotta-$SHORT'/" sw.js
          # ختم النسخة داخل الصفحة نفسها: عامل الخدمة يخزّنها، فقد تُبلّغ معلّمة
          # عن علّةٍ أُصلحت وهي تعمل على نسخةٍ قديمة. الختم يحسم أيّ نسخةٍ لديها.
          sed -i "s/const KH_BUILD='[^']*'/const KH_BUILD='$SHORT'/" cycle1.html
          if git diff --quiet sw.js cycle1.html; then echo "no change"; exit 0; fi
          git config user.name "sw-bump-bot"
          git config user.email "actions@github.com"
          git add sw.js cycle1.html
          git commit -m "chore: ترقية كاش SW إلى $SHORT [sw-auto]"
          # سير عملٍ آخر (بناء نسخة التجربة) يدفع إلى main عند الدفعة نفسها،
          # فيسبق أحدهما ويُرفض الثاني. الرفض هنا يعني بقاء المعلّمات على
          # كاشٍ قديم يُخفي الإصلاح الذي دُفع للتوّ.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "دفعٌ مرفوض — إعادة الأساس ثم المحاولة ($i)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i*3))
          done
          exit 1
