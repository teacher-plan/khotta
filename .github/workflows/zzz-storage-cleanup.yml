# مؤقّت: (١) حذف مقاطع الفيديو وملفات PowerPoint من حساب الأستاذ عيسى بعد نسخها احتياطياً، وإزالة روابطها من بطاقاته.
# (٢) ضغط صفحات الكتب وأدلّة المعلّم (JPEG جودة ٧٥) بعد نسخ الأصول احتياطياً؛ لا يبدأ الضغط إلا إن نجح النسخ.
# يُحذف هذا الملف بعد التشغيل.
name: zzz storage cleanup
on: workflow_dispatch
env:
  REF: mkdsnnfkkdwdkywnwnjh
jobs:
  userfiles:
    runs-on: ubuntu-latest
    steps:
      - name: backup + delete videos/pptx
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SK"
          mkdir -p ub
          cat > /tmp/u.py <<'PY'
          import os, json, urllib.request
          U=f"https://{os.environ['REF']}.supabase.co"; K=os.environ['SK']
          H={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'}
          UID='2e75c428-c265-42dd-838e-b83ede3ef1cb'
          def req(m,url,body=None,h=H,raw=False):
              r=urllib.request.Request(url,method=m,headers=h,data=(json.dumps(body).encode() if body is not None else None))
              with urllib.request.urlopen(r,timeout=120) as x: d=x.read()
              return d if raw else (json.loads(d) if d else None)
          lst=req('POST',f'{U}/storage/v1/object/list/user-files',{'prefix':UID+'/','limit':1000,'offset':0})
          sel=[o for o in lst if o.get('id') and (o['name'].lower().endswith(('.mp4','.pptx','.ppt')) or 'video' in (o.get('metadata') or {}).get('mimetype','') or 'presentation' in (o.get('metadata') or {}).get('mimetype',''))]
          names=[f"{UID}/{o['name']}" for o in sel]; tot=0
          for n in names:
              b=req('GET',f'{U}/storage/v1/object/user-files/{n}',h={'apikey':K,'Authorization':'Bearer '+K},raw=True)
              open('ub/'+n.split('/')[-1],'wb').write(b); tot+=len(b)
          print('selected',len(names),'MB',round(tot/1048576,1)); print('\n'.join(names))
          # إزالة الروابط من بيانات الحساب
          base=[n.split('/')[-1] for n in names]
          def clean(v):
              if isinstance(v,dict): return {k:clean(x) for k,x in v.items()}
              # يُحذف عنصر القائمة فقط إن كانت إحدى قيمه النصّية المباشرة (رابط/مسار) تشير إلى ملف محذوف
              if isinstance(v,list): return [clean(x) for x in v if not (isinstance(x,dict) and any(isinstance(s,str) and any(b in s for b in base) for s in x.values()))]
              return v
          removed=0
          for tbl,key in (('cycle1_profiles','id'),('profiles','id')):
              rows=req('GET',f'{U}/rest/v1/{tbl}?{key}=eq.{UID}&select=data')
              if not rows: continue
              d=rows[0]['data']; s0=json.dumps(d,ensure_ascii=False); d2=clean(d); s1=json.dumps(d2,ensure_ascii=False)
              hits=sum(s0.count(b) for b in base)
              json.dump(d,open(f'ub/{tbl}-before.json','w'),ensure_ascii=False)
              if s0!=s1:
                  import datetime; now=datetime.datetime.utcnow().isoformat()+'Z'; d2['updated_at']=now
                  req('PATCH',f'{U}/rest/v1/{tbl}?{key}=eq.{UID}',{'data':d2,'updated_at':now},h={**H,'Prefer':'return=minimal'})
                  removed+=1
              print(tbl,'refs found',hits,'cleaned' if s0!=s1 else 'unchanged')
          for i in range(0,len(names),100):
              req('DELETE',f'{U}/storage/v1/object/user-files',{'prefixes':names[i:i+100]})
          left=[o for o in req('POST',f'{U}/storage/v1/object/list/user-files',{'prefix':UID+'/','limit':1000}) if o.get('id') and f"{UID}/{o['name']}" in names]
          print('DONE deleted',len(names),'remaining of selected:',len(left))
          PY
          python3 /tmp/u.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backup-user-media, path: ub, retention-days: 30 }

  pages-backup:
    runs-on: ubuntu-latest
    steps:
      - name: download all page images
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SK"
          cat > /tmp/d.py <<'PY'
          import os, json, urllib.request, concurrent.futures as cf
          U=f"https://{os.environ['REF']}.supabase.co"; K=os.environ['SK']
          H={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'}
          def lst(prefix):
              out=[]; off=0
              while True:
                  r=urllib.request.Request(f'{U}/storage/v1/object/list/library-files',method='POST',headers=H,data=json.dumps({'prefix':prefix,'limit':1000,'offset':off}).encode())
                  b=json.loads(urllib.request.urlopen(r,timeout=120).read()); out+=b
                  if len(b)<1000: return out
                  off+=1000
          files=[]
          for top in ('books','teacher-guides'):
              for f in lst(top+'/'):
                  if f.get('id'): continue
                  for o in lst(f"{top}/{f['name']}/"):
                      if o.get('id') and o['name'].lower().endswith(('.jpg','.jpeg')): files.append(f"{top}/{f['name']}/{o['name']}")
          print('files',len(files))
          def get(n):
              for t in range(4):
                  try:
                      r=urllib.request.Request(f'{U}/storage/v1/object/library-files/{n}',headers={'apikey':K,'Authorization':'Bearer '+K})
                      b=urllib.request.urlopen(r,timeout=120).read()
                      os.makedirs('pages/'+os.path.dirname(n),exist_ok=True); open('pages/'+n,'wb').write(b); return len(b)
                  except Exception as e: err=e
              raise err
          with cf.ThreadPoolExecutor(16) as ex: tot=sum(ex.map(get,files))
          json.dump(files,open('pages/_list.json','w'))
          print('downloaded MB',round(tot/1048576,1))
          PY
          python3 /tmp/d.py
      - uses: actions/upload-artifact@v4
        with: { name: backup-pages-original, path: pages, retention-days: 30, compression-level: 0 }

  pages-compress:
    needs: pages-backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: backup-pages-original, path: pages }
      - name: compress + upload
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          pip install -q pillow
          export SK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SK"
          cat > /tmp/c.py <<'PY'
          import os, io, json, urllib.request, concurrent.futures as cf
          from PIL import Image
          U=f"https://{os.environ['REF']}.supabase.co"; K=os.environ['SK']
          files=json.load(open('pages/_list.json'))
          stat={'old':0,'new':0,'done':0,'skip':0}
          def work(n):
              raw=open('pages/'+n,'rb').read()
              im=Image.open(io.BytesIO(raw)); im.load()
              if im.mode!='RGB': im=im.convert('RGB')
              b=io.BytesIO(); im.save(b,'JPEG',quality=75,optimize=True,progressive=True); new=b.getvalue()
              if len(new)>=len(raw)*0.95: return (len(raw),len(raw),0)
              for t in range(4):
                  try:
                      r=urllib.request.Request(f'{U}/storage/v1/object/library-files/{n}',method='PUT',data=new,
                          headers={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'image/jpeg','x-upsert':'true','cache-control':'3600'})
                      urllib.request.urlopen(r,timeout=120).read(); return (len(raw),len(new),1)
                  except Exception as e: err=e
              raise err
          with cf.ThreadPoolExecutor(12) as ex:
              for o,nw,d in ex.map(work,files):
                  stat['old']+=o; stat['new']+=nw; stat['done' if d else 'skip']+=1
          print('pages',len(files),'compressed',stat['done'],'skipped',stat['skip'])
          print('MB before',round(stat['old']/1048576,1),'after',round(stat['new']/1048576,1),'saved',round((stat['old']-stat['new'])/1048576,1))
          PY
          python3 /tmp/c.py
