name: zzz probe curriculum g7 math full
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          q="select unit, lesson from public.curriculum where grade=7 and subject='الرياضيات' and semester='الفصل الأول' order by sort;"
          body=$(jq -Rs '{query: .}' <<< "$q")
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" > cur.json
          cat cur.json
      - uses: actions/upload-artifact@v4
        with:
          name: cur
          path: cur.json
