name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      preview_ref:
        description: 'فرع المعاينة (يُنشر تحت /preview/)'
        required: false
        default: 'claude/wizardly-brahmagupta-zzk93i'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # حارسٌ يسبق النشر. كان فحصُ البنية يعمل في سير عملٍ مستقلّ يُطلقه نفس
  # الدفع، فيمضيان متوازيين: يفشل الفحص وينجح النشر، فتصل الصفحة المكسورة
  # إلى المعلّمات ويبقى ✗ أحمرُ لا يمنع شيئاً. الآن النشر يتوقّف عليه.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tools/check-html.mjs

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # نسخة المعاينة: فرع العمل يُنشر تحت /preview/ على النطاق نفسه، فيدخلها
      # المشرف بحسابه الحقيقي ويعاين التعديلات قبل دمجها للجميع. المعلّمات لا
      # يصلن إليها إلا بالرابط المباشر، ولا تمسّ الصفحات الرئيسية.
      - name: Checkout preview branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ github.event.inputs.preview_ref || 'claude/wizardly-brahmagupta-zzk93i' }}
          path: preview
      - name: Prepare preview
        run: |
          if [ -d preview ]; then
            rm -rf preview/.git preview/.github preview/supabase
            # لا تُفهرَس نسخة المعاينة في محركات البحث
            for f in preview/*.html; do sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' "$f"; done
            echo "preview: $(ls preview | wc -l) files"
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
