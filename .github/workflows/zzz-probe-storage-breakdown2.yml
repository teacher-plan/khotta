name: zzz probe storage breakdown2
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "كل الـ buckets الموجودة" "select id, name, public from storage.buckets;"

          run "حجم كل bucket" "select bucket_id, pg_size_pretty(sum((metadata->>'size')::bigint)) as sz, count(*) as files from storage.objects group by bucket_id order by sum((metadata->>'size')::bigint) desc;"

          run "حجم قاعدة البيانات pg_database_size" "select pg_size_pretty(pg_database_size(current_database()));"

          run "أكبر 10 جداول من حيث الحجم" "select relname, pg_size_pretty(pg_total_relation_size(oid)) from pg_class where relkind='r' order by pg_total_relation_size(oid) desc limit 10;"
