# فحصٌ مؤقّت — يُحذف فور قراءة نتيجته.
# قراءةٌ صرفة من Supabase Management API بنفس السرّ القائم:
# إشعارات اللوحة، ثم مسارات الاشتراك المحتملة (الخطة وتاريخ التجديد).
name: zzz probe — Supabase status

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: قراءة الحالة
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
          ORG: izqkwfhmirhcwkdvjdew
        run: |
          set -uo pipefail
          api() {
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' \
              "https://api.supabase.com/v1$1" \
              -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json')
            echo "HTTP $code  <-  $1"
            jq -c . /tmp/r.json 2>/dev/null | head -c 2500 || head -c 800 /tmp/r.json
            echo ""
          }

          echo "======== اشعارات اللوحة ========"
          api "/notifications?offset=0&limit=20"

          echo "======== مسارات الاشتراك المحتملة ========"
          api "/organizations/$ORG"
          api "/organizations/$ORG/billing/subscription"
          api "/organizations/$ORG/subscription"
          api "/billing/subscriptions"
          api "/projects/$REF/billing/addons"
          api "/projects/$REF/billing/subscription"
