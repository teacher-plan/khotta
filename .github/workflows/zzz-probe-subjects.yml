name: zzz probe subjects
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: فحص المواد
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -uo pipefail
          q() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary "$(jq -Rs '{query: .}' <<< "$1")"
            echo
          }
          echo "— المواد في shared_preps (كل الوقت) —"
          q "select subject, count(*) as cnt from shared_preps group by subject order by cnt desc limit 15;"

          echo "— المواد في user_preps (كل الوقت) —"
          q "select subject, count(*) as cnt from user_preps group by subject order by cnt desc limit 15;"

          echo "— المواد في games (كل الوقت) —"
          q "select subject, count(*) as cnt from games group by subject order by cnt desc limit 15;"

          echo "— عدد المعلمات النشطات فعلياً في آخر ٣٠ يوم عبر user_preps —"
          q "select subject, count(distinct user_id) as teachers from user_preps where updated_at > now() - interval '30 days' group by subject order by teachers desc limit 15;"

          echo "— الثيمات الموجودة حالياً في game_themes —"
          q "select id, name from game_themes order by 1;"
