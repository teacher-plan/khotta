name: zzz probe db health
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "أكبر ١٠ جداول" "select s.relname as tbl, pg_size_pretty(pg_total_relation_size(s.relid)) as size, s.n_live_tup as rows from pg_stat_user_tables s where s.schemaname='public' order by pg_total_relation_size(s.relid) desc limit 10;"

          run "أعمدة health_checks" "select column_name from information_schema.columns where table_name='health_checks' order by ordinal_position;"

          run "allowed_emails: فعّالة/منتهية حسب الحلقة" "select cycle, count(*) total, count(*) filter (where expires_at is null or expires_at>now()) active, count(*) filter (where expires_at is not null and expires_at<now()) expired from allowed_emails group by cycle order by cycle;"

          run "أكبر مخزّن Storage (buckets)" "select b.name, count(o.id) files, pg_size_pretty(coalesce(sum((o.metadata->>'size')::bigint),0)) size from storage.buckets b left join storage.objects o on o.bucket_id=b.id group by b.name order by coalesce(sum((o.metadata->>'size')::bigint),0) desc;"
