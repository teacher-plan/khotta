name: zzz probe db health
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "حجم القاعدة الكلي" "select pg_size_pretty(pg_database_size(current_database())) as db_size;"

          run "أكبر ١٢ جدولاً حجماً" "select relname as tbl, pg_size_pretty(pg_total_relation_size(c.oid)) as size, n_live_tup as rows from pg_stat_user_tables s join pg_class c on c.relname=s.relname and c.relnamespace='public'::regnamespace order by pg_total_relation_size(c.oid) desc limit 12;"

          run "جداول public بلا RLS (خطر أمني)" "select c.relname as tbl from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity=false order by 1;"

          run "أعداد صفوف الجداول الرئيسية" "select 'allowed_emails' t, count(*) n from allowed_emails union all select 'cycle1_profiles', count(*) from cycle1_profiles union all select 'curriculum', count(*) from curriculum union all select 'book_sources', count(*) from book_sources union all select 'teacher_guides', count(*) from teacher_guides union all select 'games', count(*) from games union all select 'c1_shared_assets', count(*) from c1_shared_assets union all select 'lesson_prep_generations', count(*) from lesson_prep_generations order by t;"

          run "حوادث العمليات آخر ٧ أيام" "select severity, status, count(*) from ops_incidents where detected_at > now()-interval '7 days' group by severity,status order by count desc;"

          run "أخطاء آخر ٧ أيام (أكثر الدوال)" "select function_name, count(*) from error_logs where occurred_at > now()-interval '7 days' group by function_name order by count desc limit 10;"

          run "صحّة النظام آخر فحص" "select component, status, checked_at from health_checks where checked_at > now()-interval '20 min' order by checked_at desc limit 12;"

          run "تشغيلات pg_cron الفاشلة آخر ٢٤ساعة" "select j.jobname, count(*) fails from cron.job_run_details d join cron.job j on j.jobid=d.jobid where d.status!='succeeded' and d.start_time>now()-interval '24 hours' group by j.jobname order by fails desc;"

          run "حسابات منتهية لكنها فعّالة؟" "select count(*) as expired_active from allowed_emails where expires_at is not null and expires_at < now();"

          run "تسجيلات مسبقة غير مُبلَّغة" "select count(*) from pre_registrations where welcomed_at is null;"

          run "تكلفة الذكاء آخر ٣٠ يوماً (USD)" "select round(sum(cost_usd)::numeric,2) as usd_30d, count(*) as calls from ai_cost_log where created_at > now()-interval '30 days';"
