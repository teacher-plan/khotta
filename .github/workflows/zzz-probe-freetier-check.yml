name: zzz probe freetier check
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "حجم Storage الإجمالي" "select pg_size_pretty(sum((metadata->>'size')::bigint)) from storage.objects;"

          run "حجم قاعدة البيانات كلياً" "select pg_size_pretty(pg_database_size(current_database()));"

          run "عدد allowed_emails الفعلية حالياً" "select count(*) from allowed_emails where expires_at is null or expires_at>now();"

          run "عدد auth.users كل" "select count(*) from auth.users;"

          run "عدد auth.users النشطين آخر 30 يوماً (يقارب MAU)" "select count(*) from auth.users where last_sign_in_at > now() - interval '30 days';"
