name: zzz probe subjects
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          q="select 'cur' src, grade::text g, subject, semester, count(*)::text n from public.curriculum group by 2,3,4 union all select 'book', grade::text, subject, semester, book_no::text from public.book_sources union all select 'guide', grade::text, subject, semester, page_count::text from public.teacher_guides order by 1,2,3;"
          body=$(jq -Rs '{query: .}' <<< "$q")
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-binary "$body" | jq -c '.[]?, .'
