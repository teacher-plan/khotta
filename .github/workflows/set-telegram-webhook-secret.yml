# تشغيلٌ يدويٌّ لمرّةٍ واحدة يُنجز الخطوتين اللتين وثّقهما كود telegram-webhook
# (القسم 3 من تقرير الأمان — verifyTelegramSecret) كخطوةٍ واحدة آمنة:
#   ١) يولّد سرّاً عشوائياً ويضعه TELEGRAM_WEBHOOK_SECRET في بيئة الدالّة
#   ٢) يسجّله لدى تلغرام عبر setWebhook مع secret_token بنفس القيمة، لكل
#      بوتٍ زُوِّد توكنه في مدخلات هذا التشغيل
# لا القيمة المولَّدة ولا أي توكن بوت يُطبَع في أي خطوة سجلّ إطلاقاً.
name: Set Telegram Webhook Secret

on:
  workflow_dispatch:
    inputs:
      main_bot_token:
        description: "توكن البوت الأصلي (الترحيب/الدفع) — اتركه فارغاً لتخطّيه"
        required: false
      ops_bot_token:
        description: "توكن بوت العمليات (ops) — اتركه فارغاً لتخطّيه"
        required: false

jobs:
  set-webhook-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: توليد سرٍّ عشوائي وضبطه في Supabase (بلا طباعة القيمة)
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          supabase secrets set "TELEGRAM_WEBHOOK_SECRET=$SECRET" --project-ref mkdsnnfkkdwdkywnwnjh
          echo "SECRET=$SECRET" >> "$GITHUB_ENV"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: تسجيل السرّ لدى تلغرام (setWebhook) لكل بوتٍ زُوِّد توكنه
        run: |
          set -euo pipefail
          BASE_URL="https://mkdsnnfkkdwdkywnwnjh.supabase.co/functions/v1/telegram-webhook"

          if [ -n "$MAIN_TOKEN" ]; then
            echo "::add-mask::$MAIN_TOKEN"
            resp="$(curl -sS -X POST "https://api.telegram.org/bot${MAIN_TOKEN}/setWebhook" \
              -d "url=${BASE_URL}" -d "secret_token=${SECRET}")"
            ok="$(echo "$resp" | grep -o '"ok":[a-z]*' || true)"
            echo "main bot setWebhook: ${ok:-unknown}"
            echo "$ok" | grep -q '"ok":true' || { echo "::error::تعذّر تسجيل السرّ للبوت الأصلي"; exit 1; }
          else
            echo "main bot: تخطّي (بلا توكن)"
          fi

          if [ -n "$OPS_TOKEN" ]; then
            echo "::add-mask::$OPS_TOKEN"
            resp="$(curl -sS -X POST "https://api.telegram.org/bot${OPS_TOKEN}/setWebhook" \
              -d "url=${BASE_URL}?bot=ops" -d "secret_token=${SECRET}")"
            ok="$(echo "$resp" | grep -o '"ok":[a-z]*' || true)"
            echo "ops bot setWebhook: ${ok:-unknown}"
            echo "$ok" | grep -q '"ok":true' || { echo "::error::تعذّر تسجيل السرّ لبوت العمليات"; exit 1; }
          else
            echo "ops bot: تخطّي (بلا توكن)"
          fi
        env:
          SECRET: ${{ env.SECRET }}
          MAIN_TOKEN: ${{ inputs.main_bot_token }}
          OPS_TOKEN: ${{ inputs.ops_bot_token }}
