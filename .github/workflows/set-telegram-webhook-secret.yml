# تشغيلٌ يدويٌّ لمرّةٍ واحدة يُنجز الخطوتين اللتين وثّقهما كود telegram-webhook
# (القسم 3 من تقرير الأمان — verifyTelegramSecret) كخطوةٍ واحدة آمنة:
#   ١) يولّد سرّاً عشوائياً ويضعه TELEGRAM_WEBHOOK_SECRET في بيئة الدالّة
#   ٢) يسجّله لدى تلغرام عبر setWebhook مع secret_token بنفس القيمة، لكل
#      بوتٍ زُوِّد توكنه في مدخلات هذا التشغيل
# لا القيمة المولَّدة ولا أي توكن بوت يُطبَع في أي خطوة سجلّ إطلاقاً.
name: Set Telegram Webhook Secret

on:
  workflow_dispatch:
    inputs:
      main_bot_token:
        description: "توكن البوت الأصلي (الترحيب/الدفع) — اتركه فارغاً لتخطّيه"
        required: false
      ops_bot_token:
        description: "توكن بوت العمليات (ops) — اتركه فارغاً لتخطّيه"
        required: false
      payment_bot_token:
        description: "توكن بوت متابعة الدفع — أرسلي له /start أولاً من تلغرام ثم ضعي توكنه هنا (اتركه فارغاً لتخطّيه)"
        required: false

jobs:
  set-webhook-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: توليد سرٍّ عشوائي وضبطه في Supabase (بلا طباعة القيمة)
        if: ${{ inputs.main_bot_token != '' || inputs.ops_bot_token != '' }}
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          supabase secrets set "TELEGRAM_WEBHOOK_SECRET=$SECRET" --project-ref mkdsnnfkkdwdkywnwnjh
          echo "SECRET=$SECRET" >> "$GITHUB_ENV"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: تسجيل السرّ لدى تلغرام (setWebhook) لكل بوتٍ زُوِّد توكنه
        if: ${{ inputs.main_bot_token != '' || inputs.ops_bot_token != '' }}
        run: |
          set -euo pipefail
          BASE_URL="https://mkdsnnfkkdwdkywnwnjh.supabase.co/functions/v1/telegram-webhook"

          if [ -n "$MAIN_TOKEN" ]; then
            echo "::add-mask::$MAIN_TOKEN"
            resp="$(curl -sS -X POST "https://api.telegram.org/bot${MAIN_TOKEN}/setWebhook" \
              -d "url=${BASE_URL}" -d "secret_token=${SECRET}")"
            ok="$(echo "$resp" | grep -o '"ok":[a-z]*' || true)"
            echo "main bot setWebhook: ${ok:-unknown}"
            echo "$ok" | grep -q '"ok":true' || { echo "::error::تعذّر تسجيل السرّ للبوت الأصلي"; exit 1; }
          else
            echo "main bot: تخطّي (بلا توكن)"
          fi

          if [ -n "$OPS_TOKEN" ]; then
            echo "::add-mask::$OPS_TOKEN"
            resp="$(curl -sS -X POST "https://api.telegram.org/bot${OPS_TOKEN}/setWebhook" \
              -d "url=${BASE_URL}?bot=ops" -d "secret_token=${SECRET}")"
            ok="$(echo "$resp" | grep -o '"ok":[a-z]*' || true)"
            echo "ops bot setWebhook: ${ok:-unknown}"
            echo "$ok" | grep -q '"ok":true' || { echo "::error::تعذّر تسجيل السرّ لبوت العمليات"; exit 1; }
          else
            echo "ops bot: تخطّي (بلا توكن)"
          fi
        env:
          SECRET: ${{ env.SECRET }}
          MAIN_TOKEN: ${{ inputs.main_bot_token }}
          OPS_TOKEN: ${{ inputs.ops_bot_token }}

      # بوت الدفع مستقلٌّ تماماً: توكنه، chat_id (يُكتشَف تلقائياً من أول
      # رسالةٍ أرسلتِها له)، وسرّ ويبهوك خاصٌّ به — لا يمسّ أياً من أسرار
      # البوتين الأصلي والعمليات، ولا يتأثّر بها مستقبلاً.
      - name: ضبط بوت متابعة الدفع (توكن، chat_id، سرّ ويبهوك مستقل)
        if: ${{ inputs.payment_bot_token != '' }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PAYMENT_TOKEN"

          updates="$(curl -sS "https://api.telegram.org/bot${PAYMENT_TOKEN}/getUpdates")"
          CHAT_ID="$(echo "$updates" | python3 -c "
import json,sys
d=json.load(sys.stdin)
res=d.get('result') or []
if not res:
    print('')
else:
    print(res[-1].get('message',{}).get('chat',{}).get('id') or res[-1].get('my_chat_member',{}).get('chat',{}).get('id') or '')
")"
          if [ -z "$CHAT_ID" ]; then
            echo "::error::لم يُعثر على chat_id — أرسلي أي رسالة (مثلاً /start) لبوت الدفع من تلغرام أولاً ثم أعيدي تشغيل هذا التشغيل"
            exit 1
          fi
          echo "::add-mask::$CHAT_ID"

          PAY_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$PAY_SECRET"

          supabase secrets set \
            "TELEGRAM_BOT_TOKEN_PAYMENT=$PAYMENT_TOKEN" \
            "TELEGRAM_CHAT_ID_PAYMENT=$CHAT_ID" \
            "TELEGRAM_WEBHOOK_SECRET_PAYMENT=$PAY_SECRET" \
            --project-ref mkdsnnfkkdwdkywnwnjh

          resp="$(curl -sS -X POST "https://api.telegram.org/bot${PAYMENT_TOKEN}/setWebhook" \
            -d "url=https://mkdsnnfkkdwdkywnwnjh.supabase.co/functions/v1/telegram-webhook?bot=payment" \
            -d "secret_token=${PAY_SECRET}")"
          ok="$(echo "$resp" | grep -o '"ok":[a-z]*' || true)"
          echo "payment bot setWebhook: ${ok:-unknown}"
          echo "$ok" | grep -q '"ok":true' || { echo "::error::تعذّر تسجيل سرّ الويبهوك لبوت الدفع"; exit 1; }

          curl -sS -X POST "https://api.telegram.org/bot${PAYMENT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" -d "text=✅ تمّ ربط بوت متابعة الدفع بنجاح." > /dev/null
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PAYMENT_TOKEN: ${{ inputs.payment_bot_token }}
