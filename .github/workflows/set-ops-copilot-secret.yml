# تشغيلٌ يدويٌّ لمرّةٍ واحدة: يضع سرّ OPS_COPILOT_INTERNAL_SECRET (المسار
# الداخلي الضيّق الذي يربط بوت تلغرام الخاص بالعمليات بـops-copilot —
# راجع ops-copilot/index.ts وtelegram-webhook/index.ts) كسرّ Supabase
# مباشرةً من مدخل هذا التشغيل — لا يُطبَع في أي خطوة سجلّ إطلاقاً.
name: Set Ops Copilot Internal Secret

on:
  workflow_dispatch:
    inputs:
      secret_value:
        description: "OPS_COPILOT_INTERNAL_SECRET value"
        required: true

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: ضبط سرّ Supabase (بلا طباعة القيمة)
        run: |
          supabase secrets set \
            "OPS_COPILOT_INTERNAL_SECRET=$SECRET_VALUE" \
            --project-ref mkdsnnfkkdwdkywnwnjh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SECRET_VALUE: ${{ inputs.secret_value }}
