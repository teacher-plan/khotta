name: zzz probe cycle2 planstate
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          q="select email, updated_at from public.cycle1_profiles where updated_at > now() - interval '2 days' order by updated_at desc limit 20;"
          body=$(jq -Rs '{query: .}' <<< "$q")
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq .
