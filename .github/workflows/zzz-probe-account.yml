name: zzz probe account
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run() { echo "── $1"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]? // .'; }
          E="xx@y.com"
          run "auth.users" "select id, email, created_at, last_sign_in_at, email_confirmed_at, banned_until, deleted_at from auth.users where lower(email)='$E'"
          run "allowed_emails" "select * from allowed_emails where lower(email)='$E'"
          run "جداول فيها عمود email/user_id" "select table_name from information_schema.columns where table_schema='public' and column_name='user_id' and table_name in ('profiles','teachers','cycle1_profiles','c1_profiles','teacher_profiles','user_profiles')"
          run "الأخطاء" "select function_name, error_code, left(error_message,160) as msg, occurred_at from error_logs where user_id=(select id from auth.users where lower(email)='$E') order by occurred_at desc limit 10"
          run "تكاليف الذكاء" "select function_name, model, cost_usd, created_at from ai_cost_log where user_id=(select id from auth.users where lower(email)='$E') order by created_at desc limit 10"
          run "الحصة الشهرية" "select * from ai_usage where user_id=(select id from auth.users where lower(email)='$E') order by month desc limit 6"
          run "ملفاته في التخزين" "select count(*) as files, coalesce(sum((metadata->>'size')::bigint),0) as bytes, max(created_at) as last from storage.objects where owner=(select id from auth.users where lower(email)='$E') or name like '%'||(select id::text from auth.users where lower(email)='$E')||'%'"
          run "إعدادات الحصة" "select key, value from ai_settings where key ilike '%quota%' or key ilike '%limit%' or key ilike '%trial%' limit 12"
