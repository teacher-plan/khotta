name: zzz probe sec
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: فحص
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -uo pipefail
          raw() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary "$(jq -Rs '{query: .}' <<< "$1")"
          }
          echo "════ ١) كل سياسات allowed_emails بتفاصيلها ════"
          raw "select policyname, cmd, coalesce(qual,'—') as using_expr, coalesce(with_check,'—') as check_expr from pg_policies where tablename='allowed_emails' order by cmd;" \
            | jq -r '.[] | "[\(.cmd)] \(.policyname)\n    USING: \(.using_expr)\n    CHECK: \(.check_expr)"'

          echo
          echo "════ ٢) سياسات التخزين على user-files و library-files ════"
          raw "select policyname, cmd, coalesce(with_check,'—') as check_expr from pg_policies where schemaname='storage' and tablename='objects' and (policyname ilike '%userfiles%' or policyname ilike '%c1lib%') order by policyname;" \
            | jq -r '.[] | "[\(.cmd)] \(.policyname)\n    CHECK: \(.check_expr)"'

          echo
          echo "════ ٣) توقيع can_upload_file ════"
          raw "select p.proname, pg_get_function_identity_arguments(p.oid) as args, pg_get_function_result(p.oid) as result from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('can_upload_file','is_app_admin');" \
            | jq -r '.[] | "\(.proname)(\(.args)) → \(.result)"'

          echo
          echo "════ ٤) هل يوجد عمود size في storage.objects metadata؟ ════"
          raw "select count(*) as objs, count(*) filter (where (metadata->>'size') is not null) as with_size from storage.objects where bucket_id in ('user-files','library-files');" \
            | jq -r '.[] | "كائنات: \(.objs) | لها حجم مسجّل: \(.with_size)"'
