name: zzz probe freetier deepcheck
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          echo "════ إعدادات المشروع العامة ════"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF" | jq '{status, region, database: .database.version}'
          echo

          echo "════ إعدادات Auth (SMTP مخصص؟ حدود البريد) ════"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/config/auth" | jq '{external_email_enabled, mailer_autoconfirm, smtp_host, smtp_admin_email, smtp_sender_name, rate_limit_email_sent, mailer_secure_email_change_enabled}'
          echo

          echo "════ Edge Functions الموجودة ════"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/functions" | jq -c '.[] | {slug, status}'
          echo

          run "عدد استدعاءات auth.users آخر تسجيل دخول (نشاط API حقيقي حديث)" "select max(last_sign_in_at) from auth.users;"

          run "هل هناك اتصالات Realtime مفعّلة (publication)" "select pubname from pg_publication;"

          run "أعمدة/سياسات pg_net أو http لاستدعاء cron خارجياً" "select count(*) from pg_extension where extname in ('pg_net','http');"

          run "عدد استدعاءات الوظائف اليومي التقريبي من ai_cost_log آخر 24 ساعة" "select count(*) from ai_cost_log where created_at > now() - interval '24 hours';"

          run "آخر نشاط health_checks (يثبت استمرار عمل cron الآن)" "select max(checked_at) from health_checks;"
