# تشغيلٌ يدويٌّ لمرّةٍ واحدة: يضع توكن بوت "الفحص الدوري" ومعرّف محادثته
# كأسرار Supabase مباشرةً من مدخلات هذا التشغيل — لا تُطبَع القيمتان في
# أي خطوة سجلّ (لا echo لهما إطلاقاً).
name: Set Telegram Ops Bot Secrets

on:
  workflow_dispatch:
    inputs:
      bot_token:
        description: "Telegram bot token (ops)"
        required: true
      chat_id:
        description: "Telegram chat id (ops)"
        required: true

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: ضبط أسرار Supabase (بلا طباعة القيمتين)
        run: |
          supabase secrets set \
            "TELEGRAM_BOT_TOKEN_OPS=$TOKEN_OPS" \
            "TELEGRAM_CHAT_ID_OPS=$CHAT_ID_OPS" \
            --project-ref mkdsnnfkkdwdkywnwnjh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TOKEN_OPS: ${{ inputs.bot_token }}
          CHAT_ID_OPS: ${{ inputs.chat_id }}
