# تشغيلٌ يدويٌّ لمرّةٍ واحدة: يضع توكن بوت "الفحص الدوري" الجديد ومعرّف
# محادثته كأسرار Supabase — لا يظهر التوكن في أي سجلٍّ إطلاقاً (يُقرأ من
# سرّ GitHub مباشرةً إلى أمر الـCLI، لا يُطبَع ولا يُمرَّر كمدخل ظاهر).
# يتطلّب سرَّين جديدين في GitHub: TELEGRAM_BOT_TOKEN_OPS، TELEGRAM_CHAT_ID_OPS
name: Set Telegram Ops Bot Secrets

on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: تحقّق من وجود السرّين قبل المتابعة
        run: |
          if [ -z "$TOKEN_OPS" ]; then echo "::error::سرّ TELEGRAM_BOT_TOKEN_OPS غير موجود في إعدادات المستودع"; exit 1; fi
          if [ -z "$CHAT_ID_OPS" ]; then echo "::error::سرّ TELEGRAM_CHAT_ID_OPS غير موجود في إعدادات المستودع"; exit 1; fi
          echo "✅ السرّان موجودان — سنتابع بلا طباعة قيمتيهما."
        env:
          TOKEN_OPS: ${{ secrets.TELEGRAM_BOT_TOKEN_OPS }}
          CHAT_ID_OPS: ${{ secrets.TELEGRAM_CHAT_ID_OPS }}

      - name: ضبط أسرار Supabase
        run: |
          supabase secrets set \
            "TELEGRAM_BOT_TOKEN_OPS=$TOKEN_OPS" \
            "TELEGRAM_CHAT_ID_OPS=$CHAT_ID_OPS" \
            --project-ref mkdsnnfkkdwdkywnwnjh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TOKEN_OPS: ${{ secrets.TELEGRAM_BOT_TOKEN_OPS }}
          CHAT_ID_OPS: ${{ secrets.TELEGRAM_CHAT_ID_OPS }}
