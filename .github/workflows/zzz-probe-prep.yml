name: zzz probe prep
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: q
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          q(){ echo "=== $1"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?,.message?' 2>/dev/null | head -40; }
          S=$(date -u -d '-48 hours' +%Y-%m-%dT%H:%M:%S.000Z); E=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          for src in function_logs function_edge_logs; do
            SQL="select timestamp, event_message from $src where event_message like '%lesson%' or event_message like '%rror%' order by timestamp desc limit 60"
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$SQL")
            echo "=== logs $src"
            curl -s "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs?sql=$ENC&iso_timestamp_start=$S&iso_timestamp_end=$E" -H "Authorization: Bearer $TOKEN" | head -c 6000; echo
          done
          SQL="select timestamp, event_message, response.status_code as sc, m.execution_time_ms as ms from function_edge_logs cross join unnest(metadata) as m cross join unnest(m.response) as response where event_message like '%generate-lesson-plan%' order by timestamp desc limit 40"
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$SQL")
          echo "=== edge gen"; curl -s "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs?sql=$ENC&iso_timestamp_start=$S&iso_timestamp_end=$E" -H "Authorization: Bearer $TOKEN" | head -c 5000
