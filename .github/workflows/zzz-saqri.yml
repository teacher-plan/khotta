# مؤقّت: حساب أ. عبدالرحمن الصقري (إسلامية ٦ و٩) + إرفاق عرض «أكبر الكبائر» في بطاقة الدرس لدى أ. خلفان وأ. الصقري. يُحذف بعد التشغيل.
name: zzz saqri + kabaer deck
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -euo pipefail
          export SK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SK"
          cat > /tmp/c.mjs <<'JS'
          import fs from 'fs';
          const U=`https://${process.env.REF}.supabase.co`, K=process.env.SK;
          const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
          const j=async(r)=>{const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t);return t?JSON.parse(t):null;};
          const SUBJ='التربية الإسلامية', SEM='الفصل الأول';
          const sid=(a,b,c,d,e)=>{const raw=`${a}|${b}|${c}|${d}|${e}`;let h=5381;for(let i=0;i<raw.length;i++){h=((h<<5)+h+raw.charCodeAt(i))>>>0;}return 'L'+h.toString(36);};
          // ١) رفع العرض
          const dest='presentations/islamic/g9/akbar-alkabaer.html.txt';
          const buf=fs.readFileSync('supabase/_uploads/akbar-alkabaer.html');
          await j(await fetch(`${U}/storage/v1/object/library-files/${dest}`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'text/plain; charset=utf-8','x-upsert':'true'},body:buf}));
          const pub=`${U}/storage/v1/object/public/library-files/${dest}?v=1`;
          console.log('public', (await fetch(pub)).status);
          // ٢) المناهج
          const cur=async g=>j(await fetch(`${U}/rest/v1/curriculum?select=*&semester=eq.${encodeURIComponent(SEM)}&subject=eq.${encodeURIComponent(SUBJ)}&grade=eq.${g}&order=sort`,{headers:H}));
          const r9=await cur(9), r6=await cur(6);
          const unitsOf=rows=>{const units=[],m={};rows.slice().sort((a,b)=>(a.sort||0)-(b.sort||0)).forEach(r=>{if(!m[r.unit]){m[r.unit]=[];units.push({name:r.unit,lessons:m[r.unit]});}m[r.unit].push({id:sid(SEM,SUBJ,r.grade,r.unit,r.lesson),name:r.lesson});});return units;};
          const kab=r9.filter(r=>/الكبائر/.test(r.lesson));
          if(kab.length!==1)throw new Error('kabaer lesson match: '+r9.map(r=>r.unit+' / '+r.lesson).join(' | '));
          const lid=sid(SEM,SUBJ,kab[0].grade,kab[0].unit,kab[0].lesson);
          console.log('lesson',kab[0].unit,'/',kab[0].lesson,lid);
          const fileEntry={name:'أكبر الكبائر — العرض التفاعلي.html',type:'text/html',size:buf.length,viewLink:pub,previewLink:pub,html:true};
          const attach=d=>{d.plan_state=d.plan_state||{};const st=d.plan_state[lid]||{done:false,classes:{}};const fs_=(st.files||[]).filter(f=>f.name!==fileEntry.name);st.files=[...fs_,fileEntry];d.plan_state[lid]=st;};
          const list=await j(await fetch(`${U}/auth/v1/admin/users?per_page=1000`,{headers:H}));
          // ٣) أ. خلفان
          const kid=(list.users||[]).find(u=>u.email==='khalfan.demo@khotati.com')?.id;
          const [kp]=await j(await fetch(`${U}/rest/v1/cycle1_profiles?id=eq.${kid}&select=data`,{headers:H}));
          attach(kp.data); kp.data.updated_at=new Date().toISOString();
          await j(await fetch(`${U}/rest/v1/cycle1_profiles?id=eq.${kid}`,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({data:kp.data,updated_at:kp.data.updated_at})}));
          console.log('khalfan files', (kp.data.plan_state[lid].files||[]).length);
          // ٤) أ. عبدالرحمن الصقري
          const EMAIL='alsaqri.demo@khotati.com', PASS='Alsaqri@2026', NAME='عبدالرحمن الصقري';
          let uid=(list.users||[]).find(u=>u.email===EMAIL)?.id;
          if(!uid){uid=(await j(await fetch(`${U}/auth/v1/admin/users`,{method:'POST',headers:H,body:JSON.stringify({email:EMAIL,password:PASS,email_confirm:true,user_metadata:{full_name:NAME}})}))).id;}
          const exp=new Date(Date.now()+150*864e5).toISOString();
          await fetch(`${U}/rest/v1/allowed_emails?email=eq.${EMAIL}`,{method:'DELETE',headers:H});
          await j(await fetch(`${U}/rest/v1/allowed_emails`,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({email:EMAIL,cycle:'cycle1',expires_at:exp})}));
          const COL=['#D86048','#487848','#4878A8','#C0A848'];
          const g6=[{id:'c1g6s6',name:'السادس/٦',num:6,color:COL[0],subjects:[SUBJ],students:[]}];
          const g9=[3,4,5].map((n,k)=>({id:`c1g9s${n}`,name:'التاسع/'+'٣٤٥'[k],num:n,color:COL[k+1],subjects:[SUBJ],students:[]}));
          const now=new Date().toISOString();
          const data={display_name:NAME,phone:'',semester:SEM,grades:[{num:6,classes:g6},{num:9,classes:g9}],setupDone:true,ach_profile:{school:''},teacher_gender:'m',
            plan_units:{[`6|${SUBJ}`]:unitsOf(r6),[`9|${SUBJ}`]:unitsOf(r9)},plan_state:{},updated_at:now};
          attach(data);
          await j(await fetch(`${U}/rest/v1/cycle1_profiles?on_conflict=id`,{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:uid,email:EMAIL,data,updated_at:now})}));
          console.log('DONE saqri',uid,'g6',r6.length,'g9',r9.length);
          JS
          node /tmp/c.mjs
