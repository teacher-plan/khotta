name: zzz probe cycle2 teacher plan g7 math
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          q="select email, cycle, expires_at from public.allowed_emails where cycle='main' order by email;"
          body=$(jq -Rs '{query: .}' <<< "$q")
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq .
