# مؤقّت: حذف ملف book-cache القديم وصور c1-preps غير المرجَعة بعد نسخها احتياطياً. يُحذف بعد التشغيل.
name: zzz safe cleanup
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: backup + delete
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -euo pipefail
          export SK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SK"
          mkdir -p bk
          cat > /tmp/s.py <<'PY'
          import os, json, urllib.request
          U=f"https://{os.environ['REF']}.supabase.co"; K=os.environ['SK']
          H={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'}
          def req(m,url,body=None,h=H,raw=False):
              r=urllib.request.Request(url,method=m,headers=h,data=(json.dumps(body).encode() if body is not None else None))
              d=urllib.request.urlopen(r,timeout=180).read()
              return d if raw else (json.loads(d) if d else None)
          def lst(p):
              out=[];off=0
              while True:
                  b=req('POST',f'{U}/storage/v1/object/list/library-files',{'prefix':p,'limit':1000,'offset':off}); out+=b
                  if len(b)<1000: return out
                  off+=1000
          def allrows(t,sel):
              out=[];off=0
              while True:
                  b=req('GET',f'{U}/rest/v1/{t}?select={sel}&limit=40&offset={off}'); out+=b
                  if len(b)<40: return out
                  off+=40
          refs=''.join(json.dumps(x,ensure_ascii=False) for t,s in (('cycle1_profiles','data'),('user_preps','data'),('c1_shared_assets','*'),('profiles','data')) for x in allrows(t,s))
          print('refs text MB',round(len(refs)/1048576,1))
          names=[f"book-cache/{o['name']}" for o in lst('book-cache/') if o.get('id')]
          for f in lst('c1-preps/'):
              if f.get('id'): continue
              for o in lst(f"c1-preps/{f['name']}/"):
                  n=f"c1-preps/{f['name']}/{o['name']}"
                  if o.get('id') and n not in refs and o['name'] not in refs: names.append(n)
          tot=0
          for n in names:
              b=req('GET',f'{U}/storage/v1/object/library-files/{n}',h={'apikey':K,'Authorization':'Bearer '+K},raw=True)
              os.makedirs('bk/'+os.path.dirname(n),exist_ok=True); open('bk/'+n,'wb').write(b); tot+=len(b)
          print('to delete',len(names),'MB',round(tot/1048576,1)); print('\n'.join(names))
          for i in range(0,len(names),100): req('DELETE',f'{U}/storage/v1/object/library-files',{'prefixes':names[i:i+100]})
          print('DONE')
          PY
          python3 /tmp/s.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backup-safe-cleanup, path: bk, retention-days: 30 }
