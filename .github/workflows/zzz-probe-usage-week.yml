name: zzz probe usage last week
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "حجم القاعدة الآن" "select pg_size_pretty(pg_database_size(current_database())) as db_size;"

          run "حجم Storage الكلي" "select b.name, count(o.id) files, pg_size_pretty(coalesce(sum((o.metadata->>'size')::bigint),0)) size, sum((o.metadata->>'size')::bigint) bytes from storage.buckets b left join storage.objects o on o.bucket_id=b.id group by b.name;"

          run "مستخدمون فعّالون آخر ٧ أيام (auth.users بحسب last_sign_in)" "select count(*) from auth.users where last_sign_in_at > now()-interval '7 days';"

          run "إجمالي مستخدمي auth.users" "select count(*) from auth.users;"

          run "طلبات ai_cost_log آخر ٧ أيام (تقريب استدعاءات edge functions)" "select count(*) calls, round(sum(cost_usd)::numeric,2) usd from ai_cost_log where created_at>now()-interval '7 days';"

          run "usage_tracking آخر ٧ أيام" "select count(*) from usage_tracking where created_at>now()-interval '7 days';"

          run "page_views آخر ٧ أيام" "select count(*) from page_views where created_at>now()-interval '7 days';"
      - name: management usage
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          echo "════ استخدام المشروع اليومي (Management API) ════"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/usage" | head -c 3000
          echo
