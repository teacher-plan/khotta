name: zzz probe usage week
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: فحص الاستخدام الفعلي (٧ أيام)
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -uo pipefail
          q() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary "$(jq -Rs '{query: .}' <<< "$1")"
            echo
          }
          echo "— عدد المستخدمين الكلي وعدد النشطين آخر ٧ أيام —"
          q "select count(*) as total_users, count(*) filter (where last_sign_in_at > now() - interval '7 days') as active_7d from auth.users;"

          echo "— حجم قاعدة البيانات الكلي —"
          q "select pg_size_pretty(pg_database_size(current_database())) as db_size;"

          echo "— أكبر ١٠ جداول حجماً —"
          q "select relname, pg_size_pretty(pg_total_relation_size(relid)) as size from pg_catalog.pg_statio_user_tables order by pg_total_relation_size(relid) desc limit 10;"

          echo "— أنشطة آخر ٧ أيام في الجداول الرئيسية (إن وُجد عمود created_at) —"
          q "select 'games' as tbl, count(*) as rows_7d from games where created_at > now() - interval '7 days';"
          q "select 'c1_shared_assets' as tbl, count(*) as rows_7d from c1_shared_assets where created_at > now() - interval '7 days';"

          echo "════════ سجلّات Edge Functions (استدعاءات آخر ٧ أيام) ════════"
          START=$(date -u -d "-168 hours" +%Y-%m-%dT%H:%M:%S.000Z)
          END=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          SQL="select count(*) as total_invocations from edge_logs"
          ENC_SQL=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$SQL")
          curl -s "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs.all?sql=${ENC_SQL}&iso_timestamp_start=${START}&iso_timestamp_end=${END}" \
            -H "Authorization: Bearer $TOKEN" | python3 -m json.tool
