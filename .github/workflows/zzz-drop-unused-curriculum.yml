# مؤقّت: حذف منهج غير مستخدم من أي حساب مفعّل (الصف الثالث · عالمي الرقمي) بعد نسخه احتياطياً.
# يتحقّق أولاً أن لا حساب مفعّلاً يستخدمه، وإلا يتوقّف دون حذف. يُحذف هذا الملف بعد التشغيل.
name: zzz drop unused curriculum
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: backup + delete
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -euo pipefail
          export SK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SK"
          mkdir -p backup
          cat > /tmp/c.mjs <<'JS'
          import fs from 'fs';
          const U=`https://${process.env.REF}.supabase.co`, K=process.env.SK;
          const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
          const j=async(r)=>{const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t);return t?JSON.parse(t):null;};
          const GRADE=3, SUBJ='عالمي الرقمي', SEM='الفصل الأول';
          // ١) التحقّق: لا حساب مفعّل يستخدم المنهج
          const now=Date.now();
          const ae=await j(await fetch(`${U}/rest/v1/allowed_emails?select=email,expires_at`,{headers:H}));
          const active=new Set(ae.filter(a=>!a.expires_at||Date.parse(a.expires_at)>now).map(a=>a.email.toLowerCase()));
          const c1=await j(await fetch(`${U}/rest/v1/cycle1_profiles?select=email,data`,{headers:H}));
          const users=c1.filter(p=>active.has((p.email||'').toLowerCase())&&(p.data?.grades||[]).some(g=>+g.num===GRADE&&(g.classes||[]).some(c=>(c.subjects||[]).includes(SUBJ))));
          const mainP=await j(await fetch(`${U}/rest/v1/profiles?select=id,data`,{headers:H}));
          const mainHit=mainP.filter(p=>JSON.stringify(p.data||{}).includes(SUBJ));
          console.log('active emails',active.size,'| c1 users of curriculum:',users.length,'| main profiles mentioning subject:',mainHit.length);
          if(users.length||mainHit.length) throw new Error('ABORT: curriculum still in use');
          // ٢) السجلّات
          const bs=await j(await fetch(`${U}/rest/v1/book_sources?grade=eq.${GRADE}&subject=eq.${encodeURIComponent(SUBJ)}&semester=eq.${encodeURIComponent(SEM)}`,{headers:H}));
          const tg=await j(await fetch(`${U}/rest/v1/teacher_guides?grade=eq.${GRADE}&subject=eq.${encodeURIComponent(SUBJ)}&semester=eq.${encodeURIComponent(SEM)}`,{headers:H}));
          fs.writeFileSync('backup/rows.json',JSON.stringify({book_sources:bs,teacher_guides:tg},null,1));
          const bases=[...bs,...tg].map(r=>(r.base_path||'').replace(/\/+$/,'')).filter(Boolean);
          console.log('bases',bases);
          if(bases.length!==2) throw new Error('ABORT: expected 2 base paths, got '+bases.length);
          // ٣) نسخ احتياطي ثم حذف الملفات
          let total=0, bytes=0;
          for(const base of bases){
            const list=await j(await fetch(`${U}/storage/v1/object/list/library-files`,{method:'POST',headers:H,body:JSON.stringify({prefix:base+'/',limit:1000,offset:0})}));
            const names=list.filter(o=>o.id).map(o=>`${base}/${o.name}`);
            fs.mkdirSync('backup/'+base,{recursive:true});
            for(const n of names){
              const r=await fetch(`${U}/storage/v1/object/library-files/${n}`,{headers:{apikey:K,Authorization:'Bearer '+K}});
              if(!r.ok) throw new Error('download '+n+' '+r.status);
              const b=Buffer.from(await r.arrayBuffer()); fs.writeFileSync('backup/'+n,b); bytes+=b.length;
            }
            console.log('backed up',base,names.length);
            for(let i=0;i<names.length;i+=100){
              await j(await fetch(`${U}/storage/v1/object/library-files`,{method:'DELETE',headers:H,body:JSON.stringify({prefixes:names.slice(i,i+100)})}));
            }
            total+=names.length;
            const left=await j(await fetch(`${U}/storage/v1/object/list/library-files`,{method:'POST',headers:H,body:JSON.stringify({prefix:base+'/',limit:10})}));
            console.log('deleted',base,'remaining:',left.filter(o=>o.id).length);
          }
          // ٤) حذف السجلّات حتى لا تشير المنصّة إلى صفحات غير موجودة
          await j(await fetch(`${U}/rest/v1/book_sources?grade=eq.${GRADE}&subject=eq.${encodeURIComponent(SUBJ)}&semester=eq.${encodeURIComponent(SEM)}`,{method:'DELETE',headers:{...H,Prefer:'return=minimal'}}));
          await j(await fetch(`${U}/rest/v1/teacher_guides?grade=eq.${GRADE}&subject=eq.${encodeURIComponent(SUBJ)}&semester=eq.${encodeURIComponent(SEM)}`,{method:'DELETE',headers:{...H,Prefer:'return=minimal'}}));
          console.log('DONE files',total,'MB',(bytes/1048576).toFixed(1));
          JS
          node /tmp/c.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-g3-digital
          path: backup
          retention-days: 90
