name: zzz probe teacher_guide g7 math
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          q="select status, page_count, jsonb_array_length(coalesce(toc,'[]'::jsonb)) as toc_entries, (select count(*) from jsonb_array_elements(coalesce(toc,'[]'::jsonb)) e where e->>'matched_curriculum_id' is not null) as matched, (select count(*) from jsonb_array_elements(coalesce(toc,'[]'::jsonb)) e where e->>'confidence'='low') as low, (select count(*) from jsonb_array_elements(coalesce(toc,'[]'::jsonb)) e where e->>'confidence'='medium') as medium, (select count(*) from jsonb_array_elements(coalesce(toc,'[]'::jsonb)) e where e->>'confidence'='high') as high from public.teacher_guides where grade=7 and subject='الرياضيات' and semester='الفصل الأول';"
          body=$(jq -Rs '{query: .}' <<< "$q")
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-binary "$body" | jq .
          echo "── آخر ٥ بنود فهرس مطابَقة/غير مطابَقة ──"
          q2="select e->>'guide_unit' as u, e->>'guide_lesson' as l, e->>'confidence' as c, e->>'matched_curriculum_id' as m from public.teacher_guides tg, jsonb_array_elements(tg.toc) e where tg.grade=7 and tg.subject='الرياضيات' and tg.semester='الفصل الأول' order by (e->>'guide_page')::int nulls last;"
          body2=$(jq -Rs '{query: .}' <<< "$q2")
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-binary "$body2" | jq .
