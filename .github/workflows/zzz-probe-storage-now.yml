name: zzz probe storage now
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "حجم كل bucket الآن" "select bucket_id, pg_size_pretty(sum((metadata->>'size')::bigint)) as sz, count(*) as files from storage.objects group by bucket_id order by sum((metadata->>'size')::bigint) desc;"

          run "إجمالي Storage" "select pg_size_pretty(sum((metadata->>'size')::bigint)) from storage.objects;"

          run "حجم قاعدة البيانات الآن" "select pg_size_pretty(pg_database_size(current_database()));"

          run "المساحة الحرة المتبقية حتى حد 1GB storage" "select pg_size_pretty(1073741824 - sum((metadata->>'size')::bigint)) as free_until_1gb from storage.objects;"
