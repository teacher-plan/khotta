# مؤقّت: إنشاء حساب تجريبي واختبار المناهج الستّة (الدروس، صفحات الكتاب والدليل، وتوليد تحضير فعلي). يُحذف بعد التشغيل.
name: zzz test curricula
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -euo pipefail
          KEYS=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys")
          export SK=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role") | .api_key'); echo "::add-mask::$SK"
          export AK=$(echo "$KEYS" | jq -r '.[] | select(.name=="anon") | .api_key')
          cat > /tmp/t.mjs <<'JS'
          const U=`https://${process.env.REF}.supabase.co`,K=process.env.SK,A=process.env.AK;
          const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
          const j=async r=>{const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t.slice(0,300));return t?JSON.parse(t):null};
          const SEM='الفصل الأول', E=encodeURIComponent;
          const SUBJ=[[8,'العلوم'],[7,'التربية الإسلامية'],[7,'اللغة العربية'],[8,'التربية الإسلامية'],[5,'التربية الإسلامية'],[9,'الرياضيات']];
          // ١) الحساب التجريبي
          const EMAIL='curricula.test@khotati.com', PASS='Test@2026khotta';
          const list=await j(await fetch(`${U}/auth/v1/admin/users?per_page=1000`,{headers:H}));
          let uid=(list.users||[]).find(u=>u.email===EMAIL)?.id;
          if(!uid) uid=(await j(await fetch(`${U}/auth/v1/admin/users`,{method:'POST',headers:H,body:JSON.stringify({email:EMAIL,password:PASS,email_confirm:true,user_metadata:{full_name:'حساب اختبار المناهج'}})}))).id;
          await fetch(`${U}/rest/v1/allowed_emails?email=eq.${E(EMAIL)}`,{method:'DELETE',headers:H});
          await j(await fetch(`${U}/rest/v1/allowed_emails`,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({email:EMAIL,cycle:'main',expires_at:new Date(Date.now()+30*864e5).toISOString()})}));
          console.log('ACCOUNT',EMAIL,uid);
          const tok=(await j(await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:A,'Content-Type':'application/json'},body:JSON.stringify({email:EMAIL,password:PASS})}))).access_token;
          const pub=(b,s)=>`${U}/storage/v1/object/public/library-files/${b}/p${s}.jpg`;
          const ok=async u=>(await fetch(u,{method:'HEAD'})).status===200;
          for(const [g,s] of SUBJ){
            const cur=(await j(await fetch(`${U}/rest/v1/curriculum?semester=eq.${E(SEM)}&grade=eq.${g}&subject=eq.${E(s)}&select=id,unit,lesson,sort,page&order=sort`,{headers:H})));
            const [bs]=await j(await fetch(`${U}/rest/v1/book_sources?semester=eq.${E(SEM)}&grade=eq.${g}&subject=eq.${E(s)}`,{headers:H}));
            const [tg]=await j(await fetch(`${U}/rest/v1/teacher_guides?semester=eq.${E(SEM)}&grade=eq.${g}&subject=eq.${E(s)}`,{headers:H}));
            let bookOk=0,bookBad=[],guideOk=0,guideBad=[];
            const toc=(tg?.toc||[]).filter(x=>x.guide_page).sort((a,b)=>a.guide_page-b.guide_page);
            for(let i=0;i<cur.length;i++){
              const c=cur[i];let st=+c.page,en=bs.page_count;
              for(let k=i+1;k<cur.length;k++){if(+cur[k].page>st){en=+cur[k].page-1;break}}
              const sh=st+(bs.offset_pages||1)-1;
              if(await ok(pub(bs.base_path,sh)) && await ok(pub(bs.base_path,Math.min(en+(bs.offset_pages||1)-1,bs.page_count)))) bookOk++; else bookBad.push(c.lesson);
              const e=toc.find(x=>x.matched_curriculum_id===c.id);
              if(e && await ok(pub(tg.base_path,e.guide_page+(tg.offset_pages||1)-1))) guideOk++; else guideBad.push(c.lesson);
            }
            console.log(`\n### ${s} ${g}: lessons=${cur.length} | book pages ok ${bookOk}/${cur.length} | guide linked ok ${guideOk}/${cur.length} | guide status=${tg?.status} pages=${tg?.page_count}`);
            if(bookBad.length)console.log('  book missing:',bookBad.join('، '));
            if(guideBad.length)console.log('  guide missing:',guideBad.join('، '));
            // توليد تحضير فعلي للدرس الثاني من كتاب الطالب (كما يفعل المعلّم)
            const c=cur[1]||cur[0];let st=+c.page,en=bs.page_count;const i=cur.indexOf(c);
            for(let k=i+1;k<cur.length;k++){if(+cur[k].page>st){en=+cur[k].page-1;break}}
            const images=[];for(let bp=st;bp<=en&&images.length<12;bp++)images.push(pub(bs.base_path,bp+(bs.offset_pages||1)-1));
            const t0=Date.now();
            const r=await fetch(`${U}/functions/v1/generate-lesson-plan`,{method:'POST',headers:{apikey:A,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({grade:String(g),subject:s,unit:c.unit,lesson:c.lesson,images})});
            const body=await r.text();let plan=null;try{plan=JSON.parse(body).plan}catch(e){}
            console.log(`  PREP «${c.lesson}» (${images.length} pages): http ${r.status} in ${Math.round((Date.now()-t0)/1000)}s`);
            if(plan){const p=typeof plan==='string'?plan:JSON.stringify(plan);console.log('  PLAN keys:',Object.keys(typeof plan==='object'?plan:{}).join(','));console.log('  PLAN sample:',p.slice(0,700).replace(/\s+/g,' '));}
            else console.log('  BODY:',body.slice(0,400));
          }
          JS
          node /tmp/t.mjs
