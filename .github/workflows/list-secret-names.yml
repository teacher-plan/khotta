name: List secret names
on: workflow_dispatch
jobs:
  l:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with: { version: 3.2.0 }
      - run: supabase secrets list --project-ref mkdsnnfkkdwdkywnwnjh | awk -F'|' '{print $1}' | grep -i "r2\|NAME"
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
