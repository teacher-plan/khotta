name: zzz probe health
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ body=$(jq -Rs '{query: .}' <<< "$2"); echo "=== $1"; curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?' | head -40; }
          run size "select pg_size_pretty(pg_database_size(current_database())) db"
          run tables "select schemaname||'.'||relname t, pg_size_pretty(pg_total_relation_size(relid)) sz, n_live_tup live, n_dead_tup dead from pg_stat_user_tables order by pg_total_relation_size(relid) desc limit 10"
          run storage "select bucket_id, count(*) n, pg_size_pretty(sum((metadata->>'size')::bigint)) sz from storage.objects group by 1 order by sum((metadata->>'size')::bigint) desc nulls last"
          run conns "select state, count(*) from pg_stat_activity group by 1"
          run cron "select j.jobname, count(*) filter (where d.status='failed') failed, count(*) runs, max(d.start_time) last from cron.job_run_details d join cron.job j using(jobid) where d.start_time>now()-interval '24 hours' group by 1 order by failed desc"
          run cron_fail_msg "select j.jobname, d.return_message, d.start_time from cron.job_run_details d join cron.job j using(jobid) where d.status='failed' and d.start_time>now()-interval '24 hours' order by d.start_time desc limit 5"
          run users "select count(*) total, count(*) filter (where last_sign_in_at>now()-interval '7 days') active7 from auth.users"
          run http_resp "select pg_size_pretty(pg_total_relation_size('net._http_response')) sz, count(*) from net._http_response"
          run ai_errors "select count(*) from public.ai_usage where created_at>now()-interval '24 hours'"
          run long_q "select pid, now()-query_start dur, left(query,80) q from pg_stat_activity where state='active' and now()-query_start>interval '30 seconds'"
          run cache "select round(100*sum(heap_blks_hit)/nullif(sum(heap_blks_hit)+sum(heap_blks_read),0),2) hit_pct from pg_statio_user_tables"
          run games "select template, count(*) from public.games group by 1 order by 2 desc"
