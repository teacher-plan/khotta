name: zzz add ai game themes
on:
  workflow_dispatch: {}
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الصور ورفعها وإدراج الثيمات
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -euo pipefail

          echo "── جلب مفتاح service_role ──"
          KEYS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys")
          SERVICE_KEY=$(echo "$KEYS_JSON" | jq -r '.[] | select(.name=="service_role") | .api_key')
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "::error::تعذّر جلب مفتاح service_role"; exit 1
          fi

          upload_and_insert() {
            local src_url="$1" dest_name="$2" theme_name="$3" emoji="$4"
            echo "── $theme_name ──"
            curl -sL -o "/tmp/${dest_name}" "$src_url"
            SIZE=$(stat -c%s "/tmp/${dest_name}")
            echo "حجم الصورة: $SIZE bytes"
            code=$(curl -s -o /tmp/upload_resp.json -w '%{http_code}' \
              -X POST "https://$REF.supabase.co/storage/v1/object/library-files/game-themes/${dest_name}" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Content-Type: image/jpeg" \
              -H "x-upsert: true" \
              --data-binary "@/tmp/${dest_name}")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::فشل رفع $dest_name ($code)"; cat /tmp/upload_resp.json; exit 1
            fi
            BG_URL="https://$REF.supabase.co/storage/v1/object/public/library-files/game-themes/${dest_name}"
            echo "✅ رُفعت: $BG_URL"

            SQL="insert into game_themes (name, emoji, bg_url) values ('${theme_name}', '${emoji}', '${BG_URL}');"
            resp=$(curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary "$(jq -Rs '{query: .}' <<< "$SQL")")
            echo "$resp"
          }

          upload_and_insert \
            "https://media.viewmax.io/users/dw3wS0aXsr52F4Q5CAkHh7K7fEzFUzGu/generated/0247f2da-21b5-4411-b0ea-faacb5330b05.jpg" \
            "$(date +%s)_tech.jpg" \
            "تقنية المعلومات 💻" "💻"

          upload_and_insert \
            "https://media.viewmax.io/users/dw3wS0aXsr52F4Q5CAkHh7K7fEzFUzGu/generated/b84c3a22-ca70-4050-8ca6-8f6a64a9e916.jpg" \
            "$(date +%s)_math.jpg" \
            "عالم الأرقام والأشكال 🔢" "🔢"

          upload_and_insert \
            "https://media.viewmax.io/users/dw3wS0aXsr52F4Q5CAkHh7K7fEzFUzGu/generated/25d21176-e414-4af3-b904-921519e696ce.jpg" \
            "$(date +%s)_identity.jpg" \
            "قلعتنا وهويتنا 🏰" "🏰"

          echo "════════ التحقّق ════════"
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-binary "$(jq -Rs '{query: .}' <<< "select id,name,emoji,bg_url from game_themes order by created_at desc limit 3;")" | python3 -m json.tool
