# مؤقّت: نقل الحساب التجريبي (أ. خلفان المصلحي) إلى cycle1.html — ملف cycle1_profiles بالتربية الإسلامية للصف التاسع، الشعبتان التاسع/١ والتاسع/٢، وعرض «سورة الإسراء ١٠٥–١١١» مرفقٌ في بطاقة الدرس. يُحذف بعد التشغيل.
name: zzz cycle1 demo teacher
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: create
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -euo pipefail
          export SK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SK"
          cat > /tmp/c.mjs <<'JS'
          const U=`https://${process.env.REF}.supabase.co`, K=process.env.SK;
          const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
          const j=async(r)=>{const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t);return t?JSON.parse(t):null;};
          const EMAIL='khalfan.demo@khotati.com', NAME='أ. خلفان المصلحي', SUBJ='التربية الإسلامية', SEM='الفصل الأول', G=9;
          const list=await j(await fetch(`${U}/auth/v1/admin/users?per_page=1000`,{headers:H}));
          const uid=(list.users||[]).find(u=>u.email===EMAIL)?.id; if(!uid)throw new Error('no user');
          // ملف التطبيق الرئيسي أُنشئ خطأً: يُحذف
          await j(await fetch(`${U}/rest/v1/profiles?id=eq.${uid}`,{method:'DELETE',headers:{...H,Prefer:'return=minimal'}}));
          const rows=await j(await fetch(`${U}/rest/v1/curriculum?select=*&semester=eq.${encodeURIComponent(SEM)}&subject=eq.${encodeURIComponent(SUBJ)}&grade=eq.${G}&order=sort`,{headers:H}));
          const sid=(a,b,c,d,e)=>{const raw=`${a}|${b}|${c}|${d}|${e}`;let h=5381;for(let i=0;i<raw.length;i++){h=((h<<5)+h+raw.charCodeAt(i))>>>0;}return 'L'+h.toString(36);};
          const units=[],m={};
          rows.slice().sort((a,b)=>(a.sort||0)-(b.sort||0)).forEach(r=>{if(!m[r.unit]){m[r.unit]=[];units.push({name:r.unit,lessons:m[r.unit]});}m[r.unit].push({id:sid(SEM,SUBJ,r.grade,r.unit,r.lesson),name:r.lesson});});
          const isra=rows.find(r=>/الإسراء/.test(r.lesson)); const lid=sid(SEM,SUBJ,isra.grade,isra.unit,isra.lesson);
          const pub=`${U}/storage/v1/object/public/library-files/presentations/islamic/g9/isra-105-111.html.txt`;
          const size=(await (await fetch(pub)).arrayBuffer()).byteLength;
          const classes=[1,2].map((n,k)=>({id:`c1g${G}s${n}`,name:'التاسع/'+'١٢'[k],num:n,color:['#D86048','#487848'][k],subjects:[SUBJ],students:[]}));
          const now=new Date().toISOString();
          const data={display_name:NAME,phone:'',semester:SEM,grades:[{num:G,classes}],setupDone:true,ach_profile:{school:''},teacher_gender:'m',
            plan_units:{[`${G}|${SUBJ}`]:units},
            plan_state:{[lid]:{done:false,classes:{},files:[{name:'سورة الإسراء (١٠٥–١١١) — العرض التفاعلي.html',type:'text/html',size,viewLink:pub,previewLink:pub,html:true}]}},
            updated_at:now};
          await j(await fetch(`${U}/rest/v1/cycle1_profiles?on_conflict=id`,{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:uid,email:EMAIL,data,updated_at:now})}));
          console.log('DONE',uid,lid,size,rows.length);
          JS
          node /tmp/c.mjs
