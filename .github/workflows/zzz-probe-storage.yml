name: zzz probe storage
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$(jq -Rs '{query: .}' <<< "$1")" | jq -c '.[]?'; echo; }
          echo "== storage total =="
          q "select round(sum((metadata->>'size')::bigint)/1048576.0,1) mb, count(*) files from storage.objects;"
          echo "== by bucket =="
          q "select bucket_id, round(sum((metadata->>'size')::bigint)/1048576.0,1) mb, count(*) n from storage.objects group by 1 order by 2 desc;"
          echo "== library-files top folders =="
          q "select split_part(name,'/',1) top, round(sum((metadata->>'size')::bigint)/1048576.0,1) mb, count(*) n from storage.objects where bucket_id='library-files' group by 1 order by 2 desc limit 15;"
          echo "== avg page size books/guides =="
          q "select split_part(name,'/',1) top, round(avg((metadata->>'size')::bigint)/1024.0) kb_avg from storage.objects where bucket_id='library-files' and split_part(name,'/',1) in ('books','teacher-guides') group by 1;"
          echo "== g9 islamic existing =="
          q "select 'book' k, grade::text, subject, semester, page_count from public.book_sources where grade='9' union all select 'guide', grade::text, subject, semester, page_count from public.teacher_guides where grade=9;"
          q "select subject, semester, count(*) from public.curriculum where grade=9 group by 1,2;"
          echo "== db size =="
          q "select pg_size_pretty(pg_database_size(current_database())) db;"
