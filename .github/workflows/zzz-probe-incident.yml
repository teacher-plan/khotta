name: zzz probe incident
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          api() { echo "── $1"; curl -s -m 30 "https://api.supabase.com/v1/projects/$REF$1" -H "Authorization: Bearer $TOKEN" | jq -c "$2" 2>/dev/null || true; }
          echo "── المشروع"; curl -s -m 30 "https://api.supabase.com/v1/projects/$REF" -H "Authorization: Bearer $TOKEN" | jq -c '{status,name,region}'
          api "/config/storage" '.'
          api "/health?services=auth&services=db&services=rest&services=storage&services=realtime" '[.[]|{name,healthy,status}]'
          echo "── مرفوض بالتخزين (رسائل ٦ ساعات)"; sql="select count(*) from storage.objects where created_at>now()-interval '24 hours'"; body=$(jq -Rs '{query: .}' <<< "$sql"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c .
          sql="select name, created_at, (metadata->>'size')::bigint as size from storage.objects order by created_at desc limit 5"; body=$(jq -Rs '{query: .}' <<< "$sql"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'
