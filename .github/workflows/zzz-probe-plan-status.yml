name: zzz probe plan status
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          echo "════ حالة المشروع ════"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF" | jq .

          echo "════ اختبار وصول DB (هل ما زال يعمل) ════"
          body=$(jq -Rs '{query: .}' <<< "select now(), version();")
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq .
