name: zzz probe cleanup prep
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "أعمدة الوقت في جداول المراقبة" "select table_name, string_agg(column_name,',') from information_schema.columns where table_schema='public' and table_name in ('health_checks','agent_runs','scheduler_runs','agent_logs','agent_messages','performance_metrics','db_capacity_history','error_logs','emergency_alerts','user_analytics','analytics_insights') and (data_type like 'timestamp%') group by table_name order by table_name;"

          run "الحسابات المنتهية (cycle1)" "select email, expires_at::date from allowed_emails where cycle='cycle1' and expires_at is not null and expires_at<now() order by expires_at;"

          run "التسجيلات المسبقة غير المُرحَّب بها" "select id, name, phone, created_at::date from pre_registrations where welcomed_at is null order by created_at;"

          run "أعمدة pre_registrations" "select column_name from information_schema.columns where table_name='pre_registrations' order by ordinal_position;"
