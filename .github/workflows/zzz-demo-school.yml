# مؤقّت: مدرسة تجريبية للعرض على الإدارة — حساب إدارة + ٣ معلّمين تجريبيين ببيانات غياب وسلوك واختبار. لا يمسّ حسابات المعلّمين الحقيقيين. يُحذف بعد التشغيل.
name: zzz demo school
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: seed
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -euo pipefail
          export SK=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SK"
          cat > /tmp/c.mjs <<'JS'
          const U=`https://${process.env.REF}.supabase.co`, K=process.env.SK;
          const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
          const j=async(r)=>{const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t);return t?JSON.parse(t):null;};
          const list=await j(await fetch(`${U}/auth/v1/admin/users?per_page=1000`,{headers:H}));
          async function user(email,pass,name,cycle){
            let id=(list.users||[]).find(u=>u.email===email)?.id;
            if(!id)id=(await j(await fetch(`${U}/auth/v1/admin/users`,{method:'POST',headers:H,body:JSON.stringify({email,password:pass,email_confirm:true,user_metadata:{full_name:name}})}))).id;
            await fetch(`${U}/rest/v1/allowed_emails?email=eq.${email}`,{method:'DELETE',headers:H});
            await j(await fetch(`${U}/rest/v1/allowed_emails`,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({email,cycle,expires_at:new Date(Date.now()+150*864e5).toISOString()})}));
            return id;
          }
          // ١) المدرسة وحساب إدارتها
          const ADM='idara.demo@khotati.com';
          await user(ADM,'Idara@2026','إدارة المدرسة التجريبية','school');
          let [sc]=await j(await fetch(`${U}/rest/v1/c1_schools?admin_email=eq.${ADM}&select=*`,{headers:H}));
          if(!sc){[sc]=await j(await fetch(`${U}/rest/v1/c1_schools`,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({name:'المدرسة التجريبية — منصّة خُطّة',code:'DEMO26',admin_email:ADM})}));}
          console.log('school',sc.id,sc.code);
          // ٢) بياناتٌ مولَّدة بحتمية (بذرة ثابتة)
          let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
          const F=['أحمد','محمد','خالد','سالم','يوسف','علي','ناصر','هاشم','مازن','فهد','سعيد','حمد','راشد','سيف','عبدالله','مالك','زياد','بدر','هلال','سلطان','أنس','عمر','حمود','ماجد','طلال'];
          const L=['الحارثي','البلوشي','الهنائي','الكندي','الريامي','الشكيلي','العامري','المعمري','السيابي','الرواحي','الحبسي','الغافري','البوسعيدي','الوهيبي','الجابري'];
          const roster=(n)=>{const s=new Set();while(s.size<n)s.add(F[Math.floor(R()*F.length)]+' '+F[Math.floor(R()*F.length)]+' '+L[Math.floor(R()*L.length)]);return [...s];};
          const days=[];for(let i=0;i<40&&days.length<22;i++){const d=new Date(Date.now()-i*864e5);const w=d.getDay();if(w===5||w===6)continue;days.push(d.toISOString().slice(0,10));}
          const VT=['إزعاج داخل الصف','تأخر عن الحصة','عدم إحضار الكتاب','عدم حل الواجب','استخدام الهاتف','شجار مع زميل'];
          function makeClass(id,name,students,periods){
            const abs={},beh=students.map(()=>[]);
            const chronic=students[2],truant=students[5],sick=students[9];
            days.forEach((d,di)=>{
              const q=[];students.forEach(s=>{if(s===chronic?R()<0.35:s===sick?(di>=3&&di<=5):R()<0.04)q.push(s);});
              const day={q};
              periods.forEach(p=>{const a=q.slice();if(p>=4&&R()<0.4&&!a.includes(truant))a.push(truant);if(R()<0.03)a.push(students[Math.floor(R()*students.length)]);day[String(p)]=[...new Set(a)];});
              if(di===0&&periods.length>2)delete day[String(periods[periods.length-1])]; // حصة اليوم الأخيرة لم تُسجَّل بعد
              abs[d]=day;
            });
            students.forEach((s,i)=>{const nv=s===truant?5:i===7?4:R()<0.3?1:0;for(let k=0;k<nv;k++)beh[i].push({kind:'viol',type:VT[Math.floor(R()*VT.length)],date:new Date(Date.parse(days[Math.floor(R()*days.length)])+9*3600e3).toISOString()});
              const ns=Math.floor(R()*5);for(let k=0;k<ns;k++)beh[i].push({kind:'star',date:new Date(Date.parse(days[Math.floor(R()*days.length)])+10*3600e3).toISOString()});});
            return{cls:{id,name,num:+name.slice(-1)||1,color:'#487848',students},abs,beh};
          }
          const T=[
            {email:'demo.t1@khotati.com',name:'أحمد البلوشي (تجريبي)',subj:'اللغة العربية',g:9,cl:[['d1g9s1','التاسع/١',[1,2,3]],['d1g9s2','التاسع/٢',[4,5,6]]]},
            {email:'demo.t2@khotati.com',name:'سالم الكندي (تجريبي)',subj:'التربية الإسلامية',g:9,cl:[['d2g9s1','التاسع/١',[5,6]],['d2g9s2','التاسع/٢',[1,2]]]},
            {email:'demo.t3@khotati.com',name:'خالد الهنائي (تجريبي)',subj:'التربية الإسلامية',g:6,cl:[['d3g6s1','السادس/١',[1,2,3,4]]]},
          ];
          const rosters={'التاسع/١':roster(24),'التاسع/٢':roster(22),'السادس/١':roster(20)};
          for(const t of T){
            const id=await user(t.email,'Demo@2026',t.name,'cycle1');
            const classes=[],absence={},beh_log={},stars={};
            for(const [cid,cn,per] of t.cl){const m=makeClass(cid,cn,rosters[cn],per);m.cls.subjects=[t.subj];classes.push(m.cls);absence[cid]=m.abs;beh_log[cid]=m.beh;stars[cid]=m.beh.map(a=>a.filter(e=>e.kind==='star').length);}
            const now=new Date().toISOString();
            const data={display_name:t.name,phone:'',semester:'الفصل الأول',grades:[{num:t.g,classes}],setupDone:true,ach_profile:{school:sc.name},teacher_gender:'m',plan_units:{},plan_state:{},absence,beh_log,stars,updated_at:now};
            await j(await fetch(`${U}/rest/v1/cycle1_profiles?on_conflict=id`,{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id,email:t.email,data,updated_at:now})}));
            await j(await fetch(`${U}/rest/v1/c1_school_members?on_conflict=teacher_id`,{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({teacher_id:id,school_id:sc.id})}));
            console.log('teacher',t.email,classes.map(c=>c.name+':'+c.students.length).join(' '));
          }
          console.log('DONE');
          JS
          node /tmp/c.mjs
