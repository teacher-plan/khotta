name: zzz probe book pipeline
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: فحص تقطيع الكتاب ومطابقة الدليل
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -uo pipefail
          raw() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary "$(jq -Rs '{query: .}' <<< "$1")"
          }

          echo "════ ١) تناسق ترقيم صفحات الكتاب: هل الصفحات تتزايد مع ترتيب الدروس؟ ════"
          raw "
          with ordered as (
            select grade, subject, semester, book_no, sort, page, lesson,
                   lag(page) over (partition by grade,subject,semester,book_no order by sort) as prev_page
            from curriculum where page is not null
          )
          select grade, subject, semester, book_no, count(*) as violations
          from ordered where page < prev_page
          group by grade, subject, semester, book_no order by violations desc limit 15;" \
            | jq -r 'if length==0 then "✅ لا انتهاكات — الصفحات تتزايد دائماً مع ترتيب الدروس" else .[] | "⚠️ ص\(.grade) | \(.subject) | \(.semester) | كتاب\(.book_no) | \(.violations) مخالفة" end'

          echo
          echo "════ ٢) دروسٌ متعددة بنفس رقم الصفحة (اشتباه تكرار/خطأ استخراج) ════"
          raw "
          select grade, subject, semester, book_no, page, count(*) as cnt, string_agg(lesson,' + ') as lessons
          from curriculum where page is not null
          group by grade, subject, semester, book_no, page
          having count(*) > 1
          order by cnt desc limit 15;" \
            | jq -r 'if length==0 then "✅ لا تكرار — كل درسٍ له رقم صفحةٍ مستقل" else .[] | "⚠️ ص\(.grade) | \(.subject) | كتاب\(.book_no) | صفحة \(.page) لـ\(.cnt) دروس: \(.lessons)" end'

          echo
          echo "════ ٣) صفحاتٌ تتجاوز عدد صفحات الكتاب المرفوع (مستحيلة) ════"
          raw "
          select c.grade, c.subject, c.semester, c.book_no, c.lesson, c.page, bs.page_count
          from curriculum c join book_sources bs
            on bs.grade=c.grade::text and bs.subject=c.subject and bs.semester=c.semester and bs.book_no=c.book_no
          where c.page is not null and c.page > (bs.page_count + coalesce(bs.offset_pages,1) + 5)
          order by (c.page - bs.page_count) desc limit 15;" \
            | jq -r 'if length==0 then "✅ لا صفحة تتجاوز حدود الكتاب المرفوع" else .[] | "⚠️ ص\(.grade) | \(.subject) | \(.lesson) | صفحة \(.page) لكن الكتاب فيه \(.page_count) فقط" end'

          echo
          echo "════ ٤) حالة أدلة المعلم (teacher_guides) ════"
          raw "select status, count(*) as cnt from teacher_guides group by status order by cnt desc;" \
            | jq -r 'if length==0 then "لا أدلة مرفوعة إطلاقاً" else .[] | "\(.status): \(.cnt)" end'

          echo
          echo "════ ٥) لكل دليلٍ: كم درساً طابقه فعلياً من أصل دروس المادة؟ ════"
          raw "
          with guide_matches as (
            select id, grade, subject, semester, status,
                   (select count(distinct (e->>'matched_curriculum_id')) from jsonb_array_elements(coalesce(toc,'[]'::jsonb)) e where e->>'matched_curriculum_id' is not null and e->>'matched_curriculum_id' <> 'null') as matched
            from teacher_guides
          ),
          lesson_counts as (
            select grade, subject, semester, count(*) as total
            from curriculum group by grade, subject, semester
          )
          select g.grade, g.subject, g.semester, g.status, g.matched, coalesce(l.total,0) as total_lessons
          from guide_matches g left join lesson_counts l
            on l.grade=g.grade and l.subject=g.subject and l.semester=g.semester
          order by g.grade, g.subject;" \
            | jq -r '.[] | "ص\(.grade) | \(.subject) | \(.semester) | \(.status) | طابق \(.matched) من \(.total_lessons)"'

          echo
          echo "════ ٦) توزيع مستوى الثقة في كل مطابقات الأدلة ════"
          raw "
          select e->>'confidence' as confidence, count(*) as cnt
          from teacher_guides, jsonb_array_elements(coalesce(toc,'[]'::jsonb)) e
          where e->>'matched_curriculum_id' is not null and e->>'matched_curriculum_id' <> 'null'
          group by confidence order by cnt desc;" \
            | jq -r 'if length==0 then "لا مطابقات مسجّلة" else .[] | "\(.confidence // "بلا تصنيف"): \(.cnt)" end'

          echo
          echo "════ ٧) دروسٌ في المنهج بلا أي دليلٍ مرفوع لمادتها/صفّها ════"
          raw "
          select c.grade, c.subject, c.semester, count(*) as lessons_without_guide
          from curriculum c
          where not exists (select 1 from teacher_guides g where g.grade=c.grade and g.subject=c.subject and g.semester=c.semester)
          group by c.grade, c.subject, c.semester order by c.grade, c.subject;" \
            | jq -r 'if length==0 then "✅ كل مادة/صف له دليلٌ مسجّل" else .[] | "ص\(.grade) | \(.subject) | \(.semester) | \(.lessons_without_guide) درساً بلا دليل" end'
