name: zzz probe billing
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          echo "════ المشروع (المؤسسة) ════"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF" | jq '{name,organization_id,created_at,status}'
          echo "════ المؤسسات ════"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/organizations" | jq -c '.[]?'
          ORG=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF" | jq -r '.organization_id')
          echo "ORG=$ORG"
          echo "════ اشتراك المؤسسة ════"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/organizations/$ORG/billing/subscription" | jq '.' 2>/dev/null | head -80
