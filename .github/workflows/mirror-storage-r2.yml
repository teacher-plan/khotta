name: Mirror storage to R2
# ينسخ ملفات Supabase Storage إلى Cloudflare R2 (يُعاد تشغيله بأمان: ينسخ الناقص فقط)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * 0'   # فحصٌ أسبوعي: أي ملفٍ في Supabase ناقصٍ في R2 يُنسخ
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 3.2.0 }
      - name: Mirror
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          SVC=$(supabase projects api-keys --project-ref mkdsnnfkkdwdkywnwnjh -o json | jq -r '.[]|select(.name=="service_role")|.api_key')
          echo "::add-mask::$SVC"
          pip install -q requests
          SVC="$SVC" python3 tools/storage/mirror_r2.py
