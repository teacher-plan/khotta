          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$(jq -Rs '{query: .}' /tmp/q.sql)" | jq -c .
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$(jq -Rs '{query: .}' <<< "select distinct subject from public.curriculum where grade between 5 and 12 and subject like '%إسلام%' or subject like '%دين%';")" | jq -c .
