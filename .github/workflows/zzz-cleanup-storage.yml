name: zzz cleanup storage (one-off)
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: cleanup
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        shell: python
        run: |
          import os,json,base64,re,urllib.request,urllib.parse
          REF=os.environ['REF'];TOKEN=os.environ['TOKEN'];BASE=f'https://{REF}.supabase.co'
          def req(url,method='GET',data=None,headers={}):
              r=urllib.request.Request(url,method=method,data=data,headers=headers)
              with urllib.request.urlopen(r,timeout=120) as f: return f.read()
          def sql(q):
              return json.loads(req(f'https://api.supabase.com/v1/projects/{REF}/database/query','POST',json.dumps({'query':q}).encode(),{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'}))
          keys=json.loads(req(f'https://api.supabase.com/v1/projects/{REF}/api-keys',headers={'Authorization':'Bearer '+TOKEN}))
          SK=[k['api_key'] for k in keys if k['name']=='service_role'][0]
          H={'Authorization':'Bearer '+SK,'apikey':SK}
          def upload(path,b64):
              m=re.match(r'data:(image/[\w+.-]+);base64,(.*)',b64,re.S)
              if not m: return None
              ct=m.group(1);raw=base64.b64decode(m.group(2));ext={'image/jpeg':'jpg'}.get(ct,ct.split('/')[1])
              path=f'{path}.{ext}'
              req(f'{BASE}/storage/v1/object/user-files/{path}','POST',raw,{**H,'Content-Type':ct,'x-upsert':'true','cache-control':'max-age=31536000'})
              return f'{BASE}/storage/v1/object/public/user-files/{path}',len(raw)
          print('== infographics: shared_preps')
          for r in sql("select lesson_id, created_by, info_b64 from public.shared_preps where info_b64 like 'data:image%'"):
              u=upload(f"{r['created_by'] or 'shared'}/infographics/shared-{re.sub(r'[^\w-]','_',str(r['lesson_id']))}",r['info_b64'])
              if not u: continue
              req(f"{BASE}/rest/v1/shared_preps?lesson_id=eq.{urllib.parse.quote(str(r['lesson_id']))}",'PATCH',json.dumps({'info_b64':u[0]}).encode(),{**H,'Content-Type':'application/json','Prefer':'return=minimal'})
              print('  moved',r['lesson_id'],u[1]//1024,'KB')
          print('== infographics: user_preps')
          for r in sql("select user_id, lesson_id, data->>'infoRaw' info from public.user_preps where data->>'infoRaw' like 'data:image%'"):
              u=upload(f"{r['user_id']}/infographics/{re.sub(r'[^\w-]','_',str(r['lesson_id']))}",r['info'])
              if not u: continue
              q="update public.user_preps set data=jsonb_set(data,'{infoRaw}',to_jsonb('%s'::text)) where user_id='%s' and lesson_id='%s'"%(u[0],r['user_id'],str(r['lesson_id']).replace("'","''"))
              sql(q);print('  moved',r['lesson_id'],u[1]//1024,'KB')
          print('== delete root PDFs uploaded 2026-06-21 (unreferenced only)')
          REFS="with refs as (select to_jsonb(t)::text s from public.library_files t union all select to_jsonb(t)::text from public.c1_library_items t union all select to_jsonb(t)::text from public.library_items t union all select to_jsonb(t)::text from public.user_files t union all select to_jsonb(t)::text from public.c1_lesson_assets t union all select to_jsonb(t)::text from public.c1_shared_assets t union all select to_jsonb(t)::text from public.library_links t union all select to_jsonb(t)::text from public.app_settings t union all select to_jsonb(t)::text from public.ai_settings t union all select data::text from public.cycle1_profiles t union all select data::text from public.profiles t)"
          rows=sql(REFS+" select name,(metadata->>'size')::bigint b from storage.objects o where bucket_id='library-files' and position('/' in name)=0 and created_at::date='2026-06-21' and not exists(select 1 from refs where s like '%'||o.name||'%')")
          names=[r['name'] for r in rows];tot=sum(int(r['b'] or 0) for r in rows)
          print('  files:',len(names),'size MB:',round(tot/1048576,1))
          for i in range(0,len(names),50):
              req(f'{BASE}/storage/v1/object/library-files','DELETE',json.dumps({'prefixes':names[i:i+50]}).encode(),{**H,'Content-Type':'application/json'})
          print('  deleted')
          for q in ["vacuum full public.shared_preps","vacuum full public.user_preps"]:
              try: sql(q);print('  ',q,'ok')
              except Exception as e: print('  ',q,'failed',e)
          print(sql("select pg_size_pretty(pg_total_relation_size('public.shared_preps')) shared, pg_size_pretty(pg_total_relation_size('public.user_preps')) userp, pg_size_pretty(pg_database_size(current_database())) db"))
          print(sql("select bucket_id, pg_size_pretty(sum((metadata->>'size')::bigint)) from storage.objects group by 1"))
