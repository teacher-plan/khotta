name: zzz probe delete scope
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "book_sources للحذف (حلقة٢ عدا صف٧ رياضيات)" "select grade, subject, semester, book_no, base_path from book_sources where grade::int between 5 and 12 and not (grade='7' and subject='الرياضيات') order by grade,subject;"

          run "teacher_guides للحذف" "select grade, subject, semester, base_path from teacher_guides where grade between 5 and 12 and not (grade=7 and subject='الرياضيات') order by grade,subject;"

          run "curriculum صفوف للحذف (عدد)" "select grade, subject, semester, count(*) from curriculum where grade between 5 and 12 and not (grade=7 and subject='الرياضيات') group by grade,subject,semester order by grade,subject;"

          run "قيود FK على curriculum_id" "select tc.table_name, kcu.column_name from information_schema.table_constraints tc join information_schema.key_column_usage kcu on tc.constraint_name=kcu.constraint_name where tc.constraint_type='FOREIGN KEY' and kcu.column_name like '%curriculum%';"

          run "lesson_prep_generations مرتبط بحلقة٢ (عدا صف٧)" "select count(*) from lesson_prep_generations where grade between 5 and 12 and not (grade=7 and subject='الرياضيات');"

          run "games/c1_shared_assets مرتبطة بحلقة٢" "select 'games' t, count(*) from games where grade between 5 and 12 and not (grade=7 and subject='الرياضيات');"

          run "تعريف مهام pg_cron (نص الأمر)" "select jobname, schedule, command from cron.job order by jobname;"
