name: zzz probe storage breakdown
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          run(){ echo "════ $1 ════"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?'; echo; }

          run "أكبر ٣٠ مجلّداً في library-files (top folder)" "select split_part(name,'/',1) top, count(*) files, pg_size_pretty(sum((metadata->>'size')::bigint)) size, sum((metadata->>'size')::bigint) bytes from storage.objects where bucket_id='library-files' group by 1 order by 3 desc limit 30;"

          run "حجم books/ لكل صفٍّ (من base_path في book_sources)" "select bs.grade, bs.subject, bs.semester, bs.book_no, pg_size_pretty(coalesce((select sum((o.metadata->>'size')::bigint) from storage.objects o where o.name like bs.base_path||'/%'),0)) size, coalesce((select sum((o.metadata->>'size')::bigint) from storage.objects o where o.name like bs.base_path||'/%'),0) bytes from book_sources bs order by bytes desc;"

          run "حجم teacher-guides/ لكل صفٍّ" "select tg.grade, tg.subject, tg.semester, pg_size_pretty(coalesce((select sum((o.metadata->>'size')::bigint) from storage.objects o where o.name like tg.base_path||'/%'),0)) size, coalesce((select sum((o.metadata->>'size')::bigint) from storage.objects o where o.name like tg.base_path||'/%'),0) bytes from teacher_guides tg order by bytes desc;"

          run "حسابات فعّالة الآن (لا منتهية)" "select email, cycle from allowed_emails where expires_at is null or expires_at>now() order by cycle, email;"

          run "دخول فعلي آخر ٣٠ يوماً" "select u.email, p.last_sign_in_at::date from auth.users u left join (select id,email,last_sign_in_at from auth.users) p on true limit 0;"
