name: zzz probe c2 users
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: فحص مستخدمي الحلقة الثانية
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          set -uo pipefail
          raw() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary "$(jq -Rs '{query: .}' <<< "$1")"
          }

          echo "════ ١) توزيع الحسابات المسموح لها على الحلقتين ════"
          raw "select cycle, count(*) as accounts from allowed_emails group by cycle order by 2 desc;" \
            | jq -r '.[] | "\(.cycle): \(.accounts) حساب"'

          echo
          echo "════ ٢) ملفات الحلقة الثانية: كم منها فيه بيانات فعلية؟ ════"
          raw "select count(*) as total_profiles,
                 count(*) filter (where data ? 'grades' and jsonb_typeof(data->'grades')='object' and data->'grades' <> '{}'::jsonb) as has_marks,
                 count(*) filter (where data ? 'plan_state' and data->'plan_state' <> '{}'::jsonb) as has_plan,
                 count(*) filter (where data ? 'arc_meta' and data->'arc_meta' <> '{}'::jsonb) as has_archive,
                 count(*) filter (where data ? 'cv_items') as has_cv,
                 count(*) filter (where data ? 'teacherConfig' or data ? 'grades_config') as has_setup
               from profiles;" \
            | jq -r '.[] | "ملفات: \(.total_profiles) | فيها درجات: \(.has_marks) | خطة: \(.has_plan) | أرشيف: \(.has_archive) | سيرة: \(.has_cv) | إعداد: \(.has_setup)"'

          echo
          echo "════ ٣) ملفات الحلقة الأولى ════"
          raw "select count(*) as cycle1_profiles from cycle1_profiles;" \
            | jq -r '.[] | "ملفات الحلقة الأولى: \(.cycle1_profiles)"'

          echo
          echo "════ ٤) آخر نشاط فعلي لملفات الحلقة الثانية ════"
          raw "select count(*) filter (where updated_at > now() - interval '30 days') as active_30d,
                      count(*) filter (where updated_at > now() - interval '90 days') as active_90d,
                      count(*) as total
               from profiles;" \
            | jq -r '.[] | "نشط ٣٠ يوماً: \(.active_30d) | ٩٠ يوماً: \(.active_90d) | الإجمالي: \(.total)"'

          echo
          echo "════ ٥) التسجيلات المسبقة حسب المرحلة ════"
          raw "select stage, count(*) as cnt from pre_registrations group by stage order by 2 desc;" \
            | jq -r 'if length==0 then "لا تسجيلات" else .[] | "\(.stage): \(.cnt)" end'
