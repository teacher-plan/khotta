# مؤقّت: تسجيل فهرس دروس اللغة العربية للصف التاسع (ف١) وربطها بدليل المعلم. يُحذف بعد التشغيل.
name: zzz ar9 segment
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تنفيذ
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          body=$(jq -Rs '{query: .}' < supabase/ar9_segment.sql)
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body")
          echo "HTTP $code"; cat /tmp/r.json; echo
          [ "$code" = "200" ] || [ "$code" = "201" ]
