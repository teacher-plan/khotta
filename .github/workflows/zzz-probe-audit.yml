name: zzz probe audit
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: queries
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mkdsnnfkkdwdkywnwnjh
        run: |
          q(){ echo "=== $1"; body=$(jq -Rs '{query: .}' <<< "$2"); curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "$body" | jq -c '.[]?' 2>/dev/null | head -${3:-60}; }
          REFS="with refs as (select to_jsonb(t)::text s from public.library_files t union all select to_jsonb(t)::text from public.c1_library_items t union all select to_jsonb(t)::text from public.library_items t union all select to_jsonb(t)::text from public.user_files t union all select to_jsonb(t)::text from public.c1_lesson_assets t union all select to_jsonb(t)::text from public.c1_shared_assets t union all select to_jsonb(t)::text from public.library_links t union all select to_jsonb(t)::text from public.app_settings t union all select to_jsonb(t)::text from public.ai_settings t union all select data::text from public.cycle1_profiles t union all select data::text from public.profiles t)"
          q rootpdf "$REFS, o as (select name, (metadata->>'size')::bigint b, created_at from storage.objects where bucket_id='library-files' and (position('/' in name)=0 or name like 'book-cache/%' or name like 'c1-preps/%' or name like 'assistant/%' or name like 'prep-notebooks/%' or name like 'c1-library/%')) select split_part(o.name,'/',1) dir, (exists(select 1 from refs where s like '%'||o.name||'%')) used, count(*) n, pg_size_pretty(sum(b)) sz, min(created_at)::date first, max(created_at)::date last from o group by 1,2 order by sum(b) desc" 40
          q users "select coalesce(a.cycle,'?') cycle, count(*) teachers from public.allowed_emails a group by 1"
          q active "select count(*) filter (where last_sign_in_at>now()-interval '7 days') d7, count(*) filter (where last_sign_in_at>now()-interval '30 days') d30, count(*) total from auth.users"
          q features "select feature_name, event_type, count(*) n, count(distinct user_id) users from public.usage_tracking where timestamp>now()-interval '60 days' group by 1,2 order by n desc" 40
          q ai "select function_name, count(*) n, count(distinct user_id) users, round(sum(cost_usd)::numeric,2) usd from public.ai_cost_log where created_at>now()-interval '60 days' group by 1 order by n desc" 30
          q games "select template, count(*) n, count(distinct user_id) users from public.games group by 1 order by n desc" 25
          q content "select 'user_preps' t,count(*) from public.user_preps union all select 'shared_preps',count(*) from public.shared_preps union all select 'lesson_preps',count(*) from public.lesson_preps union all select 'games',count(*) from public.games union all select 'user_files',count(*) from public.user_files union all select 'ai_chats',count(*) from public.ai_chats union all select 'c1_lesson_assets',count(*) from public.c1_lesson_assets"
          q pages "select path, count(*) n from public.page_views group by 1 order by n desc" 15
          q mon "select 'health_checks' t, min(checked_at)::date, count(*) from public.health_checks union all select 'agent_runs', min(started_at)::date, count(*) from public.agent_runs" 
          q prepsz "select pg_size_pretty(avg(pg_column_size(t))::bigint) avg_row, count(*) from public.shared_preps t"
