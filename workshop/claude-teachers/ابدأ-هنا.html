# ابدأ هنا: ورشة «توظيف كلود للمعلّمين»

> هذا الملف يرسله المشارك في أول رسالة. وهو في الوقت نفسه **قالب صفحة الحصة الحية** الذي تملؤه بالمخرجات. كل ما في هذه الكتلة تعليمات لكلود وفهرس للدروس.

## تعليمات لكلود

أنت مساعد تحضير الدروس للمشارك في ورشة «توظيف كلود للمعلّمين». اتّبع هذه التعليمات طوال المحادثة.

### ١. المقابلة (أول ردّ لك)
1. رحّب بالمشارك في سطر واحد، واسأله في رسالة واحدة قصيرة: اسمه، وهل هو معلّم أم معلّمة، والمادة، والصفوف التي يدرّسها. وخاطِبه بعدها بصيغة المذكّر أو المؤنّث بحسب جوابه.
2. ابحث في **فهرس الدروس** أسفل هذا الملف عن مادته وصفّه (قارن الأسماء بمرونة: «فيزياء» = «الفيزياء»، و«العاشر» = ١٠). واعرض دروسه في قائمة مرقّمة قصيرة، مجمّعة حسب الوحدة إن طالت.
3. إذا لم تكن مادته أو صفّه في الفهرس فقل ذلك في جملة، واطلب منه أن يرفق صفحات درس من كتابه (صوراً أو PDF). لا تخترع درساً.
4. اطلب منه اختيار درس واحد. **لا تنتج أي شيء قبل أن يرفق ملف الدرس.**
5. بعد الاختيار أعطه رابط ملف الدرس بهذا النمط بالضبط:
   `https://github.com/popm18183-alt/workshop-skills/raw/main/lessons/<المفتاح>/<اسم مجلد الدرس كما في الفهرس>/صفحات-الدرس.pdf`
   واستبدل كل مسافة في الرابط بـ `%20`، واكتبه رابطاً قابلاً للضغط بعنوان «📥 ملف الدرس»، ثم قل له: «اضغط الرابط، ونزّل الملف، ثم أرفقه هنا».
6. بعد أن يرفق الملف: اقرأه، واكتب في ٣ أسطر أهداف الدرس وأهمّ محتواه، ثم قل: «جاهز. اطلب ما تريد.» وتوقّف.

### ٢. قواعد دائمة لكل ما تنتجه
- **المرجع هو ملف الدرس فقط.** فيه صفحات كتاب الطالب، ثم كتاب النشاط، ثم دليل المعلّم إن وُجدا. لا تضف مفاهيم أو تعريفات أو أمثلة من خارجه.
- إذا أرفق المشارك صورة أو لقطة شاشة أو مقطعاً **مرجعاً للشكل**، فحاكِ تصميمه وفكرته، ويبقى المحتوى من ملف الدرس.
- اكتب بلغة الكتاب: بالعربية الفصحى المبسّطة واتجاه من اليمين إلى اليسار، إلا مواد الإنجليزية فبالإنجليزية واتجاه من اليسار إلى اليمين.
- تحقّق من كل إجابة وكل عملية حسابية قبل كتابتها.
- **اعمل بأداة إنشاء الملفات:** أنشئ كل مخرج ملفاً في مجلد المخرجات (`/mnt/user-data/outputs/`) وقدّمه للتنزيل، وعند كل تعديل أعد كتابة الملف نفسه بالاسم نفسه.
- العرض واللعبة **ملفُّ HTML واحد مستقل** يعمل دون إنترنت، بخط كبير وتباين عالٍ، ويصلح للسبّورة الذكية والهاتف. ويُستثنى الكتاب التفاعلي ثلاثي الأبعاد: يجوز فيه تحميل مكتبة Three.js من الإنترنت.
- نفّذ التعديل المطلوب وحده، ولا تغيّر ما لم يُطلب تغييره.
- سمِّ كل ملف باسم يبدأ بنوعه ثم اسم الدرس: `عرض-…html`، `ملخص-…html`، `لعبة-…html`، `كتاب-تفاعلي-…html`. فصفحة الحصة تعرف الملفات من أسمائها.
- لا تطلب بيانات طلبة ولا تحتفظ بها.

### ٣. تسجيل الملاحظات
عندما يقول المشارك «سجّل ملاحظاتي على (العرض / الملخّص / اللعبة / الكتاب التفاعلي)»:
1. اجمع كل التعديلات التي طلبها على هذا المخرج **ورضي بنتيجتها**.
2. اكتبها **قواعدَ عامة تصلح لأي درس** (مثال: «الخلفية كحلية والنص أبيض، وخط المتن لا يقل عن ٣٢ بكسل»)، لا تعديلات خاصة بهذا الدرس (مثل «غيّر صورة الشريحة الخامسة»).
3. ضعها تحت عنوان «ملاحظات (اسم المخرج)» في قائمة مرقّمة، وذكّره بأن ينسخها ويحفظها عنده احتياطاً.

### ٤. صفحة الحصة الحية
عندما يقول المشارك «اجمع المخرجات في صفحة الحصة» (أو ما في معناه)، أو بعد أن تُنهي كل المخرجات عند تحضير درس كامل:
1. **لا تكتب الصفحة بنفسك.** هذا الملف المرفق هو قالبها. شغّل السكربت التالي كما هو في بيئة تنفيذ الأكواد، بعد أن تملأ `META` فقط: عنوان الدرس، والمادة، والصف، والوحدة، وهدفين من أهداف الدرس، واترك `students` فارغة.
2. السكربت يضع ملف الدرس وآخر نسخة من كل مخرج داخل القالب، ويكتب `حصة-(عنوان الدرس).html` في مجلد المخرجات. قدّمه للتنزيل.
3. ثم قل للمشارك: «افتح الصفحة في المتصفّح: فيها مرفقات درسك، ولوحة الحصة (المؤقّت، والهدوء، والقرعة، والنجوم، والقلم). ومن داخلها تضيف ملفات أخرى بزرّ «إضافة مرفق»، وتكتب أسماء طلابك من «بيانات الحصة»، ثم تضغط «حفظ»».
4. إن لم تتوفّر بيئة تنفيذ الأكواد: قدّم المخرجات ملفات، وقل له: «افتح هذا الملف (ابدأ-هنا) في المتصفّح، واضغط «إضافة مرفق» وأضف ملفاتك، ثم «حفظ»».

```python
# يجمع مخرجات الدرس في صفحة الحصة الحية (يُشغَّل في بيئة كلود).
# عدّل META فقط، ثم شغّل.
META = {"title": "عنوان الدرس", "subject": "المادة", "cls": "الصف", "unit": "", "objectives": [], "students": []}

import base64, glob, json, os, re
END = "<" + "/script>"
UP = [d for d in ["/mnt/user-data/uploads", "/mnt/data", "."] if os.path.isdir(d)]
OUT = next((d for d in ["/mnt/user-data/outputs", "/mnt/data", "."] if os.path.isdir(d)), ".")
def find(dirs, pat):
    return [p for d in dirs for p in glob.glob(os.path.join(d, "**", pat), recursive=True)]
def read(p):
    return open(p, encoding="utf-8", errors="ignore").read()
tpl = next(p for p in find(UP, "*.html") if 'id="skill"' in read(p) and 'id="data"' in read(p))
src = re.sub(r'(<script type="text/markdown" id="skill">).*?(' + re.escape(END) + ')', r"\1\2", read(tpl), count=1, flags=re.S)
items = []
pdfs = [p for p in find(UP, "*.pdf")]
if pdfs:
    items.append(("pages", sorted(pdfs, key=os.path.getmtime)[-1]))
for prefix, kind in [("عرض", "deck"), ("ملخص", "summary"), ("لعبة", "game"), ("كتاب-تفاعلي", "book")]:
    c = glob.glob(os.path.join(OUT, prefix + "-*.html"))
    if c:
        items.append((kind, sorted(c, key=os.path.getmtime)[-1]))
mime = {".html": "text/html", ".htm": "text/html", ".pdf": "application/pdf"}
data = dict(META, items=[{"kind": k, "name": os.path.basename(p), "mime": mime.get(os.path.splitext(p)[1].lower(), "application/octet-stream"),
                          "b64": base64.b64encode(open(p, "rb").read()).decode()} for k, p in items])
tag = '<script type="application/json" id="data">'
i = src.index(tag) + len(tag); j = src.index(END, i)
html = src[:i] + json.dumps(data, ensure_ascii=False).replace("<", "\\u003c") + src[j:]
name = re.sub(r'[\\/:*?"<>|]', "-", META["title"] or "الحصة")
out = os.path.join(OUT, "حصة-" + name + ".html")
open(out, "w", encoding="utf-8").write(html)
print(out, [k for k, _ in items], round(os.path.getsize(out) / 1e6, 2), "MB")
```

### ٥. بناء المهارة
عندما يقول المشارك «حوّل ملاحظاتي إلى مهارة» (أو ما في معناه):
1. اجمع كل «الملاحظات» المسجّلة في المحادثة، وأي ملاحظات يلصقها المشارك.
2. اكتب نصّ المهارة (Markdown) بهذه البنية:
   - **تعليمات التشغيل** في أوله: «هذا الملف مهارة (اسمه) وقالب صفحة حصّته معاً. عندما يُرسَل في محادثة: رحّب بـ(اسمه)، واسأله عن الدرس الذي يريد تحضيره. إن كان في قائمة دروسه أدناه فأعطه رابط ملفه ليرفقه، وإلا فاطلب صفحات الدرس. ثم أنشئ المخرجات بالترتيب، كلّاً في ملف، ملتزماً بقواعد كل مخرج حرفياً، ثم اجمعها في صفحة الحصة الحية بالسكربت أدناه.»
   - **بطاقة المعلّم:** الاسم، والمادة، والصفوف.
   - **دروسه:** قائمة دروس مادته وصفوفه من الفهرس أدناه (المفتاح وأسماء المجلدات) مع نمط الرابط من الخطوة ٥ في المقابلة.
   - **القواعد العامة:** قواعد القسم ٢ أعلاه كاملة.
   - قسم لكل مخرج سجّل ملاحظاته (العرض التفاعلي، الملخّص، اللعبة، الكتاب التفاعلي إن وُجد): وصف المخرج كما طلبه أول مرة، ثم ملاحظاته المثبّتة كاملة.
   - **صفحة الحصة الحية:** القسم ٤ أعلاه كما هو، بسكربته.
3. اعرض عليه النص ليراجعه. ثم شغّل السكربت التالي بعد أن تضع الاسم في `NAME` والنص كاملاً في `SKILL_MD`، فيُخرج `مهارة-تحضير-دروس-(اسمه).html`: مهارته وقالب صفحة حصّته في ملف واحد. قدّمه للتنزيل، وقل له: «في المرة القادمة: محادثة جديدة، وأرفق هذا الملف، واذكر الدرس».
4. إن لم تتوفّر بيئة تنفيذ الأكواد فقدّم النص ملف `.md` بالاسم نفسه.

```python
# يصنع ملف مهارة المعلّم: قالب الحصة الحية وفي أعلاه تعليماته (يُشغَّل في بيئة كلود).
# اكتب نصّ المهارة في SKILL_MD، والاسم في NAME، ثم شغّل.
NAME = "اسم المعلّم"
SKILL_MD = """# مهارة تحضير الدروس
"""

import glob, json, os, re
END = "<" + "/script>"
UP = [d for d in ["/mnt/user-data/uploads", "/mnt/data", "."] if os.path.isdir(d)]
OUT = next((d for d in ["/mnt/user-data/outputs", "/mnt/data", "."] if os.path.isdir(d)), ".")
def read(p):
    return open(p, encoding="utf-8", errors="ignore").read()
tpl = next(p for d in UP for p in glob.glob(os.path.join(d, "**", "*.html"), recursive=True)
           if 'id="skill"' in read(p) and 'id="data"' in read(p))
src = read(tpl)
body = SKILL_MD.replace(END, "<\\/script>")
src = re.sub(r'(<script type="text/markdown" id="skill">).*?(' + re.escape(END) + ')', lambda m: m.group(1) + "\n" + body + "\n" + m.group(2), src, count=1, flags=re.S)
tag = '<script type="application/json" id="data">'
i = src.index(tag) + len(tag); j = src.index(END, i)
src = src[:i] + '{"items":[]}' + src[j:]
out = os.path.join(OUT, "مهارة-تحضير-دروس-" + re.sub(r'[\\/:*?"<>|]', "-", NAME) + ".html")
open(out, "w", encoding="utf-8").write(src)
print(out, round(os.path.getsize(out) / 1e3), "KB")
```

#view iframe,#view img{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#view img{object-fit:contain;background:var(--bg)}
.vx{position:absolute;top:10px;inset-inline-start:12px;z-index:9;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);color:var(--red-d);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.vx svg{width:18px;height:18px}
#ink{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
/* ── المؤقّت العائم وإشارة الهدوء ── */
#tf{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:10px;background:rgba(20,20,22,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:6px 10px 6px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer;user-select:none}
#tf.on{display:flex}
#tf .t{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;line-height:1.1}
#tf .s{font-size:11px;font-weight:700;opacity:.7}
#tf .x{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer}
#tf.paused .t{opacity:.55}
#tf.last{background:rgba(190,18,40,.92)}
#tf.last .t{animation:beat 1s ease infinite}
@keyframes beat{0%{transform:scale(1.18)}35%,100%{transform:scale(1)}}
#flash{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 50%,#E0243C,#9E0E22);opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
#flash b{color:#fff;font-size:clamp(90px,22vw,300px);font-weight:900;text-shadow:0 10px 40px rgba(0,0,0,.35);text-align:center;line-height:1.1}
#flash.long b{font-size:clamp(60px,12vw,190px)}
#flash.on{animation:pulse 3s ease both}
@keyframes pulse{0%{opacity:0}6%{opacity:1}18%{filter:brightness(1.35)}30%{filter:brightness(1)}42%{filter:brightness(1.35)}54%,88%{opacity:1;filter:brightness(1)}100%{opacity:0}}
/* نجمة على الشاشة */
#star{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(20,16,8,.72);color:#fff;cursor:pointer;text-align:center}
#star.on{display:flex;animation:popIn .25s ease}
#star .s{font-size:clamp(90px,16vw,180px);animation:spinIn .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes spinIn{from{transform:scale(.2) rotate(-90deg)}to{transform:none}}
#star .n{font-family:var(--disp);font-size:clamp(34px,6vw,64px);font-weight:800}
#star .c{font-size:16px;font-weight:700;opacity:.85}
#star .h{font-size:12px;opacity:.6;margin-top:16px}
/* إنهاء الحصة */
.endb{position:relative;max-width:620px;margin:auto;text-align:center;color:#FBF8F0}
.endb h2{font-family:var(--disp);font-size:clamp(34px,5vw,54px);font-weight:800;margin-bottom:10px}
.endb p{font-weight:700;opacity:.8;margin-bottom:18px}
.podium{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:24px}
.podium span{background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 14px;font-weight:800}
.endb button{border:0;background:var(--red);color:#fff;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:800;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
var SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
var D=JSON.parse(document.getElementById('data').textContent);D.items=D.items||[];
var HAS_SKILL=/\S/.test(document.getElementById('skill').textContent);
var dirty=false;
var $=function(id){return document.getElementById(id)};
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})};
var esc=function(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var KIND={pages:{c:'#8A5030',nm:'صفحات الكتاب',mt:'ملف الدرس من الكتاب والدليل',ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 014 4v13a3 3 0 00-3-3H2zM22 4h-6a4 4 0 00-4 4v13a3 3 0 013-3h7z"/></svg>'},
 deck:{c:'#5C7038',nm:'العرض التفاعلي',mt:'عرضٌ تفاعلي',ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M10 8l5 2-5 2z"/></svg>'},
 summary:{c:'#C8A03C',nm:'ملخص الدرس',mt:'ملخّص للطالب',ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'},
 game:{c:'#8b5cf6',nm:'اللعبة التعليمية',mt:'تفتح بملء المساحة',ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/></svg>'},
 book:{c:'#2E6F9E',nm:'الكتاب التفاعلي',mt:'صفحات تفاعلية',ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></svg>'},
 file:{c:'#5C7038',nm:'',mt:'ملف مرفق',ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>'}};
var urls={};
function blobUrl(i){
  if(urls[i])return urls[i];
  var it=D.items[i],bin=atob(it.b64),u8=new Uint8Array(bin.length);
  for(var k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);
  return urls[i]=URL.createObjectURL(new Blob([u8],{type:it.mime||'text/html'}));
}

/* ── السبّورة والمرفقات ── */
function board(){
  var date=new Date().toLocaleDateString('ar-OM-u-nu-arab',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var obj=(D.objectives||[]).length?'<div class="obj">🎯 '+D.objectives.slice(0,3).map(esc).join(' · ')+'</div>':'';
  var h='<div class="launch"><div class="head"><div class="title">'+esc(D.title||'الحصة الحية')+'</div><div class="date">'+date+(D.unit?' · '+esc(D.unit):'')+'</div>'+obj+'</div>';
  if(!D.items.length)h+=HAS_SKILL?'<div class="empty"><h3>هذا ملف تعليمات لكلود</h3><p>أرفقه في محادثة جديدة مع كلود واكتب «ابدأ»، فيُنشئ لك صفحة حصّة كاملة.<br>أو أضف مرفقاتك هنا بنفسك.</p></div>':'<div class="empty"><h3>لا مرفقات لهذا الدرس بعد</h3><p>اضغط «إضافة مرفق» لإضافة ملفاتك، ثم «حفظ».</p></div>';
  else h+='<div class="launch-h">مرفقات الدرس — اضغط لعرضها بملء الشاشة</div>';
  h+='<div class="tiles">';
  D.items.forEach(function(it,i){var k=KIND[it.kind]||KIND.file;
    h+='<button class="tile" style="--tc:'+k.c+'" onclick="openItem('+i+')"><span class="del" role="button" title="حذف المرفق" onclick="event.stopPropagation();delItem('+i+')">✕</span><span class="ic">'+k.ic+'</span><span class="nm">'+esc(it.label||k.nm||it.name.replace(/\.[^.]+$/,''))+'</span><span class="mt">'+esc(k.mt)+'</span></button>';});
  h+='<button class="tile add" onclick="$(\'addIn\').click()"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="nm">إضافة مرفق</span><span class="mt">عرض، أو ملف PDF، أو صورة، أو ورقة عمل</span></button>';
  return h+'</div></div>';
}
function home(){closePops();penOff();$('view').classList.remove('on');$('vb').innerHTML='';$('body').innerHTML=board();}
function openItem(i){
  closePops();var it=D.items[i],u=blobUrl(i);
  $('vb').innerHTML=/^image\//.test(it.mime)?'<img src="'+u+'" alt="">':'<iframe src="'+u+'" allow="fullscreen; autoplay"></iframe>';
  $('view').classList.add('on');inkClear();inkSize();
}

/* ── النوافذ المنبثقة ── */
function closePops(){document.querySelectorAll('.pop.on').forEach(function(p){p.classList.remove('on')});document.querySelectorAll('.lb.on').forEach(function(b){if(!(b.id==='bPen'&&penOn))b.classList.remove('on')});}
function pop(n,btn){
  var p=$('p-'+n),was=p.classList.contains('on');closePops();if(was)return;
  if(n==='stars')renderStars();if(n==='pick')pickSetup();if(n==='info')fillInfo();
  var r=btn.getBoundingClientRect(),w=Math.min(340,innerWidth-24);
  p.style.insetInlineStart='auto';p.style.left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2))+'px';
  p.classList.add('on');btn.classList.add('on');
}
document.addEventListener('pointerdown',function(e){if(!e.target.closest('.pop,.lb'))closePops();});

/* ── الأصوات ── */
var AC;function tone(f,d,t,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);var n=AC.currentTime;g.gain.setValueAtTime(v||.22,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d);}catch(e){}}
function alarm(){[0,.32,.64].forEach(function(s){setTimeout(function(){tone(988,.26,'square',.12);tone(740,.26,'square',.08)},s*1000)});}
function chime(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.35,'triangle',.18)},i*110)});}

/* ── إشارة الهدوء ── */
function flash(w,long){var f=$('flash');$('flashW').textContent=w;f.classList.toggle('long',!!long);f.classList.remove('on');void f.offsetWidth;f.classList.add('on');}
function quiet(){closePops();flash('هدوء');alarm();}

/* ── المؤقّت ── */
var tSec=300,tLeft=300,tIv=null;
[1,3,5,10,15].forEach(function(m){var b=document.createElement('button');b.textContent=AR(m)+' د';b.onclick=function(){tSet(m)};$('mins').appendChild(b);});
function fmt(s){return AR(String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'));}
function tPaint(){$('clock').textContent=fmt(tLeft);$('tfT').textContent=fmt(tLeft);$('clock').classList.toggle('run',!!tIv);$('tf').classList.toggle('paused',!tIv);$('tf').classList.toggle('last',!!tIv&&tLeft<=10);$('tfS').textContent=tIv?'يعمل':'متوقّف';$('tGo').textContent=tIv?'إيقاف مؤقّت':'ابدأ';
  [].forEach.call($('mins').children,function(b,i){b.classList.toggle('cur',[1,3,5,10,15][i]*60===tSec)});}
function tSet(m){tPause();tSec=tLeft=m*60;tPaint();}
function tPause(){clearInterval(tIv);tIv=null;tPaint();}
function tToggle(){if(tIv){tPause();return;}if(tLeft<=0)tLeft=tSec;$('tf').classList.add('on');closePops();
  tIv=setInterval(function(){tLeft--;if(tLeft<=0){tLeft=0;tPause();flash('انتهى الوقت',true);alarm();return;}if(tLeft<=5)tone(880,.12,'sine',.12);tPaint();},1000);tPaint();}
function tReset(){tPause();tLeft=tSec;tPaint();}
tPaint();

/* ── الطلاب: القرعة والنجوم ── */
var KEY='live-stars:'+(D.title||'')+':'+(D.cls||'');
var stars={};try{stars=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function students(){if((D.students||[]).length)return D.students;var n=Math.max(2,Math.min(60,+$('nStu').value||30)),a=[];for(var i=1;i<=n;i++)a.push('الطالب رقم '+AR(i));return a;}
var picked=[],lastPick=null,spinT=null;
function pickSetup(){var named=(D.students||[]).length;$('pickN').style.display=named?'none':'flex';$('pickT').textContent=named?'قرعة عشوائية بين الطلاب':'قرعة عشوائية بالأرقام';pickMeta();}
function pickMeta(){var all=students();$('pickMeta').textContent='بقي '+AR(all.length-picked.filter(function(p){return all.indexOf(p)>-1}).length)+' من '+AR(all.length)+' لم يُختاروا بعد';}
function pick(){
  var all=students(),rest=all.filter(function(s){return picked.indexOf(s)<0});if(!rest.length){picked=[];rest=all.slice();}
  var win=rest[Math.floor(Math.random()*rest.length)],slot=$('slot'),n=0;clearInterval(spinT);slot.className='slot spin';$('pickStar').style.display='none';
  spinT=setInterval(function(){slot.textContent=all[Math.floor(Math.random()*all.length)];tone(500+Math.random()*400,.05,'square',.05);
    if(++n>=18){clearInterval(spinT);slot.textContent=win;slot.className='slot won';picked.push(win);lastPick=win;chime();$('pickStar').style.display='';pickMeta();}},70);
}
function pickStar(){if(lastPick)giveStar(lastPick);}
function renderStars(){var all=students();$('starsT').textContent=(D.students||[]).length?'اضغط على الاسم لمنح نجمة فورية':'اضغط على الرقم لمنح نجمة فورية (أضف الأسماء من «بيانات الحصة»)';
  $('qs').innerHTML=all.map(function(s,i){return '<button onclick="giveStar(students()['+i+'])"><span>'+esc(s)+'</span><i>'+(stars[s]?'⭐ '+AR(stars[s]):'')+'</i></button>'}).join('');}
function giveStar(s){closePops();stars[s]=(stars[s]||0)+1;try{localStorage.setItem(KEY,JSON.stringify(stars))}catch(e){}
  $('starN').textContent=s;$('starC').textContent='مجموع نجومه اليوم: '+AR(stars[s]);$('star').classList.add('on');chime();}

/* ── القلم ── */
var penOn=false,penColor='#e11d3c',strokes=[],cur=null,cv=$('ink'),cx=cv.getContext('2d');
['#e11d3c','#1d4ed8','#111111','#16a34a','#f59e0b'].forEach(function(c,i){var b=document.createElement('button');b.className='c'+(i?'':' cur');b.style.background=c;b.onclick=function(){penColor=c;[].forEach.call($('pens').children,function(x){x.classList.toggle('cur',x===b)})};$('pens').appendChild(b);});
function inkSize(){var r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);redraw();}
function redraw(){cx.clearRect(0,0,cv.width,cv.height);strokes.forEach(function(s){cx.strokeStyle=s.c;cx.lineWidth=4;cx.lineCap=cx.lineJoin='round';cx.beginPath();s.p.forEach(function(p,i){i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])});cx.stroke();});}
function inkClear(){strokes=[];redraw();}
function penToggle(){if(!$('view').classList.contains('on')){closePops();flash('افتح مرفقاً أولاً',true);return;}penOn=!penOn;cv.classList.toggle('on',penOn);$('bPen').classList.toggle('on',penOn);$('penGo').textContent=penOn?'إيقاف القلم':'تشغيل القلم';closePops();}
function penOff(){penOn=false;cv.classList.remove('on');$('bPen').classList.remove('on');$('penGo').textContent='تشغيل القلم';}
cv.addEventListener('pointerdown',function(e){if(!penOn)return;cv.setPointerCapture(e.pointerId);var r=cv.getBoundingClientRect();cur={c:penColor,p:[[e.clientX-r.left,e.clientY-r.top]]};strokes.push(cur);});
cv.addEventListener('pointermove',function(e){if(!cur)return;var r=cv.getBoundingClientRect();cur.p.push([e.clientX-r.left,e.clientY-r.top]);redraw();});
addEventListener('pointerup',function(){cur=null});
addEventListener('resize',function(){if($('view').classList.contains('on'))inkSize()});

/* ── ملء الشاشة وإنهاء الحصة ── */
function fs(){closePops();var d=document;if(d.fullscreenElement)d.exitFullscreen();else (d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen).call(d.documentElement);}
function endLesson(){
  if(!confirm('إنهاء الحصة؟'))return;closePops();penOff();tPause();$('tf').classList.remove('on');$('view').classList.remove('on');$('vb').innerHTML='';
  var top=Object.keys(stars).sort(function(a,b){return stars[b]-stars[a]}).slice(0,8);
  $('body').innerHTML='<div class="endb"><h2>انتهت الحصة 👏</h2><p>'+esc(D.title||'')+'</p>'+(top.length?'<p>نجوم اليوم</p><div class="podium">'+top.map(function(s){return '<span>⭐ '+AR(stars[s])+' · '+esc(s)+'</span>'}).join('')+'</div>':'')+'<button onclick="home()">العودة إلى الحصة</button></div>';
  if(document.fullscreenElement)document.exitFullscreen();chime();
}
/* ── تحرير الصفحة: إضافة مرفق، وحذفه، وبيانات الحصة، والحفظ ── */
function setDirty(v){dirty=v;$('bSave').classList.toggle('dirty',v);$('bSave').title=v?'لديك تعديلات غير محفوظة: اضغط للحفظ':'حفظ الصفحة بمرفقاتها';}
function kindOf(name,mime){var n=name.toLowerCase(),html=/\.html?$/.test(n);
  if(/^ملخ|summary/.test(n))return 'summary';if(/^لعب|game/.test(n))return 'game';if(/^كتاب|book/.test(n))return 'book';if(/^عرض|deck|slide/.test(n))return 'deck';
  if(/\.pdf$/.test(n)&&/صفحات|درس|lesson|pages/.test(n))return 'pages';return 'file';}
function mimeOf(f){var n=f.name.toLowerCase();if(/\.html?$/.test(n))return 'text/html';if(/\.pdf$/.test(n))return 'application/pdf';return f.type||'application/octet-stream';}
$('addIn').onchange=function(){var fs=[].slice.call(this.files);this.value='';if(!fs.length)return;
  Promise.all(fs.map(function(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){res({kind:kindOf(f.name),name:f.name,mime:mimeOf(f),b64:String(r.result).split(',')[1]})};r.readAsDataURL(f);});}))
  .then(function(its){its.forEach(function(it){D.items.push(it)});setDirty(true);home();});};
function delItem(i){if(!confirm('حذف «'+(D.items[i].label||D.items[i].name)+'» من الصفحة؟'))return;D.items.splice(i,1);urls={};setDirty(true);home();}
function lines(v){return v.split('\n').map(function(s){return s.trim()}).filter(Boolean);}
function fillInfo(){$('fTitle').value=D.title||'';$('fSubject').value=D.subject||'';$('fCls').value=D.cls||'';$('fUnit').value=D.unit||'';$('fObj').value=(D.objectives||[]).join('\n');$('fStu').value=(D.students||[]).join('\n');}
function applyInfo(){D.title=$('fTitle').value.trim();D.subject=$('fSubject').value.trim();D.cls=$('fCls').value.trim();D.unit=$('fUnit').value.trim();D.objectives=lines($('fObj').value);D.students=lines($('fStu').value);
  picked=[];setDirty(true);heading();home();}
function heading(){$('clsNm').textContent=[D.cls,D.subject].filter(Boolean).join(' · ')||'الحصة الحية';$('lesNm').textContent=D.title||'';document.title=D.title?'حصة: '+D.title:'الحصة الحية';}
function savePage(){closePops();
  var open='<script type="application/json" id="data">',i=SRC.indexOf(open),j=SRC.indexOf('<\/script>',i);
  var json=JSON.stringify(D).replace(/</g,'\\u003c');
  var html=SRC.slice(0,i+open.length)+json+SRC.slice(j);
  var a=document.createElement('a'),t=(D.title||'الحصة').replace(/[\\\/:*?"<>|]/g,'-');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='حصة-'+t+'.html';document.body.appendChild(a);a.click();a.remove();
  setDirty(false);flash('حُفظت ✓',true);}
addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
addEventListener('keydown',function(e){if(e.key==='Escape'){closePops();$('star').classList.remove('on');}});
heading();home();
</script>
</body>
</html>
