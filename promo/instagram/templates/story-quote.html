<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>خُطّة — قالب ستوري: رأي معلّم</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Tajawal:wght@400;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1080px; height: 1920px; }

  body {
    background: #F0E2C8;
    font-family: 'Cairo', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .safe-top, .safe-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 250px;
    pointer-events: none;
  }
  .safe-top { top: 0; }
  .safe-bottom { bottom: 0; }

  .quote-icon {
    position: absolute;
    top: 330px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
  }

  .quote-text {
    position: absolute;
    top: 600px;
    left: 100px;
    right: 100px;
    text-align: center;
    font-weight: 800;
    font-size: 54px;
    line-height: 1.6;
    color: #3D2314;
  }

  .name {
    position: absolute;
    top: 1260px;
    left: 0;
    right: 0;
    text-align: center;
    font-weight: 800;
    font-size: 36px;
    color: #3D2314;
  }

  .role {
    position: absolute;
    top: 1320px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Tajawal', sans-serif;
    font-size: 26px;
    color: #6b5a44;
  }

  .divider {
    position: absolute;
    top: 1230px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 5px;
    border-radius: 3px;
    background: #C9A84C;
  }

  .brand {
    position: absolute;
    bottom: 340px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .brand img { width: 52px; height: 52px; border-radius: 12px; }
  .brand span { font-weight: 800; font-size: 28px; color: #3D2314; }
</style>
</head>
<body>
  <div class="safe-top"></div>
  <div class="safe-bottom"></div>

  <img class="quote-icon" src="../highlights/05-testimonials.png" alt="">

  <!-- EDIT: نص رأي المعلّم/المعلّمة -->
  <div class="quote-text">«[اقتباسٌ من رأي معلّمةٍ أو معلّمٍ عن خُطّة هنا]»</div>

  <div class="divider"></div>
  <!-- EDIT: الاسم والمادة/المدرسة (اختياريّ، وبإذن صاحب الرأي) -->
  <div class="name">[اسم المعلّم/ة]</div>
  <div class="role">معلّم/ة [المادة] — [المدرسة]</div>

  <div class="brand">
    <img src="../../../khottah_icon_192.png" alt="خُطّة">
    <span>خُطّة</span>
  </div>
</body>
</html>
