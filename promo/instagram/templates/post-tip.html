<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>خُطّة — قالب منشور: هل تعلمين؟</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Tajawal:wght@400;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1080px; height: 1080px; }

  body {
    background: #F0E2C8;
    font-family: 'Cairo', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; }
  .dot.magenta { top: 56px; right: 56px; background: #B03040; }
  .dot.gold    { bottom: 56px; left: 56px; background: #C9A84C; }

  .badge {
    position: absolute;
    top: 110px;
    left: 50%;
    transform: translateX(-50%);
    padding: 16px 44px;
    border-radius: 999px;
    border: 3px solid #3D2314;
    font-weight: 800;
    font-size: 30px;
    color: #3D2314;
  }

  .quote {
    position: absolute;
    top: 300px;
    left: 110px;
    right: 110px;
    text-align: center;
    font-weight: 900;
    font-size: 60px;
    line-height: 1.5;
    color: #3D2314;
  }

  .subtext {
    position: absolute;
    top: 720px;
    left: 140px;
    right: 140px;
    text-align: center;
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.7;
    color: #5a4a36;
  }

  .brand {
    position: absolute;
    bottom: 70px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .brand img { width: 48px; height: 48px; border-radius: 12px; }
  .brand span { font-weight: 800; font-size: 26px; color: #3D2314; }
</style>
</head>
<body>
  <div class="dot magenta"></div>
  <div class="dot gold"></div>

  <div class="badge">هل تعلمين؟ 💡</div>

  <!-- EDIT: الحقيقة أو المعلومة الرئيسية -->
  <div class="quote">«[معلومةٌ أو حقيقةٌ تربويّةٌ مختصرة هنا]»</div>

  <!-- EDIT: توضيح إضافي أو ربطها بميزة في خُطّة -->
  <div class="subtext">تفصيلٌ إضافي بسيط، أو كيف تساعدكِ خُطّة على تطبيق ذلك يوميّاً.</div>

  <div class="brand">
    <img src="../../../khottah_icon_192.png" alt="خُطّة">
    <span>خُطّة</span>
  </div>
</body>
</html>
