<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>خُطّة — قالب منشور: ميزة</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Tajawal:wght@400;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1080px;
  }

  body {
    background: #F0E2C8;
    font-family: 'Cairo', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .dot {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
  }
  .dot.orange { background: #E8654A; top: 56px; left: 56px; }
  .dot.green  { background: #5B8C5A; bottom: 56px; right: 56px; }

  .brand {
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .brand img { width: 64px; height: 64px; border-radius: 16px; }
  .brand-text { text-align: right; }
  .brand-text .name { font-weight: 800; font-size: 30px; color: #3D2314; }
  .brand-text .tag { font-family: 'Tajawal', sans-serif; font-size: 18px; color: #6b5a44; }

  .tile {
    position: absolute;
    top: 300px;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 260px;
    border-radius: 64px;
    background: #C9A84C; /* EDIT: swap tile color per category (green/gold/orange/magenta/brown) */
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile img { width: 150px; height: 150px; }

  .headline {
    position: absolute;
    top: 640px;
    left: 90px;
    right: 90px;
    text-align: center;
    font-weight: 900;
    font-size: 68px;
    line-height: 1.35;
    color: #3D2314;
  }

  .subtext {
    position: absolute;
    top: 860px;
    left: 130px;
    right: 130px;
    text-align: center;
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.6;
    color: #5a4a36;
  }

  .footer {
    position: absolute;
    bottom: 64px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Tajawal', sans-serif;
    font-size: 22px;
    color: #8a7256;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="dot orange"></div>
  <div class="dot green"></div>

  <div class="brand">
    <div class="brand-text">
      <div class="name">خُطّة</div>
      <div class="tag">منصّة المعلّم لإدارة الخطّة الفصليّة</div>
    </div>
    <img src="../../../khottah_icon_192.png" alt="خُطّة">
  </div>

  <!-- EDIT: بدّلي أيقونة المربّع بأي أيقونة من مجلد highlights/ حسب الميزة المعروضة -->
  <div class="tile">
    <img src="../highlights/glyphs/02-features.png" alt="">
  </div>

  <!-- EDIT: العنوان الرئيسي للمنشور -->
  <div class="headline">[عنوان الميزة هنا]</div>

  <!-- EDIT: وصف مختصر للميزة (سطر أو سطران) -->
  <div class="subtext">وصفٌ قصير يشرح الفائدة للمعلّم أو المعلّمة بجملة واحدة واضحة.</div>

  <div class="footer">KHOTTAH · خُطّة</div>
</body>
</html>
