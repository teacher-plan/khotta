<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>خُطّة — قالب ستوري: دعوة لإجراء</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Tajawal:wght@400;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1080px; height: 1920px; }

  body {
    background: #5B8C5A;
    font-family: 'Cairo', sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* منطقة آمنة: إنستغرام يغطّي نحو 250px أعلى الستوري و250px أسفلها بواجهته */
  .safe-top, .safe-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 250px;
    pointer-events: none;
  }
  .safe-top { top: 0; }
  .safe-bottom { bottom: 0; }

  .dot { position: absolute; width: 26px; height: 26px; border-radius: 50%; }
  .dot.cream  { top: 300px; right: 80px; background: #F0E2C8; opacity: .5; }
  .dot.orange { bottom: 320px; left: 80px; background: #E8654A; opacity: .8; }

  .brand {
    position: absolute;
    top: 300px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .brand img { width: 96px; height: 96px; border-radius: 24px; }
  .brand span { font-weight: 800; font-size: 34px; color: #F0E2C8; }

  .headline {
    position: absolute;
    top: 640px;
    left: 90px;
    right: 90px;
    text-align: center;
    font-weight: 900;
    font-size: 76px;
    line-height: 1.4;
    color: #F0E2C8;
  }

  .subtext {
    position: absolute;
    top: 1080px;
    left: 130px;
    right: 130px;
    text-align: center;
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.7;
    color: #f0e2c8cc;
  }

  .cta {
    position: absolute;
    bottom: 340px;
    left: 50%;
    transform: translateX(-50%);
    background: #F0E2C8;
    color: #3D2314;
    font-weight: 800;
    font-size: 34px;
    padding: 26px 70px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="safe-top"></div>
  <div class="safe-bottom"></div>

  <div class="dot cream"></div>
  <div class="dot orange"></div>

  <div class="brand">
    <img src="../../../khottah_icon_192.png" alt="خُطّة">
    <span>خُطّة</span>
  </div>

  <!-- EDIT: العنوان الرئيسي -->
  <div class="headline">[عنوانٌ قصيرٌ وجذّاب هنا]</div>

  <!-- EDIT: نص فرعي -->
  <div class="subtext">جملةٌ واحدة تشرح الدعوة — تجربة، اشتراك، أو تذكير بميزة.</div>

  <!-- EDIT: نص الزر — ضعي فوقه ملصق الرابط الحقيقي من إنستغرام (Link Sticker) -->
  <div class="cta">جرّبي الآن ⬆</div>
</body>
</html>
