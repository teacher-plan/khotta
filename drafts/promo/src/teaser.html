// «وقتك استثمار» — 35 s kinetic poster (style 1, ref techhalla-498547). 120 BPM, beat = 0.5 s.
// OFF/BPM are set from the music analysis so the beat grid lands on the track's downbeats.
const OFF=+(Q.get('off')||0),BPM=+(Q.get('bpm')||120);
const MW=W*.86;
const mono=(s,x,y,size,col,o={})=>txt(s,x,y,size*u,col,Object.assign({f:'IBM Plex Mono',w:500,ltr:true,ls:4*u},o));

// a word that slams in from below (spring + smear), misregisters on impact, and leaves upward fast
function slam(s,t,t0,t1,y,max,col,o={}){
  if(t<t0-.05||t>t1+.25)return;const lt=t-t0+.05,p=under(lt,18,.55),out=ein(seg(t,t1,t1+.22));
  const size=fit(s,max*u,o.mw||MW,o);const yy=y+(1-p)*360*u-out*420*u;
  X.save();if(o.clip!==false){X.beginPath();X.rect(0,y-size*1.25,W,size*1.6);X.clip()}
  X.globalAlpha=1-out*.3;
  txt(s,cx,yy,size,col,o);X.restore();}
function ticks(t,y,a=1,col=P.green){X.save();X.fillStyle=col;const n=V?30:48,gap=(W*.72)/n;for(let i=0;i<n;i++){const h=(6+16*Math.abs(Math.sin(i*1.7+t*9)))*u;X.globalAlpha=a*(.5+.5*seg(t%0.5,0,.05));X.fillRect(W*.14+i*gap,y-h/2,5*u,h)}X.restore()}
function checkMark(x,y,s,d,col,lw){if(d<=0)return;const pts=[[-.3,.02],[-.08,.24],[.32,-.22]].map(([a,b])=>[x+a*s,y+b*s]);
 const L1=Math.hypot(pts[1][0]-pts[0][0],pts[1][1]-pts[0][1]),L2=Math.hypot(pts[2][0]-pts[1][0],pts[2][1]-pts[1][1]);
 X.save();X.strokeStyle=col;X.lineWidth=lw;X.lineCap='round';X.lineJoin='round';X.setLineDash([(L1+L2)*d,L1+L2]);X.beginPath();X.moveTo(...pts[0]);X.lineTo(...pts[1]);X.lineTo(...pts[2]);X.stroke();X.restore()}
function spinner(x,y,r,t,col){X.save();X.strokeStyle=col;X.lineWidth=r*.28;X.lineCap='round';const a=t*9;X.beginPath();X.arc(x,y,r,a,a+Math.PI*1.3);X.stroke();X.restore()}
function spinner(x,y,r,t,col){X.save();X.strokeStyle=col;X.lineWidth=r*.28;X.lineCap='round';const a=t*9;X.beginPath();X.arc(x,y,r,a,a+Math.PI*1.3);X.stroke();X.restore()}

 {n:'ملخّص الطالب',m:'ورقة PDF للطباعة',c:'#C8A03C',ic:'info'},{n:'فيديو الدرس',m:'شرحٌ بالتعليق الصوتي',c:'#B03040',ic:'video'},
 {n:'اللعبة التعليمية',m:'تُلعب في الصف',c:'#8b5cf6',ic:'game'},{n:'صفحات الكتاب',m:'من كتاب الطالب',c:'#8A5030',ic:'book'}];

 if(k==='prep'){rr(-8,-10,16,20,2);X.stroke();[-5,-1,3].forEach(yy=>{X.beginPath();X.moveTo(-4,yy);X.lineTo(4,yy);X.stroke()})}

 if(k==='book'){X.beginPath();X.moveTo(0,-7);X.lineTo(0,9);X.moveTo(0,-7);X.quadraticCurveTo(-6,-10,-10,-8);X.lineTo(-10,8);X.quadraticCurveTo(-6,6,0,9);X.quadraticCurveTo(6,6,10,8);X.lineTo(10,-8);X.quadraticCurveTo(6,-10,0,-7);X.stroke()}
 X.restore()}

function T1(t){X.fillStyle=P.dark;X.fillRect(0,0,W,H);const y=V?H*.52:H*.56;

 const cw=n?measure(shown,fs,{w:700}):measure('اكتب اسم الدرس…',fs,{w:700})*0;if(Math.floor(lt*2.5)%2===0||(lt>.6&&lt<4.6)){X.fillStyle=P.gold;X.fillRect(tx-cw-10*u,cy-fs*.55,4*u,fs*1.1)}

 X.strokeStyle=P.dark;X.lineWidth=5*u;X.lineCap='round';X.beginPath();X.moveTo(sb*.18,0);X.lineTo(-sb*.2,0);X.moveTo(-sb*.04,-sb*.16);X.lineTo(-sb*.2,0);X.lineTo(-sb*.04,sb*.16);X.stroke();X.restore();
 X.restore();
 const c=crit(lt-4.9,6);if(lt>4.8&&lt<6.9)cursorAt(sx+(1-c)*300*u+8*u,cy+(1-c)*240*u+8*u,(V?1.6:1.3)*u*(1-.15*pr),1-seg(lt,6.5,6.9));
 if(sent){const q=seg(lt,6.1,6.4);spinner(cx+(V?200:230)*u,cy+bh+70*u,16*u,lt,P.gold);txt('يُجهَّز كلّ شيء…',cx-20*u,cy+bh+84*u,(V?44:40)*u,P.cream,{f:'Tajawal',w:800,a:q})}

// 11–15 · the outputs arrive on the beat
function T3(t){const lt=t-11;X.fillStyle=P.dark;X.fillRect(0,0,W,H);cornerT(t,'WORKSHOP · OUTPUT ×'+Math.min(6,Math.max(0,Math.floor((lt-.5)/.5)+1)));
 slam('ويصلك كلّ شيء:',t,11.0,14.6,V?H*.18:H*.2,V?110:100,P.cream);
 const bw=(V?760:720)*u,bh=(V?104:84)*u,gap=(V?22:16)*u,top=V?H*.27:H*.29,col=V?1:2,cwid=V?bw:(bw*2+gap)/1;

 OUTS.forEach((o,i)=>{const t0=.5+i*.5,p=under(lt-t0,17,.55);if(p<=0)return;
  const r_=V?i:Math.floor(i/2),c_=V?0:i%2,x=V?cx-bw/2:(c_===0?cx+gap/2:cx-gap/2-bw),y=top+r_*(bh+gap)+(V?0:0);
  const fx=cx-bw/2,fy=cy-bh/2,xx=mix(x,fx,out),yy=mix(y,fy,out)-(1-p)*H*.25;

 if(out>0){const s=mix(.4,1,out);X.save();X.globalAlpha=out;X.translate(cx,cy);X.scale(s,s);X.fillStyle='#FBF8F0';rr(-110*u,-140*u,220*u,280*u,22*u);X.fill();X.restore()}}

function stageRect(){const barH=(V?120:96)*u;return {barH,x:0,y:barH,w:W,h:H-barH}}
function tileRects(){const {barH}=stageRect(),cols=V?2:3,rows=V?3:2,gw=V?W*.88:Math.min(W*.8,1500*u),g=(V?26:28)*u,tw=(gw-(cols-1)*g)/cols,th=(V?250:240)*u,top=V?barH+H*.27:barH+H*.33,x0=cx+gw/2;
 return OUTS.map((o,i)=>{const r_=Math.floor(i/cols),c_=i%cols;return {x:x0-(c_+1)*tw-c_*g,y:top+r_*(th+g),w:tw,h:th}})}

 X.save();rr(R.x,R.y,R.w,R.h,24*u);X.clip();X.fillStyle=o.c;X.fillRect(R.x,R.y,R.w,8*u);X.restore();
 if(hl){X.strokeStyle=o.c;X.lineWidth=4*u;rr(R.x,R.y,R.w,R.h,24*u);X.stroke()}
 const pad=30*u;ico(o.ic,R.x+R.w-pad-24*u,R.y+pad+30*u,(V?2.6:2.2)*u,o.c);
 txt(o.n,R.x+R.w-pad,R.y+R.h-pad-50*u,fit(o.n,(V?48:42)*u,R.w-2*pad),P.dark,{al:'right'});
 txt(o.m,R.x+R.w-pad,R.y+R.h-pad,fit(o.m,(V?28:25)*u,R.w-2*pad,{f:'Tajawal',w:800}),'#8a7c68',{f:'Tajawal',w:800,al:'right'});X.restore()}
function liveBar(lt){const {barH}=stageRect(),d=crit(lt,10);X.save();X.translate(0,-(1-d)*barH);X.fillStyle='rgba(20,20,22,.92)';X.fillRect(0,0,W,barH);X.fillStyle='rgba(255,255,255,.08)';X.fillRect(0,barH-2*u,W,2*u);
 const pad=(V?36:40)*u,mid=barH/2;txt('٧/أ · رياضيات',W-pad,mid+(V?12:10)*u,(V?36:30)*u,'#fff',{al:'right'});
 if(!V)txt(LESSON,W-pad-300*u,mid+10*u,26*u,'rgba(255,255,255,.6)',{f:'Tajawal',w:800,al:'right'});
 // tool buttons (left side)
 const tools=['timer','quiet','pick','stars','fs'],bs=(V?66:58)*u;tools.forEach((k,i)=>{const bx=pad+i*(bs+12*u),q=crit(lt-.2-i*.05,12);X.save();X.globalAlpha=q;X.fillStyle='rgba(255,255,255,.1)';rr(bx,mid-bs/2,bs,bs,14*u);X.fill();
  X.strokeStyle='#fff';X.fillStyle='#fff';X.lineWidth=2.6*u;X.lineCap='round';const ix=bx+bs/2,iy=mid,r=bs*.24;
  if(k==='timer'){X.beginPath();X.arc(ix,iy+2*u,r,0,7);X.stroke();X.beginPath();X.moveTo(ix,iy+2*u);X.lineTo(ix,iy-r*.5);X.stroke()}

  if(k==='pick'){rr(ix-r,iy-r,2*r,2*r,4*u);X.stroke();X.beginPath();X.arc(ix-r*.4,iy-r*.4,2.4*u,0,7);X.arc(ix+r*.4,iy+r*.4,2.4*u,0,7);X.fill()}
  if(k==='stars'){X.beginPath();for(let j=0;j<10;j++){const an=-Math.PI/2+j*Math.PI/5,rad=j%2?r*.45:r;X.lineTo(ix+Math.cos(an)*rad,iy+Math.sin(an)*rad)}X.closePath();X.stroke()}

  X.restore()});X.restore()}
function T4(t){const lt=t-16,{barH}=stageRect();
 X.fillStyle='#000';X.fillRect(0,0,W,H);const sa=crit(lt,8);X.save();X.globalAlpha=sa;const g=X.createLinearGradient(0,barH,0,H);g.addColorStop(0,'#2A1C14');g.addColorStop(1,'#140C07');X.fillStyle=g;X.fillRect(0,barH,W,H-barH);X.restore();

 txt('مرفقات الدرس — اضغط لعرضها بملء الشاشة',cx,hy+(V?195:160)*u,(V?28:23)*u,'rgba(251,248,240,.5)',{f:'Tajawal',w:800,a:seg(lt,1.0,1.3)});

 let mx,my,ca=1;const a1=crit(lt-3.1,6),a2=crit(lt-7.0,6);if(lt<7.0){mx=P1[0]+(1-a1)*320*u;my=P1[1]+(1-a1)*260*u}else{mx=mix(P1[0],P3[0],a2);my=mix(P1[1],P3[1],a2)}

 if(lt>=7.75&&lt<10.6){const z=lt<10.2?crit(lt-7.75,9):1-crit(lt-10.2,12);return {open:3,z,k:lt-7.75,hover:null}}
 return {open:null,hover:lt>3.3&&lt<4.0?1:(lt>7.3&&lt<7.75?3:null)}}
function slide(S,k){const pad=60*u,R0=S.x+S.w-pad;txt(LESSON,R0,S.y+pad+70*u,(V?70:64)*u,P.dark,{al:'right'});X.fillStyle=P.gold;X.fillRect(R0-260*u,S.y+pad+100*u,260*u,8*u);
 // 10-part bar: one part shaded on the beat, then the label ٠٫١
 const bw=Math.min(S.w-2*pad,(V?880:1100)*u),bh=(V?120:110)*u,bx=S.x+S.w/2-bw/2,by=S.y+S.h*.45;

 const q=crit(k-1.4,9);txt('جزءٌ واحد من عشرة',bx+bw,by+bh+90*u,(V?50:44)*u,P.dark,{al:'right',a:q,w:700});
 const q2=under(k-1.9,15,.6);X.save();X.translate(bx+120*u,by+bh+80*u);X.scale(q2,q2);txt('٠٫١',0,0,(V?110:96)*u,P.coral,{});X.restore();
 txt('١ / ١٢',S.x+pad,S.y+S.h-pad*.7,(V?30:26)*u,'#8a7c68',{f:'Tajawal',w:800,al:'left'})}
