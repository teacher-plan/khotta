<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>رسالة تقدير</title>
<link rel="stylesheet" href="_kit.css"/>
<style>
.builder{max-width:960px;width:100%;text-align:center;animation:up .35s both}
.builder h3{font-size:clamp(19px,2.6vw,30px);margin:0 0 14px}
.opts21{display:grid;gap:10px;max-width:780px;margin:0 auto 16px}
.opts21 .btn{justify-content:flex-start;text-align:start;font-size:clamp(15.5px,1.9vw,21px);min-height:58px}
.opts21 .btn.sel{background:var(--a);color:#fff}
/* البطاقة الختامية */
.card21{position:relative;width:min(92vw,50vh*1.45,720px);aspect-ratio:29/20;margin:0 auto 16px;
  background:linear-gradient(160deg,#FFF9F0,#FBEFD8);border:5px solid var(--ink);border-radius:22px;
  box-shadow:var(--sh);overflow:hidden;animation:pop .5s both;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:clamp(16px,3vw,40px)}
.card21 .deco{position:absolute;inset:0;pointer-events:none}
.card21 .to{font-size:clamp(15px,2vw,21px);font-weight:800;color:var(--a2);margin-bottom:8px;position:relative}
.card21 .msg{font-size:clamp(19px,3vw,34px);font-weight:800;line-height:1.7;max-width:85%;position:relative}
.card21 .msg .hl{color:#B0721A}
.card21 .from{margin-top:12px;font-size:clamp(13.5px,1.8vw,18px);font-weight:700;opacity:.8;position:relative}
.rowline{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.namein{border:3px solid var(--ink);border-radius:13px;background:var(--paper);padding:12px 16px;
  font-family:inherit;font-size:clamp(16px,2vw,21px);font-weight:800;text-align:center;max-width:300px;width:100%}
.namein:focus{outline:4px solid var(--a);outline-offset:2px}
</style>
</head>
<body>
<script src="_kit.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   النشاط ٢١ — رسالة تقدير
   الهدف: نشر اللطف وتقدير السلوك الإيجابي.
   القيد التربوي الصريح من البرومبت — وهو جوهر النشاط: كل العبارات عن
   السلوك والجهد والتعاون، ولا عبارة واحدة عن الشكل أو الذكاء أو
   المقارنة («أفضل من...») — التقدير يُوجَّه لما يفعله الطفل لا لما
   هو عليه، فيتعلّم الصف أن يرى أفعال بعضه.
   ═══════════════════════════════════════════════════════════════════ */
const OPENERS = [
  'أُقدّر فيك أنّك…',
  'شكراً لأنّك…',
  'لاحظتُ أنّك…',
  'أُعجبت بك حين…',
];
/* كل العبارات سلوكٌ وجهد — لا شكل ولا مقارنة */
const BEHAVIORS = [
  'تساعد زملاءك دون أن يطلبوا',
  'تستمع باحترامٍ حين يتكلّم غيرك',
  'تحاول من جديد حتى حين تصعب المهمّة',
  'تشجّع زملاءك وتفرح لنجاحهم',
  'تحافظ على نظام الصف ونظافته',
  'تقول الحقيقة حتى حين تكون صعبة',
  'تشارك أدواتك بسخاء',
  'تدافع عن زميلٍ بطريقةٍ مهذّبة',
  'تعتذر بشجاعةٍ حين تخطئ',
  'تُدخل الفرح على الصف بابتسامتك الطيّبة',
];
const CLOSERS = [
  'استمرّ — فصفّنا أجمل بك!',
  'سلوكك يعلّمنا كلَّنا.',
  'مثلُك يجعل المدرسة مكاناً أحلى.',
  'فخورون أنّك معنا.',
];
const DECOS = ['🌸','⭐','🌿','💛','🦋','✨'];

const SCENE = `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><linearGradient id="bg21" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBEEDD"/><stop offset="1" stop-color="#F3EBD3"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg21)"/>
  <!-- حديقة امتنان: أغصان وخيط بطاقات -->
  <path d="M0 170q400 90 800 40t800 30" fill="none" stroke="#2A1503" stroke-width="4"/>
  <g stroke="#2A1503" stroke-width="3">
    <rect x="200" y="205" width="80" height="58" rx="7" fill="#FFF9F0" transform="rotate(-5 240 234)"/>
    <rect x="520" y="222" width="80" height="58" rx="7" fill="#FBF0CE" transform="rotate(4 560 251)"/>
    <rect x="860" y="200" width="80" height="58" rx="7" fill="#DFF0E2" transform="rotate(-3 900 229)"/>
    <rect x="1180" y="212" width="80" height="58" rx="7" fill="#F6E0DC" transform="rotate(5 1220 241)"/>
    <rect x="1440" y="220" width="80" height="58" rx="7" fill="#E6E0EF" transform="rotate(-4 1480 249)"/>
  </g>
  <g stroke="#2A1503" stroke-width="4">
    <path d="M120 900V620q-40-40-20-90" fill="none" stroke-width="7"/>
    <circle cx="90" cy="510" r="34" fill="#D86048"/><circle cx="90" cy="510" r="12" fill="#E8C34A"/>
    <path d="M240 900V680q30-40 14-80" fill="none" stroke-width="6"/>
    <circle cx="260" cy="580" r="27" fill="#6B4E9E"/><circle cx="260" cy="580" r="9" fill="#FFF9F0"/>
    <path d="M1440 900V640q40-40 24-96" fill="none" stroke-width="7"/>
    <circle cx="1470" cy="520" r="32" fill="#D9A93C"/><circle cx="1470" cy="520" r="11" fill="#8B2635"/>
  </g>
  <g stroke="#2A1503" stroke-width="3" fill="#E8C34A" opacity=".8">
    <path d="M700 420l9 19 21 3-15 15 3 21-18-10-18 10 3-21-15-15 21-3z"/>
    <path d="M1080 480l7 15 17 2-12 12 2 17-14-8-14 8 2-17-12-12 17-2z"/></g>
  <g transform="translate(420 520) rotate(-12)" stroke="#2A1503" stroke-width="3">
    <ellipse cx="-12" rx="14" ry="20" fill="#9FD4E8"/><ellipse cx="12" rx="14" ry="20" fill="#9FD4E8"/>
    <path d="M0 -14v28" stroke-width="4"/></g>
  <rect y="830" width="1600" height="70" fill="#A8C494"/>
  <path d="M0 830h1600" stroke="#2A1503" stroke-width="5"/>
</svg>`;

let K, sel = { opener: null, behavior: null, closer: null, to: '', from: '' }, made = 0;

K = Kit.build({
  title: 'رسالة تقدير',
  accent: '#D86048', accent2: '#A8402C',
  scene: SCENE,
  onRestart: () => home(),
  teacher: {
    goal: 'نشر اللطف وتقدير السلوك الإيجابي: يبني الطالب بطاقة تقديرٍ لزميله من عباراتٍ كلّها عن السلوك والجهد — لا الشكل ولا المقارنة.',
    tools: 'الشاشة. ويُفضَّل ورقٌ وألوان لينسخ كلُّ طالبٍ بطاقته ويُهديها فعلاً.',
    groups: 'فرديّ أو ثنائيّ أمام الشاشة، والباقون يجهّزون بطاقاتهم الورقية.',
    steps: [
      'قدّمي الفكرة: «اليوم نرى أفعال بعضنا الجميلة ونقولها».',
      'مهم: وزّعي الأسماء بالقرعة كي لا يبقى طالبٌ بلا بطاقة — لا اختياراً حراً.',
      'يبني الطالب البطاقة: افتتاحية، ثم سلوك، ثم خاتمة، ثم الاسمان.',
      'تظهر البطاقة الجميلة — يقرأها بصوتٍ مسموع وهو ينظر لزميله.',
      'ينسخها على ورقةٍ ويزيّنها ويُهديها.',
      'كرّروا حتى ينال كل طالبٍ بطاقة.',
    ],
    time: '١٥ إلى ٢٠ دقيقة ليأخذ الجميع دورهم.',
    script: 'كلُّنا نفعل أشياء جميلة… لكن قليلاً ما نسمع أحداً يقولها لنا! اليوم سنقولها: كلٌّ منّا سيصنع بطاقة تقديرٍ لزميلٍ — عن شيءٍ فعله لا عن شكله. انظروا جيداً في أفعال بعضكم… ستجدون كنوزاً!',
    tips: 'القرعة في توزيع الأسماء هي صمّام الأمان — بلا قرعةٍ يتكرّر المحبوبون ويُنسى الهادئون، وأول المنسيين أحوجهم للبطاقة. وذكّري: نُقدّر الفعل («ساعدتني») لا الصفة («أنت ذكي»).',
    points: 'بلا نقاطٍ إطلاقاً — التقدير هديّةٌ لا سباق.',
    levels: 'الأصغر: اقرئي الخيارات لهم ودعيهم يشيرون. الأكبر: بعد البطاقة الجاهزة يضيفون جملةً من إنشائهم عن موقفٍ محدّد حدث فعلاً.',
    close: [
      'كيف شعرتَ حين قرأ زميلك بطاقتك؟',
      'لماذا قدّرنا الأفعال ولم نقل «أنت جميل» أو «أنت ذكي»؟',
      'من سنشكر اليوم في البيت على فعلٍ جميل؟',
    ],
  },
});

function home() {
  sel = { opener: null, behavior: null, closer: null, to: '', from: '' };
  K.stage.innerHTML = '';
  const s = K.el('div', 'start');
  s.innerHTML = `
    <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="12" y="26" width="76" height="52" rx="8" fill="#FFF9F0" stroke="#2A1503" stroke-width="5"/>
      <path d="M12 34l38 26 38-26" fill="none" stroke="#2A1503" stroke-width="5"/>
      <path d="M50 14l5 10 11 2-8 8 2 11-10-6-10 6 2-11-8-8 11-2z" fill="#D86048" stroke="#2A1503" stroke-width="3.5"/>
    </svg>
    <h1>رسالة تقدير</h1>
    <p class="sub">كلُّنا نفعل أشياء جميلة… واليوم نقولها لبعضنا. بطاقةٌ عن الفعل لا عن الشكل.</p>
    <div class="meta">
      <span class="chip">العمر: <b>٧ – ١٠ سنوات</b></span>
      <span class="chip">الزمن: <b>١٥ – ٢٠ دقيقة</b></span>
      <span class="chip">فرديّ بالقرعة</span>
      <span class="chip">المهارة: <b>رؤية أفعال الآخرين</b></span>
      <span class="chip">القيمة: <b>اللطف والامتنان</b></span>
    </div>`;
  const go = K.el('div', 'go');
  const b1 = K.el('button', 'btn p big', 'اصنعوا أول بطاقة');
  b1.onclick = () => { K.SFX.ok(); build(1); };
  const b2 = K.el('button', 'btn big', 'تعليمات المعلّمة');
  b2.onclick = () => K.teacher.open();
  go.append(b1, b2); s.appendChild(go);
  K.stage.appendChild(s);
}

function build(stage) {
  K.stage.innerHTML = '';
  const wrap = K.el('div', 'builder');

  if (stage === 1) {
    wrap.appendChild(K.el('h3', '', '١ · كيف نبدأ رسالتنا؟'));
    const box = K.el('div', 'opts21');
    OPENERS.forEach(o => {
      const b = K.el('button', 'btn', '💌 ' + o);
      b.onclick = () => { sel.opener = o; K.SFX.tap(); build(2); };
      box.appendChild(b);
    });
    wrap.appendChild(box);
  } else if (stage === 2) {
    wrap.appendChild(K.el('h3', '', `٢ · «${Kit.esc(sel.opener)}» — أيّ سلوكٍ جميلٍ رأيناه؟`));
    const box = K.el('div', 'opts21');
    BEHAVIORS.forEach(o => {
      const b = K.el('button', 'btn', '✨ ' + o);
      b.onclick = () => { sel.behavior = o; K.SFX.tap(); build(3); };
      box.appendChild(b);
    });
    wrap.appendChild(box);
  } else if (stage === 3) {
    wrap.appendChild(K.el('h3', '', '٣ · وكيف نختم؟'));
    const box = K.el('div', 'opts21');
    CLOSERS.forEach(o => {
      const b = K.el('button', 'btn', '💛 ' + o);
      b.onclick = () => { sel.closer = o; K.SFX.tap(); build(4); };
      box.appendChild(b);
    });
    wrap.appendChild(box);
  } else if (stage === 4) {
    wrap.appendChild(K.el('h3', '', '٤ · لمن الرسالة؟ وممّن؟ (اختياري)'));
    const row = K.el('div', 'rowline');
    const to = K.el('input', 'namein'); to.placeholder = 'اسم الزميل (اختياري)'; to.value = sel.to;
    const from = K.el('input', 'namein'); from.placeholder = 'اسمك (اختياري)'; from.value = sel.from;
    row.append(to, from);
    wrap.appendChild(row);
    const go = K.el('button', 'btn p big', '🎀 اصنعوا البطاقة!');
    go.style.marginTop = '16px';
    go.onclick = () => { sel.to = to.value.trim(); sel.from = from.value.trim(); K.SFX.win(); card(); return; };
    wrap.appendChild(go);
  }

  if (stage > 1) {
    const back = K.el('button', 'btn sm hide-present', '← السابق');
    back.style.marginTop = '14px';
    back.onclick = () => { K.SFX.tap(); build(stage - 1); };
    wrap.appendChild(back);
  }
  K.stage.appendChild(wrap);
}

function card() {
  made++;
  K.stage.innerHTML = '';
  const wrap = K.el('div', 'builder');
  const c = K.el('div', 'card21');
  /* زخارف موزّعة على الحواف */
  const deco = DECOS.map((d, i) => {
    const pos = [[6,8],[86,10],[8,78],[88,80],[47,4],[46,88]][i];
    return `<span style="position:absolute;inset-inline-start:${pos[0]}%;inset-block-start:${pos[1]}%;
      font-size:clamp(18px,3vw,34px);opacity:.9">${d}</span>`;
  }).join('');
  c.innerHTML = `<div class="deco">${deco}
      <div style="position:absolute;inset:10px;border:3px dashed rgba(42,21,3,.25);border-radius:14px"></div></div>
    ${sel.to ? `<div class="to">إلى ${Kit.esc(sel.to)} 🌷</div>` : ''}
    <div class="msg">${Kit.esc(sel.opener)}<br/><span class="hl">${Kit.esc(sel.behavior)}</span><br/>${Kit.esc(sel.closer)}</div>
    ${sel.from ? `<div class="from">من صديقك: ${Kit.esc(sel.from)}</div>` : ''}`;
  wrap.appendChild(c);
  wrap.appendChild(K.el('div', 'chip', '📣 اقرأها بصوتٍ مسموع وأنت تنظر لزميلك — ثم انسخها على ورقةٍ وأهدها له'));

  const row = K.el('div', 'rowline'); row.style.marginTop = '16px';
  const again = K.el('button', 'btn p big', '💌 بطاقةٌ لزميلٍ آخر');
  again.onclick = () => { K.SFX.tap(); sel = { opener: null, behavior: null, closer: null, to: '', from: '' }; build(1); };
  const fin = K.el('button', 'btn', 'ختام النشاط');
  fin.onclick = () => K.reflect({
    value: 'اللطف والامتنان',
    questions: [
      'كيف شعرتَ حين سمعتَ بطاقتك؟ وحين قرأتَ بطاقة زميلك؟',
      'لماذا قدّرنا الأفعال ولم نقل «أنت جميل» أو «أنت أذكى من…»؟',
      'من سنشكر الليلة في البيت على فعلٍ جميل؟',
    ],
  }, home);
  row.append(again, fin);
  wrap.appendChild(row);
  K.stage.appendChild(wrap);
}

home();
</script>
</body>
</html>
