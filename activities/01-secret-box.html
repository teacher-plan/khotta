<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>صندوق الأسرار</title>
<link rel="stylesheet" href="_kit.css"/>
<style>
/* ══ لوح الأسرار ══
   الصورة أسفل، والمربّعات فوقها تُزال واحداً واحداً. لا نُخفي بضبابٍ
   تدريجي: الطفل يحتاج أن يرى *ما كشفه هو* واضحاً كي يبني تخمينه عليه. */
/* اللوح يُقاس بالارتفاع لا بالعرض: العرض المحسوب كان يتجاوز الشاشة رأسياً
   فيُقصّ أعلاه ويهبط الباقي تحت الحافّة — والمعلّمة لا تُمرّر الصفحة أمام صفّها. */
#board{position:relative;height:clamp(180px,40vh,420px);width:auto;aspect-ratio:4/3;
  border:5px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:var(--sh);
  background:radial-gradient(circle at 50% 42%,#FFF3D6,#F3DFB6)}
#pic{position:absolute;inset:0;display:grid;place-items:center;font-size:min(34vh,38vw);line-height:1}
#tiles{position:absolute;inset:0;display:grid;gap:3px}
#tiles button{border:2px solid rgba(42,21,3,.5);background:linear-gradient(150deg,var(--a),var(--a2));
  cursor:pointer;transition:opacity .32s,transform .32s;color:#fff;font-family:inherit;
  font-weight:800;font-size:clamp(14px,2vw,22px);display:grid;place-items:center}
#tiles button:hover{filter:brightness(1.16)}
#tiles button.off{opacity:0;transform:scale(.6) rotate(6deg);pointer-events:none}
.hints{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:900px}
.hint{background:var(--paper);border:2px dashed var(--ink);border-radius:12px;padding:9px 16px;
  font-weight:800;font-size:clamp(16px,1.8vw,20px);animation:up .3s both}
.picks{display:flex;flex-wrap:wrap;gap:11px;justify-content:center}
.picks .btn{min-width:170px}
.picks .btn.right{background:var(--ok);color:#fff}
.picks .btn.wrong{opacity:.45}
.rowline{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
#done{font-size:clamp(19px,2.3vw,27px);font-weight:800;text-align:center}
</style>
</head>
<body>
<script src="_kit.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   النشاط ١ — صندوق الأسرار
   الهدف: الفضول، الملاحظة، الاستدلال من دليلٍ ناقص.
   الفكرة التربوية: الطالب لا يرى الصورة كاملة أبداً قبل أن يُخمّن. هذا
   مقصود — المهارة المستهدفة هي بناء استنتاجٍ من معلومةٍ ناقصة، لا
   التعرّف على صورةٍ واضحة.
   ═══════════════════════════════════════════════════════════════════ */

/* ثلاثون سرّاً في ثلاثة مستويات. لكلٍّ تلميحاتٌ متدرّجة: الأول بعيد،
   والأخير قريب — كي يبقى التفكير مطلوباً حتى مع التلميح. */
const SECRETS = {
  سهل: [
    {g:'🌧️',n:'المطر',   h:['ينزل من السماء','يُسمع صوته على النافذة','تشربه الأشجار']},
    {g:'📚',n:'الكتاب',  h:['فيه صفحات','تجده في المكتبة','نقرأ فيه ونتعلّم']},
    {g:'🐝',n:'النحلة',  h:['حشرةٌ صغيرة','لها صوت طنين','تصنع العسل']},
    {g:'⌚',n:'الساعة',  h:['لها عقارب','تدور طوال اليوم','تُخبرنا بالوقت']},
    {g:'🌳',n:'الشجرة',  h:['لها جذور','تعطينا ظلاً','تُنقّي الهواء']},
    {g:'🚌',n:'الحافلة', h:['لها عجلات','تحمل كثيرين معاً','تُقلّنا إلى المدرسة']},
    {g:'✏️',n:'القلم',   h:['نمسكه بأصابعنا','له سِنّ','نكتب به']},
    {g:'🌙',n:'القمر',   h:['نراه ليلاً','يتغيّر شكله','يُنير الظلام']},
    {g:'🐟',n:'السمكة',  h:['تعيش في الماء','لها زعانف','تسبح ولا تمشي']},
    {g:'🍞',n:'الخبز',   h:['نأكله كل يوم','يُصنع من القمح','يخرج من الفرن']},
  ],
  متوسط: [
    {g:'🧭',n:'البوصلة', h:['صغيرةٌ في اليد','فيها إبرةٌ تتحرّك','تدلّك على الاتجاه']},
    {g:'🔬',n:'المجهر',  h:['يُستعمل في المختبر','يُكبّر ما لا نراه','يكشف الكائنات الدقيقة']},
    {g:'🪁',n:'الطائرة الورقية',h:['تحتاج خيطاً','تطير بالهواء','نلعب بها في الساحة']},
    {g:'🧯',n:'مطفأة الحريق',h:['حمراء اللون','معلّقةٌ في الممرّ','تُطفئ النار']},
    {g:'🐪',n:'الجمل',   h:['يعيش في الصحراء','يتحمّل العطش طويلاً','يُسمّى سفينة الصحراء']},
    {g:'🌋',n:'البركان', h:['جبلٌ لكنه ليس عادياً','يخرج منه دخان','تتدفّق منه الحمم']},
    {g:'🪺',n:'العُشّ',  h:['يُبنى بالأغصان','تصنعه الطيور','فيه بيضٌ صغير']},
    {g:'⚓',n:'المرساة', h:['ثقيلةٌ جداً','تُلقى في البحر','تُثبّت السفينة']},
    {g:'🕰️',n:'الساعة الرمليّة',h:['فيها رمل','لها جزءان','تقيس الوقت بالسقوط']},
    {g:'🪴',n:'النبتة المنزليّة',h:['في أصيص','تحتاج ماءً وضوءاً','تُجمّل البيت وتُنقّي هواءه']},
  ],
  متقدّم: [
    {g:'🛰️',n:'القمر الصناعي',h:['ليس من صنع الطبيعة','يدور حول الأرض','ينقل الاتصال والصور']},
    {g:'🧬',n:'الحمض النووي',h:['لا يُرى بالعين','في داخل كل خليّة','يحمل صفاتنا من الوالدين']},
    {g:'🏺',n:'الجرّة الفخّاريّة',h:['تُصنع من الطين','قديمةٌ جداً','كانت تُحفظ فيها المياه']},
    {g:'🔭',n:'التلسكوب',h:['يُستعمل ليلاً','له عدسةٌ طويلة','يُقرّب النجوم']},
    {g:'⚖️',n:'الميزان',h:['له كفّتان','يعرف الأثقل','رمزٌ للعدل']},
    {g:'🌾',n:'سنبلة القمح',h:['تنمو في الحقل','لونها ذهبيّ','منها يُصنع الدقيق']},
    {g:'🪸',n:'الشِّعاب المرجانيّة',h:['تحت الماء','تبدو كالنبات وليست نباتاً','بيتٌ لآلاف الأسماك']},
    {g:'🧊',n:'الجبل الجليدي',h:['يطفو ولا يغرق','معظمه مختفٍ','يذوب مع ارتفاع الحرارة']},
    {g:'🏮',n:'الفانوس',h:['يُضاء في المناسبات','قديمٌ وجميل','يحمل الضوء في الظلام']},
    {g:'🪶',n:'الريشة',h:['خفيفةٌ جداً','تسقط ببطء','كانت تُستعمل للكتابة']},
  ],
};
const LEVEL_TILES = { 'سهل': 9, 'متوسط': 12, 'متقدّم': 16 };
const ROUNDS = 5;

/* المشهد: غرفة اكتشافاتٍ لطيفة — صناديق وأضواء ونجوم، بلا ازدحامٍ خلف
   موضع اللوح. الفراغ في الوسط مقصود. */
const SCENE = `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E6CC"/><stop offset="1" stop-color="#E4D2AE"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="330" r="430" fill="url(#glow)"/>
  <g stroke="#2A1503" stroke-width="6" fill="#D9A93C">
    <rect x="70" y="600" width="210" height="180" rx="16"/>
    <path d="M70 660h210" fill="none"/><rect x="152" y="600" width="46" height="60" fill="#8B2635"/>
  </g>
  <g stroke="#2A1503" stroke-width="6" fill="#487848">
    <rect x="1330" y="640" width="190" height="150" rx="14"/>
    <path d="M1330 692h190" fill="none"/><rect x="1404" y="640" width="42" height="52" fill="#E8C34A"/>
  </g>
  <g stroke="#2A1503" stroke-width="5" fill="#2F7D74">
    <rect x="300" y="700" width="150" height="112" rx="12"/><path d="M300 742h150" fill="none"/>
  </g>
  <g fill="#E8C34A" stroke="#2A1503" stroke-width="4">
    <path d="M250 150l22 46 50 7-36 35 9 50-45-24-45 24 9-50-36-35 50-7z"/>
    <path d="M1370 190l17 35 39 6-28 27 7 39-35-19-35 19 7-39-28-27 39-6z" opacity=".9"/>
    <path d="M1180 90l13 27 30 4-22 21 5 30-26-14-26 14 5-30-22-21 30-4z" opacity=".7"/>
    <path d="M430 105l13 27 30 4-22 21 5 30-26-14-26 14 5-30-22-21 30-4z" opacity=".7"/>
  </g>
  <g stroke="#2A1503" stroke-width="5" fill="#D86048">
    <circle cx="1490" cy="240" r="46"/><path d="M1490 286v40" fill="none"/>
  </g>
  <rect y="812" width="1600" height="88" fill="#C9B48C"/>
  <path d="M0 812h1600" stroke="#2A1503" stroke-width="6"/>
</svg>`;

let K, teams, level = 'متوسط', round = 0, cur = null, shown = 0, bags = {}, revealed = 0;

K = Kit.build({
  title: 'صندوق الأسرار',
  accent: '#2F7D74', accent2: '#1F5A54',
  scene: SCENE,
  onRestart: () => home(),
  teacher: {
    goal: 'تنمية الفضول والملاحظة والاستدلال: يبني الطالب تخميناً من دليلٍ ناقص، ويُراجعه كلّما ظهر دليلٌ جديد.',
    tools: 'شاشة العرض فقط. لا حاجة إلى أوراقٍ أو أدوات.',
    groups: 'فريقان إلى أربعة. اجعلي كل فريق يتشاور قبل أن يرفع يده — التشاور هو المهارة لا السرعة.',
    steps: [
      'اختاري المستوى وعدد الفرق ثم اضغطي «ابدأ النشاط».',
      'اطلبي من فريقٍ اختيار مربّعٍ واحدٍ ليُزال — بالتناوب بين الفرق.',
      'بعد كل كشفٍ اسألي: «ماذا تغيّر في تخمينكم الآن؟»',
      'من يظنّ أنه عرف يرفع يده، ويختار الفريق إجابةً من الخيارات.',
      'إن أخطأ فريق، لا تكشفي الإجابة — أعطِ فريقاً آخر فرصة.',
      'استعملي «تلميح» عند توقّف التفكير لا قبله.',
    ],
    time: '١٠ إلى ١٥ دقيقة لخمس جولات.',
    script: 'داخل صندوق الأسرار شيءٌ مخفيّ… لن نراه كاملاً أبداً! سنكشف مربّعاً واحداً في كل مرّة، ونُفكّر معاً: ما الذي يمكن أن يكون؟',
    tips: 'امنعي الصياح بالإجابة — اجعلي القاعدة «نتشاور ثم نرفع اليد». وامدحي التخمين المُعلَّل ولو كان خاطئاً؛ فالتعليل هو المهارة.',
    points: 'نقطةٌ للإجابة الصحيحة، ونقطةٌ لأيّ فريقٍ يشرح تفكيره تعليلاً جيّداً ولو أخطأ. استعملي أزرار القيم أسفل لوحة النقاط.',
    levels: 'سهل: ٩ مربّعات وأشياء مألوفة. متوسط: ١٢ مربّعاً. متقدّم: ١٦ مربّعاً ومفاهيم علميّة أعمق.',
    close: [
      'ما الدليل الذي غيّر رأيكم؟',
      'هل تسرّع أحدنا في التخمين؟ ماذا نتعلّم من ذلك؟',
      'أين نحتاج في حياتنا أن نُفكّر قبل أن نحكم؟',
    ],
  },
});

Object.keys(SECRETS).forEach(k => bags[k] = K.Bag(SECRETS[k]));

/* ── شاشة البداية ── */
function home() {
  round = 0;
  K.stage.innerHTML = '';
  const s = K.el('div', 'start');
  s.innerHTML = `
    <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="12" y="34" width="76" height="54" rx="8" fill="#2F7D74" stroke="#2A1503" stroke-width="5"/>
      <path d="M12 50h76" stroke="#2A1503" stroke-width="5"/>
      <rect x="42" y="34" width="16" height="54" fill="#E8C34A" stroke="#2A1503" stroke-width="5"/>
      <path d="M50 30V12M38 22l12-10 12 10" fill="none" stroke="#2A1503" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="8" r="6" fill="#D86048" stroke="#2A1503" stroke-width="4"/>
    </svg>
    <h1>صندوق الأسرار</h1>
    <p class="sub">شيءٌ غامضٌ يختبئ خلف المربّعات. نكشف قليلاً… ونُفكّر كثيراً.</p>
    <div class="meta">
      <span class="chip">العمر: <b>٧ – ١٠ سنوات</b></span>
      <span class="chip">الزمن: <b>١٠ – ١٥ دقيقة</b></span>
      <span class="chip">الفرق: <b>٢ – ٤</b></span>
      <span class="chip">المهارة: <b>الاستدلال والملاحظة</b></span>
      <span class="chip">القيمة: <b>التأنّي قبل الحكم</b></span>
    </div>`;

  const opts = K.el('div', 'card');
  opts.style.cssText = 'margin-bottom:22px;display:flex;gap:26px;flex-wrap:wrap;justify-content:center;align-items:center';
  opts.innerHTML = `<div><div style="font-weight:800;margin-bottom:8px">المستوى</div>
      <div id="lv" style="display:flex;gap:8px"></div></div>
    <div><div style="font-weight:800;margin-bottom:8px">عدد الفرق</div>
      <div id="tc" style="display:flex;gap:8px"></div></div>`;
  s.appendChild(opts);

  const go = K.el('div', 'go');
  const b1 = K.el('button', 'btn p big', 'ابدأ النشاط');
  b1.onclick = () => { K.SFX.ok(); play(); };
  const b2 = K.el('button', 'btn big', 'تعليمات المعلّمة');
  b2.onclick = () => K.teacher.open();
  go.append(b1, b2); s.appendChild(go);
  K.stage.appendChild(s);

  let nTeams = 2;
  const pick = (host, vals, get, set) => {
    host.innerHTML = '';
    vals.forEach(v => {
      const b = K.el('button', 'btn sm' + (get() === v ? ' p' : ''), Kit.AR(v));
      b.onclick = () => { set(v); K.SFX.tap(); pick(host, vals, get, set); };
      host.appendChild(b);
    });
  };
  pick(opts.querySelector('#lv'), Object.keys(SECRETS), () => level, v => level = v);
  pick(opts.querySelector('#tc'), [2, 3, 4], () => nTeams, v => nTeams = v);
  home.teamCount = () => nTeams;
}

/* ── جولة ── */
function play() {
  round++;
  cur = bags[level].next();
  shown = 0; revealed = 0;
  const tiles = LEVEL_TILES[level];
  const cols = tiles === 9 ? 3 : 4;

  K.stage.innerHTML = '';
  const wrap = K.el('div', '');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:16px;width:100%';

  const head = K.el('div', 'rowline');
  head.innerHTML = `<span class="chip">الجولة <b>${Kit.AR(round)} / ${Kit.AR(ROUNDS)}</b></span>
    <span class="chip">المستوى: <b>${level}</b></span>`;
  wrap.appendChild(head);

  const board = K.el('div', ''); board.id = 'board';
  const pic = K.el('div', ''); pic.id = 'pic'; pic.textContent = cur.g;
  const tl = K.el('div', ''); tl.id = 'tiles';
  tl.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  for (let i = 0; i < tiles; i++) {
    const b = K.el('button', '', Kit.AR(i + 1));
    b.onclick = () => {
      b.classList.add('off'); K.SFX.soft(); revealed++;
      if (revealed === Math.ceil(tiles / 2)) K.say('نصف الصورة ظهر — من غيّر تخمينه؟', 'info');
    };
    tl.appendChild(b);
  }
  board.append(pic, tl);
  wrap.appendChild(board);

  const hints = K.el('div', 'hints'); wrap.appendChild(hints);
  const picks = K.el('div', 'picks'); wrap.appendChild(picks);
  const teamsBox = K.el('div', 'teams'); teamsBox.style.marginTop = '4px';
  wrap.appendChild(teamsBox);

  K.stage.appendChild(wrap);

  // الفرق تُنشأ مرّةً وتُعاد ربطها بمسرح كل جولة — النقاط تعبر الجولات
  if (!teams) teams = K.Teams(teamsBox, home.teamCount ? home.teamCount() : 2);
  else teams.mount(teamsBox);
  wrap.appendChild(K.valuesRow(teams, [
    [1, 'تعليلٌ جميل'], [1, 'تشاور الفريق'], [1, 'أصغى لزميله'],
  ]));

  // خيارات الإجابة: الصحيح مع ثلاثةٍ من المستوى نفسه — الخيار البعيد
  // يجعل التخمين سهلاً بلا تفكير
  const others = Kit.shuffle(SECRETS[level].filter(x => x.n !== cur.n)).slice(0, 3);
  Kit.shuffle(others.concat([cur])).forEach(o => {
    const b = K.el('button', 'btn', o.n);
    b.onclick = () => answer(b, o, picks);
    picks.appendChild(b);
  });

  // أدوات الجولة في الشريط السفلي
  K.bottom.querySelectorAll('.round-tool').forEach(x => x.remove());
  const hintBtn = K.tool('💡 تلميح', 'إظهار تلميح', () => {
    if (shown >= cur.h.length) { K.say('لا مزيد من التلميحات — فكّروا معاً!', 'warn'); return; }
    const h = K.el('div', 'hint', '💡 ' + Kit.esc(cur.h[shown++]));
    hints.appendChild(h);
  }, 'g');
  hintBtn.classList.add('round-tool');
  const revBtn = K.tool('كشف الإجابة', 'كشف الإجابة', () => finishRound(true));
  revBtn.classList.add('round-tool', 'hide-present');
  K.addTool(hintBtn); K.addTool(revBtn);
}

function answer(btn, opt, picks) {
  if (opt.n === cur.n) {
    btn.classList.add('right'); K.SFX.win(); K.praise();
    finishRound(false);
  } else {
    btn.classList.add('wrong', 'shake'); K.SFX.soft(); K.encourage();
    setTimeout(() => btn.classList.remove('shake'), 420);
  }
}

function finishRound(revealAnswer) {
  document.querySelectorAll('#tiles button').forEach((b, i) =>
    setTimeout(() => b.classList.add('off'), i * 45));
  document.querySelectorAll('.picks .btn').forEach(b => b.disabled = true);
  if (revealAnswer) K.say('الإجابة: ' + cur.n, 'info');

  const nx = K.el('div', '', '');
  nx.style.cssText = 'display:flex;gap:12px;justify-content:center;margin-top:8px';
  const b = K.el('button', 'btn p big', round < ROUNDS ? 'الجولة التالية ←' : 'ختام النشاط ←');
  b.onclick = () => {
    K.SFX.tap();
    if (round < ROUNDS) play();
    else K.reflect({
      value: 'التأنّي قبل الحكم',
      questions: [
        'ما الدليل الذي جعلكم تُغيّرون تخمينكم؟',
        'هل حكمنا مرّةً قبل أن نرى كل شيء؟ ماذا حدث؟',
        'كيف نُطبّق «أفكّر قبل أن أحكم» مع زملائنا في المدرسة؟',
      ],
    }, home);
  };
  nx.appendChild(b);
  document.querySelector('.picks').after(nx);
}

home();
</script>
