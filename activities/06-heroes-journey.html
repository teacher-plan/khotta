<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>رحلة الأبطال</title>
<link rel="stylesheet" href="_kit.css"/>
<style>
#map{width:min(96vw,1100px);max-height:52vh}
#map svg{width:100%;height:auto;display:block}
.station{cursor:pointer}
.station .halo{opacity:0;transition:opacity .2s}
.station.next .halo{opacity:1;animation:pulse 1.6s infinite}
.station.done .halo{opacity:0}
.q{max-width:980px;width:100%;text-align:center;animation:up .35s both}
.q .txt{font-size:clamp(21px,3vw,38px);font-weight:800;line-height:1.5;background:var(--paper);
  border:4px solid var(--ink);border-radius:20px;box-shadow:var(--sh);
  padding:clamp(18px,2.8vw,36px);margin-bottom:16px}
.q .tag2{margin-bottom:10px;display:inline-flex}
.opts2{display:grid;gap:11px;max-width:820px;margin:0 auto}
.opts2 .btn{justify-content:flex-start;text-align:start;font-size:clamp(16px,2vw,22px);min-height:62px}
.opts2 .btn.right{background:var(--ok);color:#fff}
.opts2 .btn.off{opacity:.45;pointer-events:none}
.rowline{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<script src="_kit.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   النشاط ٦ — رحلة الأبطال
   الهدف: التعاون وحل المشكلات عبر خريطة مغامرةٍ بخمس محطات.
   القرار التصميمي: الخريطة هي الشاشة الرئيسة والتقدّم عليها مرئيّ —
   العلمُ يتحرّك محطةً محطة. الحافز هو «أين وصلنا» لا النقاط وحدها،
   والكنز يُفتح فقط باكتمال المحطات الأربع كلّها.
   ═══════════════════════════════════════════════════════════════════ */
const STATIONS = [
  {id:'know', name:'محطة المعرفة', icon:'📚', color:'#487848', x:255, y:465,
   tasks:[
    {t:'ما الكوكب الذي نعيش عليه؟', o:['الأرض','القمر','المرّيخ'], a:0},
    {t:'كم عدد أيام الأسبوع؟', o:['خمسة','سبعة','عشرة'], a:1},
    {t:'ما الحيوان الذي يُسمّى سفينة الصحراء؟', o:['الحصان','الفيل','الجمل'], a:2},
   ]},
  {id:'coop', name:'محطة التعاون', icon:'🤝', color:'#2F7D74', x:555, y:300,
   tasks:[
    {t:'تحدٍّ جماعي: يقف الفريق ويشكّل دائرةً متشابكة الأيدي في ١٠ ثوانٍ دون كلام!', o:['أنجزناه! ✔'], a:0, doing:true},
    {t:'تحدٍّ جماعي: يرتّب الفريق نفسه حسب أطوال الأسماء (الأقصر أولاً) بالهمس فقط', o:['أنجزناه! ✔'], a:0, doing:true},
    {t:'تحدٍّ جماعي: يعدّ الفريق من ١ إلى ١٠ — كل عددٍ بصوت طالبٍ مختلف دون اتفاقٍ مسبق، وإن تكلّم اثنان معاً يبدأون من جديد', o:['أنجزناه! ✔'], a:0, doing:true},
   ]},
  {id:'value', name:'محطة القيم', icon:'💛', color:'#D9A93C', x:875, y:470,
   tasks:[
    {t:'وجد زميلكم قلماً على الأرض. ما تصرّف البطل؟', o:['يحتفظ به','يُسلّمه للمعلّمة','يتركه مكانه'], a:1},
    {t:'أخطأ عضوٌ في فريقكم فخسرتم نقطة. ماذا يقول الفريق؟', o:['«حاولتَ، ونكمل معاً»','«أنت السبب!»','لا نقول شيئاً'], a:0},
    {t:'انتهيتم من عملكم قبل الجميع. ما تصرّف الأبطال؟', o:['نلعب ونضحك بصوتٍ عالٍ','نساعد فريقاً لم ينتهِ','نتفاخر بسرعتنا'], a:1},
   ]},
  {id:'create', name:'محطة الإبداع', icon:'🎨', color:'#D86048', x:1180, y:315,
   tasks:[
    {t:'تحدٍّ إبداعي: يذكر كل فردٍ في الفريق استخداماً مختلفاً لصندوقٍ من الورق المقوّى', o:['أنجزناه! ✔'], a:0, doing:true},
    {t:'تحدٍّ إبداعي: يؤلّف الفريق معاً جملةً واحدة فيها: نجمة، مفتاح، ضحكة', o:['أنجزناه! ✔'], a:0, doing:true},
    {t:'تحدٍّ إبداعي: يرسم الفريق في الهواء — بأيديهم معاً — شكلاً يتّفقون عليه ويخمّنه باقي الصف', o:['أنجزناه! ✔'], a:0, doing:true},
   ]},
];
const TREASURE = { x: 1420, y: 520 };

/* خريطة الجزيرة: المحطات تُرسم برمجياً فوقها */
function mapSvg() {
  const st = STATIONS.map((s, i) => `
    <g class="station" id="st-${s.id}" transform="translate(${s.x} ${s.y})">
      <circle class="halo" r="64" fill="${s.color}" opacity=".35"/>
      <circle r="46" fill="${s.color}" stroke="#2A1503" stroke-width="5"/>
      <text y="16" font-size="44" text-anchor="middle">${s.icon}</text>
      <g class="tick" opacity="0"><circle cy="-38" cx="34" r="17" fill="#3E8E5A" stroke="#2A1503" stroke-width="4"/>
        <path d="M26 -40l6 7 11-13" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/></g>
      <text y="76" font-size="21" font-weight="bold" text-anchor="middle" fill="#2A1503">${s.name}</text>
    </g>`).join('');
  return `<svg viewBox="0 0 1600 660" aria-label="خريطة الرحلة">
    <defs><linearGradient id="sea6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FCBD8"/><stop offset="1" stop-color="#5FA8BC"/></linearGradient></defs>
    <rect width="1600" height="660" rx="26" fill="url(#sea6)" stroke="#2A1503" stroke-width="6"/>
    <path d="M120 480q140-240 420-260t520 60 420 100q60 20 60 80t-80 120q-260 60-660 50t-560-60q-140-40-120-90z"
      fill="#E8D9A8" stroke="#2A1503" stroke-width="6"/>
    <path d="M160 470q130-200 400-220" fill="none" stroke="#D9C68C" stroke-width="20" opacity=".6"/>
    <g stroke="#2A1503" stroke-width="5"><path d="M330 250v-60" fill="none"/>
      <circle cx="330" cy="160" r="38" fill="#5E9E52"/></g>
    <g stroke="#2A1503" stroke-width="5"><path d="M1290 210v-46" fill="none"/>
      <circle cx="1290" cy="136" r="30" fill="#6FAE5E"/></g>
    <g stroke="#2A1503" stroke-width="4" fill="#fff" opacity=".8">
      <ellipse cx="240" cy="90" rx="66" ry="28"/><ellipse cx="1100" cy="70" rx="82" ry="30"/></g>
    <!-- المسار المنقّط -->
    <path id="trail" d="M255 465Q400 340 555 300T875 470T1180 315T1420 520"
      fill="none" stroke="#8B2635" stroke-width="7" stroke-dasharray="2 22" stroke-linecap="round"/>
    <!-- الكنز -->
    <g id="chest" transform="translate(${TREASURE.x} ${TREASURE.y})">
      <g stroke="#2A1503" stroke-width="5">
        <rect x="-52" y="-24" width="104" height="62" rx="10" fill="#B0721A"/>
        <path d="M-52 -24a52 34 0 0 1 104 0z" fill="#8B5E34"/>
        <rect x="-10" y="-6" width="20" height="26" rx="4" fill="#E8C34A"/>
      </g>
      <g id="chest-glow" opacity="0">
        <path d="M0 -70l8 18 18 3-13 13 3 18-16-9-16 9 3-18-13-13 18-3z" fill="#E8C34A" stroke="#2A1503" stroke-width="3"/>
      </g>
      <text y="72" font-size="21" font-weight="bold" text-anchor="middle" fill="#2A1503">كنز النهاية</text>
    </g>
    ${st}
    <!-- علم التقدّم -->
    <g id="flag" transform="translate(255 465)">
      <path d="M0 -60V-120" stroke="#2A1503" stroke-width="6" stroke-linecap="round"/>
      <path d="M0 -120l46 14-46 14z" fill="#D86048" stroke="#2A1503" stroke-width="4"/>
    </g>
  </svg>`;
}

const SCENE = `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#CEE8EF"/><stop offset="1" stop-color="#F2E9D4"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#sky6)"/>
  <circle cx="1400" cy="130" r="64" fill="#FFD97A" stroke="#2A1503" stroke-width="5"/>
  <g fill="#fff" opacity=".8"><ellipse cx="320" cy="120" rx="90" ry="36"/><ellipse cx="900" cy="80" rx="70" ry="28"/></g>
</svg>`;

let K, teams, progress = {}, curStation = null, taskIdx = {}, answered = false;

K = Kit.build({
  title: 'رحلة الأبطال',
  accent: '#B0721A', accent2: '#8A5713',
  scene: SCENE,
  onRestart: () => home(),
  teacher: {
    goal: 'التعاون وحل المشكلات: يعبر الصف أربع محطاتٍ مختلفة الطبيعة — معرفة، تعاون حركي، قيم، إبداع — ولا يُفتح الكنز إلا باكتمالها كلّها.',
    tools: 'الشاشة. محطة التعاون تحتاج مساحةً آمنة للوقوف والحركة.',
    groups: 'فريقان إلى أربعة يتناوبون على مهام المحطة الواحدة، أو الصف كلّه كفريقٍ واحد في رحلةٍ مشتركة.',
    steps: [
      'اضغطي المحطة المضيئة على الخريطة لفتح مهامها الثلاث.',
      'وزّعي المهام على الفرق بالتناوب.',
      'مهام التعاون والإبداع تُنفَّذ بالأجساد والأصوات — اضغطي «أنجزناه» بعد التنفيذ الفعلي.',
      'باكتمال مهام المحطة يتقدّم العلم على الخريطة تلقائياً.',
      'بعد المحطات الأربع يُفتح الكنز — وفيه سؤال الرحلة الأخير.',
    ],
    time: '٢٠ إلى ٣٠ دقيقة للرحلة كاملة — أطول أنشطة القسم، مناسبةٌ لحصةٍ كاملة.',
    script: 'أبطالي! أمامنا جزيرةٌ فيها كنز… لكن لا يصل إليه إلا من عبر أربع محطات: المعرفة، والتعاون، والقيم، والإبداع. لا يسقط بطلٌ ولا يُترك فريق — نعبر معاً أو لا نعبر!',
    tips: 'لا تتجاوزي محطة التعاون لضيق الوقت — هي قلب النشاط. وإن تعثّر فريقٌ في مهمة، اسمحي لفريقٍ آخر «بإرسال بطلٍ مساعد» بدل إعطاء الحل.',
    points: 'النقاط للمحاولة والتعاون لا للصحّة وحدها: نقطة لكل مهمّة، ونقطة لكل «بطلٍ مساعد» يُعير فريقاً آخر.',
    levels: 'الأصغر: اقرئي الخيارات بصوتٍ عالٍ ونفّذي مهام التعاون بإيقاعٍ أبطأ. الأكبر: أضيفي قيد الصمت التام على مهام التعاون.',
    close: [
      'أيّ محطةٍ كانت الأصعب على الفريق؟ لماذا؟',
      'متى احتجنا بعضنا بعضاً أكثر؟',
      'ما «الكنز» الحقيقي الذي خرجنا به من الرحلة؟',
    ],
  },
});

function home() {
  progress = {}; taskIdx = {};
  STATIONS.forEach(s => { progress[s.id] = 0; taskIdx[s.id] = 0; });
  K.stage.innerHTML = '';
  const s = K.el('div', 'start');
  s.innerHTML = `
    <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M20 82q0-36 30-42t30 42" fill="#E8D9A8" stroke="#2A1503" stroke-width="5"/>
      <path d="M50 40V14" stroke="#2A1503" stroke-width="6" stroke-linecap="round"/>
      <path d="M50 14l28 9-28 9z" fill="#D86048" stroke="#2A1503" stroke-width="4"/>
      <path d="M28 78l10-8 10 8 10-8 10 8" stroke="#2A1503" stroke-width="4" fill="none"/>
    </svg>
    <h1>رحلة الأبطال</h1>
    <p class="sub">جزيرةٌ وكنز… وأربع محطاتٍ لا يعبرها إلا فريقٌ متعاون.</p>
    <div class="meta">
      <span class="chip">العمر: <b>٧ – ١٠ سنوات</b></span>
      <span class="chip">الزمن: <b>٢٠ – ٣٠ دقيقة</b></span>
      <span class="chip">الفرق: <b>٢ – ٤</b></span>
      <span class="chip">المهارة: <b>التعاون وحل المشكلات</b></span>
      <span class="chip">القيمة: <b>لا يُترك أحدٌ خلفنا</b></span>
    </div>`;
  const opts = K.el('div', 'card');
  opts.style.cssText = 'margin-bottom:22px;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap';
  opts.innerHTML = `<div style="font-weight:800">عدد الفرق</div><div id="tc" style="display:flex;gap:8px"></div>`;
  s.appendChild(opts);
  const go = K.el('div', 'go');
  const b1 = K.el('button', 'btn p big', 'ابدأ الرحلة');
  b1.onclick = () => { K.SFX.ok(); mapView(); };
  const b2 = K.el('button', 'btn big', 'تعليمات المعلّمة');
  b2.onclick = () => K.teacher.open();
  go.append(b1, b2); s.appendChild(go);
  K.stage.appendChild(s);

  let n = 2;
  const pick = () => {
    const host = opts.querySelector('#tc'); host.innerHTML = '';
    [2, 3, 4].forEach(v => {
      const b = K.el('button', 'btn sm' + (n === v ? ' p' : ''), Kit.AR(v));
      b.onclick = () => { n = v; K.SFX.tap(); pick(); };
      host.appendChild(b);
    });
  };
  pick();
  home.teamCount = () => n;
}

function doneCount() { return STATIONS.filter(s => progress[s.id] >= s.tasks.length).length; }

function mapView() {
  K.stage.innerHTML = '';
  const wrap = K.el('div', '');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:14px;width:100%';
  wrap.appendChild(K.el('div', 'rowline',
    `<span class="chip">المحطات المكتملة: <b>${Kit.AR(doneCount())} / ٤</b></span>`));
  const map = K.el('div', ''); map.id = 'map'; map.innerHTML = mapSvg();
  wrap.appendChild(map);
  const teamsBox = K.el('div', 'teams'); wrap.appendChild(teamsBox);
  K.stage.appendChild(wrap);

  if (!teams) teams = K.Teams(teamsBox, home.teamCount ? home.teamCount() : 2);
  else teams.mount(teamsBox);
  wrap.appendChild(K.valuesRow(teams, [
    [1, 'بطلٌ ساعد فريقاً آخر'], [1, 'تعاونٌ جميل'], [1, 'تشجيعٌ عند التعثّر'],
  ]));

  // حالة المحطات: المنجزة عليها علامة، والتالية تتوهّج، والبعيدة تنتظر
  let nextFound = false;
  STATIONS.forEach(s => {
    const g = map.querySelector('#st-' + s.id);
    const done = progress[s.id] >= s.tasks.length;
    if (done) { g.classList.add('done'); g.querySelector('.tick').setAttribute('opacity', '1'); }
    else if (!nextFound) { g.classList.add('next'); nextFound = true; }
    g.addEventListener('click', () => { if (!done) { K.SFX.tap(); openStation(s); } });
  });

  // العلم يقف عند آخر محطةٍ مكتملة (أو البداية)
  const flag = map.querySelector('#flag');
  const dc = doneCount();
  const pos = dc === 0 ? STATIONS[0] : (dc >= 4 ? TREASURE : STATIONS[dc]);
  flag.setAttribute('transform', `translate(${pos.x} ${pos.y - (pos === TREASURE ? 40 : 0)})`);

  if (dc >= 4) {
    map.querySelector('#chest-glow').setAttribute('opacity', '1');
    const open = K.el('button', 'btn p big', '🗝️ افتحوا الكنز!');
    open.onclick = () => treasure();
    wrap.insertBefore(open, teamsBox);
    K.SFX.win();
  }
}

function openStation(s) {
  curStation = s;
  showTask();
}

function showTask() {
  const s = curStation;
  const i = taskIdx[s.id];
  const task = s.tasks[i];
  answered = false;
  K.stage.innerHTML = '';
  const wrap = K.el('div', 'q');
  wrap.innerHTML = `<span class="chip tag2" style="border-color:${s.color}">${s.icon} ${Kit.esc(s.name)} — المهمّة <b>${Kit.AR(i + 1)} / ${Kit.AR(s.tasks.length)}</b></span>
    <div class="txt">${Kit.esc(task.t)}</div>`;
  const box = K.el('div', 'opts2');
  task.o.forEach((o, j) => {
    const b = K.el('button', 'btn', Kit.esc(o));
    b.onclick = () => {
      if (answered) return;
      if (j === task.a) {
        answered = true;
        b.classList.add('right');
        [...box.children].forEach(x => { if (x !== b) x.classList.add('off'); });
        task.doing ? K.SFX.win() : (K.SFX.ok(), K.praise());
        progress[s.id]++;
        const nx = K.el('button', 'btn p big',
          progress[s.id] >= s.tasks.length ? '🚩 اكتملت المحطة — إلى الخريطة!' : 'المهمّة التالية ←');
        nx.style.marginTop = '16px';
        nx.onclick = () => {
          K.SFX.tap();
          if (progress[s.id] >= s.tasks.length) mapView();
          else { taskIdx[s.id]++; showTask(); }
        };
        wrap.appendChild(nx);
      } else {
        b.classList.add('shake'); K.SFX.soft(); K.encourage();
        setTimeout(() => b.classList.remove('shake'), 420);
      }
    };
    box.appendChild(b);
  });
  wrap.appendChild(box);
  const back = K.el('button', 'btn sm hide-present', '← العودة للخريطة');
  back.style.marginTop = '18px';
  back.onclick = () => { K.SFX.tap(); mapView(); };
  wrap.appendChild(back);
  K.stage.appendChild(wrap);
}

function treasure() {
  K.SFX.win();
  K.reflect({
    value: 'لا يُترك أحدٌ خلفنا',
    questions: [
      'عبرنا الجزيرة كلّها — أيّ محطةٍ احتاجت الفريق كلّه فعلاً؟',
      'ما «الكنز» الحقيقي الذي خرجنا به من الرحلة؟',
      'كيف نتصرّف غداً حين يتعثّر زميلٌ في مهمّة؟',
    ],
  }, home);
}

home();
</script>
</body>
</html>
