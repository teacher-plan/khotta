<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>الكتاب التفاعلي — نموذج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Amiri:wght@700&display=swap">
<style>
:root{--ink:#16302a;--brand:#1F5F4E;--brand2:#2f8a6f;--gold:#d9a441;--paper:#f6f3ec;--bg:#e9e4d8;--hl:#ffcf4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
/* شريط علوي */
.top{position:fixed;inset:0 0 auto 0;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--brand);color:#fff;z-index:30}
.top h1{font-size:17px;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.top small{opacity:.8;font-weight:500;margin-inline-start:6px}
.tb{display:flex;gap:6px}
.tb button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:7px 11px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tb button.on{background:var(--hl);color:#3a2a00}
.tb button span{font-size:16px}
/* المسرح */
.stage{position:fixed;inset:58px 0 64px 0;display:flex;align-items:center;justify-content:center;perspective:2400px}
.book{position:relative;display:flex;flex-direction:row;box-shadow:0 18px 50px rgba(30,40,30,.28);border-radius:4px;background:#fff}
.book::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:36px;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,0) 0,rgba(0,0,0,.13) 45%,rgba(0,0,0,.2) 50%,rgba(0,0,0,.13) 55%,rgba(0,0,0,0) 100%);z-index:4}
.book.single::after{display:none}
.pg{position:relative;width:var(--pw);height:var(--ph);background:#fff center/100% 100% no-repeat;overflow:hidden}
.pg.blank{background:var(--paper)}
/* الورقة التي تنقلب */
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:6;transition:transform .85s cubic-bezier(.45,.05,.25,1)}
.leaf>div{position:absolute;inset:0;backface-visibility:hidden;background:#fff center/100% 100% no-repeat}
.leaf>.b{transform:rotateY(180deg)}
.leaf>div::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 30%);opacity:0;transition:opacity .85s}
.leaf.go>div::after{opacity:1}
/* النقاط التفاعلية */
.hs{position:absolute;border-radius:10px;border:2.5px dashed transparent;transition:background .2s,border-color .2s;cursor:pointer;z-index:2}
.show-hs .hs{border-color:rgba(31,95,78,.55);background:rgba(47,138,111,.07)}
.hs:hover{background:rgba(255,207,74,.18);border-color:var(--gold)}
.hs .dot{position:absolute;top:-13px;inset-inline-start:-13px;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.show-hs .hs .dot{animation:pulse 2.2s infinite}
.hs:not(.blank) .dot{display:none}.show-hs .hs .dot{display:grid}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,95,78,.45)}60%{box-shadow:0 0 0 10px rgba(31,95,78,0)}}
/* الفراغات: الإجابة تُكتب على الصفحة نفسها */
.hs.blank{border-style:dashed}
.hs.blank .ans{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 4px;
  font-weight:800;color:#0d6b4f;background:#fffdf3;border-radius:9px;line-height:1.15;opacity:0;transform:scale(.6);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.hs.blank.open .ans{opacity:1;transform:none;box-shadow:0 0 0 2px #0d6b4f inset}
.hs.blank.open .dot{display:none}
.hs.img{border-radius:50%}
.hs.img .ans{inset:auto -6% 4% -6%;padding:4px 6px;border-radius:10px;background:rgba(255,253,243,.97);min-height:0}
.hs.stamp .ans{background:transparent!important;box-shadow:none!important;color:#c0392b;font-size:1.25em}
.hs.stamp.ok .ans{color:#0d8a4f}
/* الستارة */
.curtain{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,#24453c,#24453c 14px,#2a5046 14px,#2a5046 28px);z-index:5;display:none;touch-action:none}
.curtain.on{display:block}
.curtain i{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:var(--gold);color:#3a2a00;border-radius:12px 12px 0 0;padding:3px 18px;font-style:normal;font-weight:800;font-size:13px;cursor:ns-resize;white-space:nowrap}
/* الشريط السفلي */
.nav{position:fixed;inset:auto 0 0 0;height:64px;display:flex;align-items:center;justify-content:center;gap:14px;z-index:30}
.nav button{width:52px;height:46px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-size:22px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.nav button:disabled{opacity:.3}
.nav .pn{background:#fff;border-radius:14px;padding:9px 16px;font-weight:800;min-width:120px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.dots{display:flex;gap:6px}
.dots b{width:9px;height:9px;border-radius:50%;background:#c3bba8}.dots b.on{background:var(--brand);width:22px;border-radius:6px}
/* لوحة التركيز */
.fx{position:fixed;inset:0;background:rgba(10,22,18,.82);z-index:50;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.fx.on{display:flex}
.fx-card{background:#fff;border-radius:22px;max-width:1100px;width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.fx-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--brand);color:#fff}
.fx-h b{flex:1;font-size:19px}
.fx-h button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:20px}
.fx-b{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.crop{width:100%;border-radius:12px;background-repeat:no-repeat;box-shadow:0 0 0 1px #e3ddd0;position:relative}
.fx-acts{display:flex;flex-wrap:wrap;gap:8px}
.fx-acts button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;font-size:16px;background:#eef4f1;color:var(--brand)}
.fx-acts button.go{background:var(--brand);color:#fff}
.ansbox{background:#f1f8f4;border-inline-start:6px solid var(--brand2);border-radius:12px;padding:14px 16px;font-size:21px;line-height:1.9;font-weight:700}
.ansbox ol{margin:0;padding-inline-start:26px}
.ansbox .lbl{display:block;font-size:14px;color:#5b6f68;font-weight:800;margin-bottom:2px}
.step{opacity:0;transform:translateY(8px);transition:all .35s}.step.in{opacity:1;transform:none}
.hidden{display:none!important}
/* التحفيظ */
.memo{font-family:Amiri,serif;font-size:clamp(28px,4.2vw,50px);line-height:2;text-align:center;padding:10px 6px;color:#123}
.memo .w{display:inline-block;margin:0 .14em;padding:0 .12em;border-radius:10px;transition:all .3s;cursor:pointer}
.memo .w.hid{color:transparent;background:#e2ddd0;min-width:2.2em;box-shadow:inset 0 -4px 0 #cfc7b4}
.memo .w.hid:hover{background:#d8d0bd}
.memo small{display:block;font-family:Tajawal;font-size:17px;color:#5b6f68;line-height:1.6}
.lvl{display:flex;gap:6px;justify-content:center}
.lvl button{border:2px solid #d6e5de;background:#fff;border-radius:12px;padding:8px 14px;font-weight:800;color:var(--brand)}
.lvl button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* أدوات عائمة */
.chip{position:fixed;z-index:60;bottom:76px;inset-inline-start:14px;background:#fff;border-radius:16px;box-shadow:0 8px 26px rgba(0,0,0,.2);padding:10px 14px;display:none;align-items:center;gap:10px;font-weight:800}
.chip.on{display:flex}
.chip .big{font-size:30px;color:var(--brand);min-width:84px;text-align:center}
.chip button{border:0;background:#eef4f1;color:var(--brand);border-radius:10px;padding:6px 10px;font-weight:800}
#pick .big{font-size:26px;min-width:150px}
.pick-roll{animation:roll .09s linear infinite}@keyframes roll{50%{opacity:.4}}
.legend{position:fixed;z-index:31;bottom:8px;inset-inline-start:12px;background:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.1);max-width:300px;line-height:1.5;font-size:12px}
.legend b{color:var(--brand)}
.legend button{border:0;background:none;color:#999;float:left;font-size:16px;padding:0 0 0 4px}
@media (max-width:1100px){.legend{display:none}}
@media (max-width:760px){.top h1 small,.tb button em{display:none}.tb button{padding:7px 9px}.legend{display:none}}
</style>
</head>
<body class="show-hs">
<div class="top">
  <h1>الأعمال بالنيات <small>التربية الإسلامية · الصف السابع</small></h1>
  <div class="tb">
    <button id="b-hs" class="on" onclick="toggleHs()" title="إظهار النقاط التفاعلية"><span>✨</span><em>التفاعلات</em></button>
    <button id="b-cur" onclick="toggleCurtain()" title="ستارة تُخفي جزءاً من الصفحة"><span>🎭</span><em>الستارة</em></button>
    <button onclick="pickStudent()" title="اختيار طالب عشوائي"><span>🎲</span><em>طالب</em></button>
    <button onclick="startTimer(60)" title="مؤقّت دقيقة"><span>⏱</span><em>مؤقّت</em></button>
  </div>
</div>
<div class="legend" id="legend"><button onclick="this.parentNode.remove()">✕</button>المس أي <b>إطار منقّط</b>: السؤال يكبر أمام الصف مع الإجابة، والفراغات تمتلئ على الصفحة نفسها، والحديث يتحوّل إلى تحفيظ. اسحب الصفحة أو استعمل الأسهم للتقليب.</div>
<div class="stage" id="stage"><div class="book" id="book"></div></div>
<div class="nav">
  <button id="nx" onclick="flip(1)" aria-label="التالي">‹</button>
  <div class="pn" id="pn"></div>
  <button id="pv" onclick="flip(-1)" aria-label="السابق">›</button>
</div>
<div class="fx" id="fx" onclick="if(event.target===this)closeFx()"><div class="fx-card" id="fxc"></div></div>
<div class="chip" id="timer"><span>⏱</span><span class="big" id="tm">١:٠٠</span><button onclick="startTimer(60)">١ د</button><button onclick="startTimer(180)">٣ د</button><button onclick="stopTimer()">✕</button></div>
<div class="chip" id="pick" style="inset-inline-start:auto;inset-inline-end:14px"><span>🎲</span><span class="big" id="pk"></span><button onclick="pickStudent()">آخر</button><button onclick="document.getElementById('pick').classList.remove('on')">✕</button></div>

<script>
const R2='https://files.khotati.com/library-files/books/manual-43ccf6a154/p';
const W=910,H=1213;
const STUDENTS=['أحمد','محمد','سالم','خالد','يوسف','عبدالله','حمد','سعيد','مازن','فهد','إبراهيم','عمر','زياد','هيثم','أنس'];
// [x0,y0,x1,y1] بكسل على صفحة 910×1213
const PAGES=[
 {n:33,sheet:35,hs:[
   {t:'spot',r:[222,328,790,766],title:'أتأمّل وأناقش',steps:[
     ['١) لماذا اشترى الرجل السِّلال كلّها؟','ليساعد البائع ويُدخل السرور عليه، ناوياً بذلك الإحسان إليه وطلب الأجر من الله تعالى.'],
     ['٢) ماذا تقترح على والدك؟','أن نحتسب الأجر ونجعل نيّتنا إعانة البائع، فنُؤجر على نيّتنا الطيبة إضافةً إلى الشراء.']]},
   {t:'memo',r:[58,838,852,1018],title:'أفهم وأحفظ',chain:'أبو عُبيدة عن جابر بن زيد عن عبد الله بن عبّاس عن النبيّ ﷺ قال:',
     text:'«الأعمالُ بالنِّيّاتِ، ولكلِّ امرئٍ ما نوى»',src:'الربيع، المسند، كتاب الإيمان، باب في النية، رقم ١'},
   {t:'spot',r:[64,1072,790,1132],title:'أتعرّف المعنى',steps:[['النِّيّات','جمعُ نيّة، وهي قصدُ الإنسان المقترنُ بفعله.']]},
 ]},
 {n:34,sheet:36,hs:[
   {t:'spot',r:[70,108,840,412],title:'أعجبتني شخصية',steps:[['عبد الله بن عباس رضي الله عنهما',
     'عاصر النبيّ ﷺ فترةً قصيرة، وكان قريباً من عمري عند وفاته ﷺ. لُقّب بترجمان القرآن وحَبر الأمّة، وكان من المكثرين في رواية الحديث.']]},
   {t:'spot',r:[28,430,880,1040],title:'أقرأ وأتعلّم — الأفكار الرئيسة',list:[
     'الحديث أصلٌ من أصول الدين، يتعلّق بإصلاح الجانب الباطني للإنسان.',
     'النيّة أساس قبول العمل أو ردّه.',
     'النيّة الخالصة لله: يُقبل العمل ويُؤجر صاحبه. الرياء والشهرة: يُردّ العمل ويأثم صاحبه.',
     'بالنيّة تتميّز العبادات بعضها من بعض: الفرض من الفرض، والفرض من السنّة.',
     'من اعتاد عملاً صالحاً ثم منعه عذر، يستمرّ أجره بنيّته.',
     'النيّة الصالحة تحوّل المباحات والعادات إلى طاعاتٍ وعبادات.']},
 ]},
 {n:35,sheet:37,hs:[
   {t:'spot',r:[58,348,790,582],title:'أتعاون مع زملائي — الحديث',steps:[['المطلوب','نفهم الحديث، ثم نكمل الشكل أسفل الصفحة: المس كل فراغٍ لتظهر إجابته على الصفحة.']]},
   {t:'blank',r:[158,924,312,964],a:'سيّئة',fs:22},
   {t:'blank',r:[620,1058,786,1106],a:'عشر حسنات إلى ٧٠٠ ضعف',fs:15},
   {t:'blank',r:[434,1058,600,1106],a:'حسنة كاملة',fs:19},
   {t:'blank',r:[246,1058,412,1106],a:'سيّئة واحدة',fs:19},
   {t:'blank',r:[60,1058,224,1106],a:'حسنة كاملة',fs:19},
 ]},
 {n:36,sheet:38,hs:[
   {t:'blank',r:[262,292,468,428],a:'أنام بنيّة التقوّي على صلاة الفجر',fs:15,img:1},
   {t:'blank',r:[505,282,650,452],a:'أسقي النبتة بنيّة نفع الخلق',fs:14,img:1},
   {t:'blank',r:[596,440,768,578],a:'أتريّض بنيّة تقوية جسدي للطاعة',fs:14,img:1},
   {t:'blank',r:[498,586,676,708],a:'آكل بنيّة التقوّي على العبادة',fs:14,img:1},
   {t:'blank',r:[318,596,474,706],a:'أغتسل بنيّة الطهارة',fs:14,img:1},
   {t:'blank',r:[166,452,376,570],a:'أذهب إلى المدرسة بنيّة طلب العلم',fs:15,img:1},
   {t:'spot',r:[404,450,600,580],title:'قال تعالى',steps:[['﴿قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ﴾','حياة المسلم كلّها — عباداته وعاداته — يمكن أن تكون لله إذا صلحت النيّة.']]},
   {t:'blank',r:[205,962,288,1008],a:'✗',fs:30,stamp:1},
   {t:'blank',r:[125,962,204,1008],a:'القلب',fs:19},
   {t:'blank',r:[205,1014,288,1102],a:'✓',fs:34,stamp:1,ok:1},
 ]},
 {n:37,sheet:39,hs:[
   {t:'blank',r:[62,168,786,262],a:'النيّة أساس قبول العمل: إن خلصت لله قُبل العمل وأُثيب صاحبه، وإن كانت رياءً رُدّ العمل؛ فكلّ امرئٍ يُجزى بنيّته.',fs:19},
   {t:'blank',r:[60,384,230,430],a:'تزكية النفس',fs:18},
   {t:'blank',r:[60,434,230,480],a:'الاستعاذة بالله',fs:17},
   {t:'blank',r:[60,484,230,532],a:'مراقبة الله',fs:17},
   {t:'spot',r:[60,555,790,1110],title:'رابعاً: ما توجيهك؟',steps:[
     ['توجيه مقترح','أذكّرهم بأن «الأعمال بالنيات»، وأن التباهي والتفاخر رياءٌ يُذهب الأجر.'],
     ['ماذا يفعلون بدلاً من ذلك؟','يشكرون الله على نعمه، ويُظهرونها بلا تفاخر، ويراعون مشاعر المحتاجين.']]},
 ]},
];
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const url=p=>R2+p.sheet+'.jpg';
let at=0,busy=false,single=false,pw=0,ph=0;
// النشرات: الصفحة الأولى يميناً ثم ما يقابلها يساراً (كتاب عربي)
function spreads(){if(single)return PAGES.map((_,i)=>[i]);const s=[];for(let i=0;i<PAGES.length;i+=2)s.push([i,i+1]);return s;}
function measure(){
  single=innerWidth<760||innerWidth<innerHeight*0.95;
  const aw=innerWidth-24,ah=innerHeight-58-64-16,r=W/H,cols=single?1:2;
  ph=Math.min(ah,aw/cols/r);pw=ph*r;
  document.documentElement.style.setProperty('--pw',pw+'px');document.documentElement.style.setProperty('--ph',ph+'px');
}
function pageEl(i){
  const d=document.createElement('div');d.className='pg';
  const p=PAGES[i];if(!p){d.classList.add('blank');return d;}
  d.style.backgroundImage=`url(${url(p)})`;d.dataset.i=i;
  p.hs.forEach((h,k)=>{
    const e=document.createElement('div');e.className='hs'+(h.t==='blank'?' blank':'')+(h.img?' img':'')+(h.stamp?' stamp':'')+(h.ok?' ok':'');
    const[x0,y0,x1,y1]=h.r;Object.assign(e.style,{right:((W-x1)/W*100)+'%',top:(y0/H*100)+'%',width:((x1-x0)/W*100)+'%',height:((y1-y0)/H*100)+'%'});
    e.innerHTML=`<span class="dot">${h.t==='memo'?'📖':h.t==='blank'?'✎':'🔍'}</span>`+(h.t==='blank'?`<div class="ans" data-fs="${h.fs*ph/H*1.25}">${h.a}</div>`:'');
    if(h.open)e.classList.add('open');
    e.onclick=ev=>{ev.stopPropagation();if(h.t==='blank'){h.open=!h.open;e.classList.toggle('open',h.open);fitAns(e);}else openFx(p,h);};
    d.appendChild(e);
  });
  const c=document.createElement('div');c.className='curtain'+(curtain?' on':'');c.style.height=curH+'%';c.innerHTML='<i>⇕ اسحب الستارة</i>';d.appendChild(c);curtainDrag(c);
  return d;
}
// يصغّر خط الإجابة حتى تتّسع في فراغها
function fitAns(root){(root||document).querySelectorAll('.ans').forEach(a=>{let f=+a.dataset.fs;a.style.fontSize=f+'px';
  const box=a.parentNode,img=box.classList.contains('img');let k=0;
  while(k++<30&&f>7&&(a.scrollWidth>a.clientWidth+1||(img?a.offsetHeight>box.offsetHeight*.62:a.scrollHeight>a.clientHeight+1))){f*=.92;a.style.fontSize=f+'px';}});}
function render(){
  measure();const S=spreads();at=Math.min(at,S.length-1);
  const b=document.getElementById('book');b.innerHTML='';b.classList.toggle('single',single);
  S[at].forEach(i=>b.appendChild(pageEl(i)));
  const s=S[at].filter(i=>PAGES[i]).map(i=>ar(PAGES[i].n));
  document.getElementById('pn').textContent='صفحة '+s.join(' – ');
  requestAnimationFrame(()=>fitAns(b));document.getElementById('pv').disabled=at<=0;document.getElementById('nx').disabled=at>=S.length-1;
}
// التقليب: الورقة اليسرى (التالي) تنثني على الكعب نحو اليمين
function flip(d){
  const S=spreads();const n=at+d;if(busy||n<0||n>=S.length)return;
  const b=document.getElementById('book');
  if(single){busy=true;b.style.transition='transform .35s,opacity .35s';b.style.transform=`translateX(${d*-40}px)`;b.style.opacity=0;
    setTimeout(()=>{at=n;render();b.style.transition='none';b.style.transform=`translateX(${d*40}px)`;requestAnimationFrame(()=>{b.style.transition='transform .35s,opacity .35s';b.style.transform='';b.style.opacity=1;busy=false;});},330);return;}
  busy=true;
  const cur=S[at],nxt=S[n];
  const leaf=document.createElement('div');leaf.className='leaf';
  const front=PAGES[d>0?cur[1]:cur[0]],back=PAGES[d>0?nxt[0]:nxt[1]];
  leaf.innerHTML=`<div class="f" style="background-image:${front?`url(${url(front)})`:'none'}"></div><div class="b" style="background-image:${back?`url(${url(back)})`:'none'}"></div>`;
  // التالي: الورقة على اليسار، مفصلها يمينها (الكعب). السابق: الورقة يميناً، مفصلها يسارها.
  if(d>0){leaf.style.left='0';leaf.style.transformOrigin='right center';}else{leaf.style.left=pw+'px';leaf.style.transformOrigin='left center';}
  // ما تحت الورقة: الصفحة المقابلة من النشرة الجديدة
  const pgs=b.querySelectorAll('.pg');const under=d>0?pgs[1]:pgs[0];const ui=d>0?nxt[1]:nxt[0];
  const nu=pageEl(ui);under.replaceWith(nu);
  b.appendChild(leaf);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{leaf.classList.add('go');leaf.style.transform=`rotateY(${d>0?180:-180}deg)`;}));
  setTimeout(()=>{at=n;render();busy=false;},880);
}
// السحب للتقليب
let sx=null;
document.getElementById('stage').addEventListener('pointerdown',e=>{if(e.target.closest('.hs,.curtain'))return;sx=e.clientX;});
addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)flip(dx>0?1:-1);});
addEventListener('keydown',e=>{if(document.getElementById('fx').classList.contains('on')){if(e.key==='Escape')closeFx();return;}
  if(e.key==='ArrowLeft')flip(1);if(e.key==='ArrowRight')flip(-1);});
addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(render,120);});
function toggleHs(){document.body.classList.toggle('show-hs');document.getElementById('b-hs').classList.toggle('on');}
// الستارة
let curtain=false,curH=55;
function toggleCurtain(){curtain=!curtain;document.getElementById('b-cur').classList.toggle('on',curtain);document.querySelectorAll('.curtain').forEach(c=>c.classList.toggle('on',curtain));}
function curtainDrag(c){const h=c.querySelector('i');h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();h.setPointerCapture(e.pointerId);
  const pg=c.parentNode;const mv=ev=>{const r=pg.getBoundingClientRect();curH=Math.max(4,Math.min(100,(r.bottom-ev.clientY)/r.height*100));document.querySelectorAll('.curtain').forEach(x=>x.style.height=curH+'%');};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);};h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);};}
// لوحة التركيز: المنطقة مكبّرة من الصفحة نفسها + الإجابة خطوة خطوة
function cropHtml(p,h,maxW){
  const[x0,y0,x1,y1]=h.r,w=x1-x0,hh=y1-y0;
  const maxH=innerHeight*.5;const s=Math.min(maxW/w,maxH/hh,2.4);
  return `<div class="crop" style="width:${w*s}px;height:${hh*s}px;margin:auto;background-image:url(${url(p)});background-size:${W*s}px ${H*s}px;background-position:${-x0*s}px ${-y0*s}px"></div>`;
}
function openFx(p,h){
  const fx=document.getElementById('fx'),c=document.getElementById('fxc');
  const mw=Math.min(1100,innerWidth-36)-32;
  let body='';
  if(h.t==='memo'){
    const words=h.text.split(/\s+/);
    body=`<div class="memo" id="memo"><small>${h.chain}</small>${words.map((w,i)=>`<span class="w" data-i="${i}">${w}</span>`).join(' ')}<small>${h.src}</small></div>
      <div class="lvl" id="lvl">${['اقرأ','أخفِ بعضها','أخفِ أكثر','غيباً'].map((t,i)=>`<button class="${i?'':'on'}" onclick="memoLevel(${i})">${t}</button>`).join('')}</div>
      <p style="text-align:center;margin:0;color:#5b6f68;font-weight:700">المس الكلمة المخفية لتظهر بعد أن يقولها الطلاب.</p>`;
  }else{
    const items=h.list?h.list.map((t,i)=>`<li class="step" data-s="${i}">${t}</li>`).join(''):'';
    body=cropHtml(p,h,mw)+`<div class="fx-acts"><button class="go" id="nxs" onclick="nextStep()">${h.list?'أظهر الفكرة التالية':'أظهر الإجابة'}</button><button onclick="showAll()">أظهر الكل</button><button onclick="pickStudent()">🎲 من يجيب؟</button><button onclick="startTimer(60)">⏱ دقيقة للتفكير</button></div>`
      +(h.list?`<div class="ansbox"><ol>${items}</ol></div>`:h.steps.map((s,i)=>`<div class="ansbox step" data-s="${i}"><span class="lbl">${s[0]}</span>${s[1]}</div>`).join(''));
  }
  c.innerHTML=`<div class="fx-h"><b>${h.title}</b><button onclick="closeFx()" aria-label="إغلاق">✕</button></div><div class="fx-b">${body}</div>`;
  fx.classList.add('on');
  if(h.t==='memo')document.querySelectorAll('#memo .w').forEach(w=>w.onclick=()=>w.classList.remove('hid'));
}
function nextStep(){const s=[...document.querySelectorAll('#fxc .step:not(.in)')];if(s[0]){s[0].classList.add('in');s[0].scrollIntoView({behavior:'smooth',block:'nearest'});}
  if(s.length<=1){const b=document.getElementById('nxs');if(b)b.classList.add('hidden');}}
function showAll(){document.querySelectorAll('#fxc .step').forEach(s=>s.classList.add('in'));const b=document.getElementById('nxs');if(b)b.classList.add('hidden');}
function closeFx(){document.getElementById('fx').classList.remove('on');}
function memoLevel(l){
  document.querySelectorAll('#lvl button').forEach((b,i)=>b.classList.toggle('on',i===l));
  const ws=[...document.querySelectorAll('#memo .w')].filter(w=>w.textContent.trim().length>1);
  const keep=[0,.35,.65,1][l];
  // إخفاءٌ ثابت النمط: كل مستوى يُخفي ما أخفاه الذي قبله وزيادة
  const order=ws.map((w,i)=>[w,(i*7+3)%ws.length]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]);
  ws.forEach(w=>w.classList.remove('hid'));order.slice(0,Math.round(order.length*keep)).forEach(w=>w.classList.add('hid'));
}
// مؤقّت واختيار طالب
let tmI=null,tmS=0;
function fmt(s){return ar(Math.floor(s/60))+':'+ar(String(s%60).padStart(2,'0'));}
function startTimer(s){clearInterval(tmI);tmS=s;const el=document.getElementById('tm');document.getElementById('timer').classList.add('on');el.style.color='';el.textContent=fmt(tmS);
  tmI=setInterval(()=>{tmS--;el.textContent=fmt(Math.max(0,tmS));if(tmS<=10)el.style.color='#c0392b';if(tmS<=0){clearInterval(tmI);el.textContent='انتهى!';}},1000);}
function stopTimer(){clearInterval(tmI);document.getElementById('timer').classList.remove('on');}
function pickStudent(){const c=document.getElementById('pick'),k=document.getElementById('pk');c.classList.add('on');k.classList.add('pick-roll');let n=0;
  const t=setInterval(()=>{k.textContent=STUDENTS[Math.floor(Math.random()*STUDENTS.length)];if(++n>14){clearInterval(t);k.classList.remove('pick-roll');}},70);}
// تحميل مسبق
PAGES.forEach(p=>{const i=new Image();i.src=url(p);});
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitAns());
</script>
