<!-- قالب: تأكيد البريد عند إنشاء الحساب (Confirm signup)
     يُلصَق في: لوحة سوبابيز ← Authentication ← Emails ← Confirm signup
     العنوان (Subject): تأكيد بريدكِ — منصّة خُطّة

     متى يُرسَل؟ زرّا «توليد حساب» و«إنشاء حساب مخصص» في صفحة الإحالات
     يستعملان signUp، وهو يُرسل هذه الرسالة إن كان تأكيد البريد مفعَّلاً في
     المشروع. أمّا «تفعيل الحساب» فلا يرسلها لأنه يُنشئ الحساب مؤكَّداً أصلاً
     (email_confirm) ويرسل بيانات الدخول مباشرةً. -->
<!doctype html><html lang="ar" dir="rtl"><body style="margin:0;background:#F3EDE3;font-family:Tahoma,Arial,sans-serif;color:#2A1503">
<div style="max-width:520px;margin:24px auto;background:#FFFDF9;border:1.5px solid #E3D2BD;border-radius:18px;padding:26px">
  <div style="font-size:12px;font-weight:bold;letter-spacing:2px;color:#A83030">منصة خُطّة</div>
  <h1 style="font-size:22px;margin:6px 0 4px">أهلاً بكِ في خُطّة 👋</h1>
  <p style="font-size:14px;line-height:1.9;color:#7A6A58;margin:0 0 18px">
    بقيت خطوةٌ واحدة: أكّدي بريدكِ لتفعيل حسابكِ.</p>

  <a href="{{ .ConfirmationURL }}" style="display:block;text-align:center;background:#C9453B;color:#fff;text-decoration:none;
     font-weight:bold;font-size:15px;padding:13px;border-radius:12px">تأكيد البريد</a>

  <p style="font-size:12px;line-height:1.9;color:#7A6A58;margin:16px 0 0">
    لم يعمل الزرّ؟ انسخي هذا الرابط والصقيه في المتصفّح:</p>
  <p style="font-size:11px;line-height:1.7;color:#A83030;direction:ltr;text-align:left;word-break:break-all;margin:4px 0 0">
    {{ .ConfirmationURL }}</p>

  <div style="border-top:1px solid #E3D2BD;margin:18px 0 0;padding-top:14px">
    <p style="font-size:12px;line-height:1.9;color:#7A6A58;margin:0">
      لم تسجّلي في خُطّة؟ تجاهلي هذه الرسالة ولن يُنشَأ شيء.</p>
  </div>
</div></body></html>
